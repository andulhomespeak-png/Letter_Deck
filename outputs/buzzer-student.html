<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fast Buzzer</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --muted: rgba(16, 11, 47, 0.62);
      --red: #ff2541;
      --green: #19c875;
      --blue: #087dff;
      --panel: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; }
    html {
      min-height: 100%;
      overflow-y: auto;
    }

    body {
      margin: 0;
      min-height: calc(100svh + 1px);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 50% 20%, rgba(255, 37, 65, 0.32), transparent 34%),
        radial-gradient(circle at 18% 84%, rgba(8, 125, 255, 0.25), transparent 32%),
        linear-gradient(145deg, #fff3d2, #eaf7ff 48%, #ffe1e8);
      overflow-x: hidden;
      overflow-y: auto;
      overscroll-behavior-y: auto;
    }

    .screen {
      min-height: 100svh;
      padding: max(16px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      display: grid;
      grid-template-rows: auto 1fr;
      gap: 14px;
    }

    .join,
    .status {
      border-radius: 28px;
      background: var(--panel);
      border: 1px solid rgba(255,255,255,0.72);
      box-shadow: 0 20px 60px rgba(16, 11, 47, 0.15);
      backdrop-filter: blur(16px);
    }

    .join {
      min-height: 100svh;
      padding: 24px;
      display: grid;
      align-content: center;
      gap: 16px;
    }

    .logo {
      width: min(340px, 92vw);
      margin: 0 auto 8px;
      filter: drop-shadow(0 14px 22px rgba(7, 20, 60, 0.2));
    }

    label {
      font-size: 0.8rem;
      font-weight: 1000;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input,
    button {
      width: 100%;
      border: 0;
      border-radius: 20px;
      min-height: 58px;
      padding: 0 18px;
      font: inherit;
      font-weight: 1000;
      user-select: none;
      -webkit-user-select: none;
    }

    input {
      background: #fff;
      color: var(--ink);
      box-shadow: inset 0 0 0 1px rgba(16, 11, 47, 0.12);
      font-size: 1.15rem;
    }

    .join button {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #3024d8);
      box-shadow: 0 14px 28px rgba(48, 36, 216, 0.24);
    }

    .join-error {
      min-height: 24px;
      margin: 0;
      color: #a00018;
      font-weight: 1000;
      text-align: center;
    }

    .status {
      padding: 14px;
      display: grid;
      grid-template-columns: minmax(0, 1.25fr) minmax(96px, 0.75fr);
      gap: 12px;
      align-items: stretch;
    }

    .status p {
      margin: 0;
    }

    .kicker {
      color: var(--muted);
      font-size: 0.72rem;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .main-status {
      margin-top: 2px;
      font-size: clamp(1.25rem, 7vw, 2.3rem);
      font-weight: 1000;
      line-height: 0.95;
      overflow-wrap: anywhere;
    }

    .rank-block,
    .room-block {
      min-width: 0;
      display: grid;
      align-content: center;
    }

    .rank-block {
      gap: 5px;
      padding: 12px 14px;
      border-radius: 22px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.98), rgba(255, 244, 206, 0.94)),
        radial-gradient(circle at 18% 0%, rgba(255, 37, 65, 0.18), transparent 44%);
      box-shadow: inset 0 0 0 1px rgba(16, 11, 47, 0.08), 0 10px 24px rgba(16, 11, 47, 0.1);
    }

    .room-block {
      justify-items: end;
      gap: 6px;
      text-align: right;
    }

    .round {
      min-width: 0;
      padding: 9px 11px;
      border-radius: 18px;
      background: #fff;
      text-align: center;
      font-weight: 1000;
      color: var(--blue);
      box-shadow: inset 0 0 0 1px rgba(16, 11, 47, 0.1);
    }

    .mobile-rank {
      padding: 0;
      border-radius: 0;
      background: transparent;
      color: var(--ink);
      font-size: clamp(1.72rem, 9vw, 3rem);
      line-height: 0.95;
      font-weight: 1000;
      text-align: left;
      box-shadow: none;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      text-shadow: 0 3px 0 rgba(255, 212, 71, 0.38);
    }

    .score-line {
      color: var(--muted);
      font-size: clamp(0.95rem, 4.6vw, 1.25rem);
      font-weight: 1000;
    }

    .room-code {
      color: var(--muted);
      font-size: 0.78rem;
      font-weight: 1000;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .pad {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      align-items: center;
      justify-items: center;
      gap: 12px;
    }

    .trivia-card {
      width: min(94vw, 520px);
      border-radius: 24px;
      padding: 14px;
      background: rgba(255,255,255,0.9);
      border: 1px solid rgba(16, 11, 47, 0.1);
      box-shadow: 0 14px 36px rgba(16, 11, 47, 0.12);
      text-align: center;
    }

    .trivia-meta {
      margin: 0 0 6px;
      color: var(--blue);
      font-size: 0.72rem;
      font-weight: 1000;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .trivia-question {
      margin: 0;
      font-size: clamp(1.3rem, 7vw, 2.2rem);
      line-height: 1;
      font-weight: 1000;
      overflow-wrap: anywhere;
    }

    .trivia-answer {
      margin: 8px 0 0;
      color: #058247;
      font-weight: 1000;
    }

    .trivia-choice-list {
      margin: 10px auto 0;
      display: grid;
      gap: 7px;
    }

    .trivia-choice {
      border-radius: 14px;
      padding: 9px 10px;
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(16, 11, 47, 0.1);
      font-size: clamp(0.95rem, 4.4vw, 1.16rem);
      font-weight: 1000;
    }

    .trivia-choice.is-attempted {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
    }

    .trivia-choice.is-correct {
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
    }

    .buzz {
      width: min(82vw, 430px);
      aspect-ratio: 1;
      border-radius: 50%;
      color: #fff;
      font-size: clamp(3.1rem, 18vw, 6.5rem);
      letter-spacing: 0;
      background: radial-gradient(circle at 35% 25%, #ffb3bf, var(--red) 50%, #990015);
      box-shadow: 0 28px 0 #7d0717, 0 48px 90px rgba(153, 0, 21, 0.38);
      border: 12px solid rgba(255,255,255,0.7);
      transition: transform 18ms linear, box-shadow 70ms ease, filter 120ms ease, opacity 120ms ease;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      will-change: transform;
    }

    .buzz.is-pressing {
      transform: translateY(18px) scale(0.98);
      box-shadow: 0 10px 0 #7d0717, 0 20px 38px rgba(153, 0, 21, 0.3);
    }

    .buzz:disabled {
      opacity: 0.52;
      filter: grayscale(0.45);
    }

    .turn-card {
      position: relative;
      width: min(92vw, 430px);
      min-height: min(46vh, 360px);
      display: grid;
      place-items: center;
      border-radius: 34px;
      padding: 24px;
      text-align: center;
      background: rgba(255,255,255,0.9);
      box-shadow: inset 0 -18px 38px rgba(255, 138, 0, 0.1), 0 24px 70px rgba(16, 11, 47, 0.18);
      border: 1px solid rgba(255,255,255,0.72);
      animation: turnPop 280ms ease both;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .turn-card.is-locked {
      background:
        radial-gradient(circle at 50% 0%, rgba(255, 212, 71, 0.34), transparent 38%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(255, 238, 227, 0.94)),
        rgba(255,255,255,0.92);
      border-color: rgba(255, 37, 65, 0.18);
    }

    .turn-card.is-held {
      background:
        radial-gradient(circle at 50% 0%, rgba(11, 130, 255, 0.2), transparent 38%),
        linear-gradient(145deg, rgba(255, 255, 255, 0.96), rgba(232, 245, 255, 0.94));
      border-color: rgba(11, 130, 255, 0.18);
    }

    .turn-card.is-locked .turn-name,
    .turn-card.is-held .turn-name {
      color: #7d0717;
      font-size: clamp(2.1rem, 10vw, 4.2rem);
      line-height: 0.94;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      text-shadow: 0 4px 0 rgba(255, 212, 71, 0.44), 0 12px 26px rgba(153, 0, 21, 0.16);
    }

    .turn-card.is-trivia .turn-name {
      font-size: clamp(1.65rem, 8vw, 3.1rem);
      line-height: 1;
    }

    .turn-name {
      margin: 0;
      color: var(--red);
      font-size: clamp(3rem, 17vw, 6.8rem);
      line-height: 0.88;
      font-weight: 1000;
      overflow-wrap: anywhere;
      text-shadow: 0 7px 0 rgba(16, 11, 47, 0.08);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .flash-good {
      animation: flashGood 520ms ease both;
    }

    .flash-bad {
      animation: flashBad 520ms ease both;
    }

    .hidden { display: none !important; }

    @keyframes flashGood {
      0%, 100% { background-color: transparent; }
      30% { background-color: rgba(25, 200, 117, 0.45); }
    }

    @keyframes flashBad {
      0%, 100% { background-color: transparent; }
      30% { background-color: rgba(255, 37, 65, 0.34); }
    }

    @keyframes turnPop {
      from { transform: scale(0.88); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

  </style>
</head>
<body>
  <section class="join" id="joinView">
    <p>Connect through the Friendzy QR.</p>
    <input id="nameInput" type="hidden" autocomplete="name" maxlength="34">
    <button id="joinBtn" hidden type="button">Join</button>
    <p class="join-error" id="joinError"></p>
  </section>

  <main class="screen hidden" id="gameView">
    <header class="status">
      <div class="rank-block">
        <div class="mobile-rank" id="rankText">Position --</div>
        <div class="score-line" id="scoreText">0 pts</div>
      </div>
      <div class="room-block">
        <div class="round" id="roundText">Round 0</div>
        <div class="room-code" id="roomLabel">Room</div>
        <p class="main-status hidden" id="statusText">Waiting</p>
      </div>
    </header>

    <section class="pad">
      <div class="trivia-card hidden" id="triviaCard">
        <p class="trivia-meta" id="triviaMeta">Trivia</p>
        <p class="trivia-question" id="triviaQuestion">Question</p>
        <p class="trivia-answer hidden" id="triviaAnswer"></p>
      </div>
      <button class="buzz" id="buzzBtn" type="button" disabled>BUZZ</button>
      <div class="turn-card hidden" id="turnCard">
        <h1 class="turn-name" id="turnName">Player got the turn!</h1>
      </div>
    </section>
  </main>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = String(params.get("code") || "").toUpperCase();
    const autoName = String(params.get("name") || "").trim();
    const classroomCode = String(params.get("classroom") || "").toUpperCase();
    const classroomPlayerId = params.get("classroomPlayerId") || (classroomCode ? localStorage.getItem(`friendzy-player-${classroomCode}`) || "" : "");
    const shouldAutoJoin = params.get("auto") === "1";
    const savedFriendzyName = classroomCode ? String(localStorage.getItem(`friendzy-name-${classroomCode}`) || "").trim() : "";
    const effectiveAutoName = autoName || savedFriendzyName;
    const effectiveShouldAutoJoin = shouldAutoJoin || (!!classroomCode && !!effectiveAutoName);
    const joinView = document.getElementById("joinView");
    const gameView = document.getElementById("gameView");
    const nameInput = document.getElementById("nameInput");
    const joinBtn = document.getElementById("joinBtn");
    const joinError = document.getElementById("joinError");
    const roomLabel = document.getElementById("roomLabel");
    const statusText = document.getElementById("statusText");
    const roundText = document.getElementById("roundText");
    const rankText = document.getElementById("rankText");
    const scoreText = document.getElementById("scoreText");
    const buzzBtn = document.getElementById("buzzBtn");
    const turnCard = document.getElementById("turnCard");
    const turnName = document.getElementById("turnName");
    const triviaCard = document.getElementById("triviaCard");
    const triviaMeta = document.getElementById("triviaMeta");
    const triviaQuestion = document.getElementById("triviaQuestion");
    const triviaAnswer = document.getElementById("triviaAnswer");

    let room = null;
    let player = null;
    let socket = null;
    let pollTimer = null;
    let lastRoundSubmitted = 0;
    let wakeLock = null;
    let classroomPollTimer = null;

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function leaveDeadRoom(message = "This room was reset. Join the Friendzy session again.") {
      if (classroomCode) {
        window.location.href = `./student-hub.html?code=${encodeURIComponent(classroomCode)}`;
        return;
      }
      if (socket) {
        try {
          socket.close();
        } catch (_) {}
        socket = null;
      }
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
      room = null;
      player = null;
      gameView.classList.add("hidden");
      joinView.classList.remove("hidden");
      joinError.textContent = message;
      buzzBtn.disabled = true;
    }

    function requireFriendzyJoin() {
      if (effectiveShouldAutoJoin && effectiveAutoName) return false;
      if (classroomCode) {
        window.location.replace(`./student-hub.html?code=${encodeURIComponent(classroomCode)}`);
        return true;
      }
      joinError.textContent = "Scan the Friendzy QR to join this activity.";
      return true;
    }

    async function api(path, payload = null, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: payload ? { "Content-Type": "application/json" } : undefined,
        body: payload ? JSON.stringify(payload) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function returnToClassroomHub() {
      if (!classroomCode) return;
      window.location.href = `./student-hub.html?code=${encodeURIComponent(classroomCode)}`;
    }

    function getSyncedActivityUrl(activeToolCode) {
      return `./buzzer-student.html?code=${encodeURIComponent(activeToolCode)}&name=${encodeURIComponent(effectiveAutoName)}&classroom=${encodeURIComponent(classroomCode)}&classroomPlayerId=${encodeURIComponent(classroomPlayerId)}&auto=1`;
    }

    async function pollClassroomRoute() {
      if (!classroomCode) return;
      try {
        const data = await api(`/api/classroom/room?code=${encodeURIComponent(classroomCode)}`, null, "GET");
        const activeTool = String(data.room?.activeTool || "standby");
        const activeToolCode = String(data.room?.activeToolCode || "");
        if (activeTool === "buzzer" && activeToolCode && activeToolCode !== code && effectiveAutoName) {
          window.location.replace(getSyncedActivityUrl(activeToolCode));
          return;
        }
        if (activeTool !== "buzzer" || activeToolCode !== code) {
          returnToClassroomHub();
          return;
        }
      } catch (_) {
        returnToClassroomHub();
        return;
      } finally {
        classroomPollTimer = setTimeout(pollClassroomRoute, 1000);
      }
    }

    async function syncClassroomBeforeJoin() {
      if (!classroomCode) return true;
      try {
        const data = await api(`/api/classroom/room?code=${encodeURIComponent(classroomCode)}`, null, "GET");
        const activeTool = String(data.room?.activeTool || "standby");
        const activeToolCode = String(data.room?.activeToolCode || "");
        if (activeTool !== "buzzer" || !activeToolCode) {
          returnToClassroomHub();
          return false;
        }
        if (activeToolCode !== code) {
          if (effectiveAutoName) {
            window.location.replace(getSyncedActivityUrl(activeToolCode));
          } else {
            returnToClassroomHub();
          }
          return false;
        }
        return true;
      } catch (_) {
        returnToClassroomHub();
        return false;
      }
    }

    function getSocketUrl() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      return `${protocol}//${window.location.host}/ws/buzzer?code=${encodeURIComponent(room.code)}`;
    }

    function flash(tone) {
      document.body.classList.remove("flash-good", "flash-bad");
      document.body.offsetHeight;
      document.body.classList.add(tone === "good" ? "flash-good" : "flash-bad");
    }

    function ordinal(value) {
      const number = Number(value) || 0;
      const mod100 = number % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${number}th`;
      switch (number % 10) {
        case 1: return `${number}st`;
        case 2: return `${number}nd`;
        case 3: return `${number}rd`;
        default: return `${number}th`;
      }
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") {
        return;
      }
      try {
        if (wakeLock && !wakeLock.released) {
          return;
        }
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });
      } catch (_) {}
    }

    function render() {
      if (!room || !player) return;
      roomLabel.textContent = `Room ${classroomCode || room.code}`;
      roundText.textContent = `Round ${room.roundId}`;
      const trivia = room.trivia || null;
      const attemptedTriviaOptions = Array.isArray(trivia?.attemptedOptionIndexes) ? trivia.attemptedOptionIndexes : [];
      const showTriviaQuestion = !!room.triviaMode && !!trivia && (!room.buzzerHeld || !!room.winner || !!trivia.answerVisible || attemptedTriviaOptions.length > 0);
      const hasTrivia = !!room.triviaMode && !!trivia && showTriviaQuestion;
      triviaCard.classList.toggle("hidden", !showTriviaQuestion);
      if (showTriviaQuestion) {
        triviaMeta.textContent = `${trivia.category} - ${Number(trivia.index || 0) + 1}/${trivia.total}`;
        const choices = trivia.type === "multiple"
          ? `<div class="trivia-choice-list">${(trivia.options || []).map((option, index) => `
            <div class="trivia-choice ${attemptedTriviaOptions.includes(index) ? "is-attempted" : ""} ${trivia.answerVisible && index === Number(trivia.correctOptionIndex || 0) ? "is-correct" : ""}">${escapeHtml(option)}</div>
          `).join("")}</div>`
          : "";
        triviaQuestion.innerHTML = `${escapeHtml(trivia.question)}${choices}`;
        triviaAnswer.textContent = trivia.answerVisible ? `Answer: ${trivia.answer}` : "";
        triviaAnswer.classList.toggle("hidden", !trivia.answerVisible);
      }
      const didPlay = (item) => !!item.hasPlayed || Number(item.score || 0) !== 0;
      const rankedPlayers = Array.isArray(room.players)
        ? room.players.slice().sort((a, b) => {
          const playedDiff = Number(didPlay(b)) - Number(didPlay(a));
          if (playedDiff) return playedDiff;
          const scoreDiff = Number(b.score || 0) - Number(a.score || 0);
          return scoreDiff || String(a.name || "").localeCompare(String(b.name || ""));
        })
        : [];
      const positionedPlayers = rankedPlayers.filter(didPlay);
      const rankIndex = positionedPlayers.findIndex((item) => item.id === player.id);
      const ownScore = rankedPlayers.find((item) => item.id === player.id)?.score || 0;
      rankText.textContent = rankIndex >= 0 ? `${ordinal(rankIndex + 1)} place` : "No position yet";
      scoreText.textContent = `${ownScore} pts`;

      const isLive = room.status === "live";
      const hasWinner = !!room.winner;
      const isHeld = !!room.buzzerHeld;
      const lockedOutPlayers = Array.isArray(room.lockedOutPlayers) ? room.lockedOutPlayers : [];
      const isLockedOut = lockedOutPlayers.includes(player.id);
      const alreadyPressed = lastRoundSubmitted === room.roundId;
      buzzBtn.disabled = !isLive || hasWinner || alreadyPressed || isLockedOut || isHeld;
      buzzBtn.classList.toggle("hidden", hasWinner || isLockedOut || isHeld);
      turnCard.classList.toggle("hidden", !hasWinner && !isLockedOut && !isHeld);
      turnCard.classList.toggle("is-locked", isLockedOut);
      turnCard.classList.toggle("is-held", isHeld && !hasWinner && !isLockedOut);
      turnCard.classList.toggle("is-trivia", hasTrivia);

      if (!isLive) {
        statusText.textContent = "";
        turnCard.classList.add("hidden");
        turnCard.classList.remove("is-locked");
        turnCard.classList.remove("is-held");
        buzzBtn.classList.remove("hidden");
        return;
      }

      if (isHeld && !hasWinner && !isLockedOut) {
        turnName.textContent = "Buzzers on hold.";
        statusText.textContent = "";
        return;
      }

      if (isLockedOut) {
        turnName.textContent = "Turn used. Wait for the next round to buzz again.";
        statusText.textContent = "";
        return;
      }

      if (hasWinner) {
        const isWinner = room.winner.playerId === player.id;
        turnName.textContent = isWinner ? "You got the turn!" : `${room.winner.playerName} got the turn!`;
        statusText.textContent = "";
        return;
      }

      turnCard.classList.add("hidden");
      turnCard.classList.remove("is-locked");
      buzzBtn.classList.remove("hidden");
      statusText.textContent = "";
    }

    function connectSocket() {
      if (!room || socket) return;
      try {
        socket = new WebSocket(getSocketUrl());
      } catch (_) {
        pollRoom();
        return;
      }
      socket.addEventListener("message", (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload?.type === "buzzer-room" && payload.room) {
            room = payload.room;
            render();
          } else if (payload?.type === "buzzer-room-deleted") {
            leaveDeadRoom();
          }
        } catch (_) {}
      });
      socket.addEventListener("close", () => {
        socket = null;
        pollRoom();
      });
      socket.addEventListener("error", () => {
        socket = null;
        pollRoom();
      });
    }

    async function pollRoom() {
      if (!room || pollTimer) return;
      try {
        const data = await api(`/api/buzzer/room?code=${encodeURIComponent(room.code)}`, null, "GET");
        room = data.room;
        render();
      } catch (_) {
        leaveDeadRoom("This room is no longer available. Join the Friendzy session again.");
      } finally {
        pollTimer = setTimeout(() => {
          pollTimer = null;
          if (!socket) pollRoom();
        }, 750);
      }
    }

    async function joinRoom() {
      if (!code) {
        joinError.textContent = "This link does not include a room code.";
        return;
      }
      requestWakeLock();
      joinError.textContent = "";
      const data = await api("/api/buzzer/join", { code, name: nameInput.value });
      player = data.player;
      room = data.room;
      joinView.classList.add("hidden");
      gameView.classList.remove("hidden");
      render();
      connectSocket();
    }

    async function buzz() {
      if (!room || !player || buzzBtn.disabled) return;
      requestWakeLock();
      lastRoundSubmitted = room.roundId;
      buzzBtn.disabled = true;
      try {
        const data = await api("/api/buzzer/buzz", {
          code: room.code,
          playerId: player.id,
          playerName: player.name,
          roundId: room.roundId
        });
        room = data.room;
        if (data.accepted) {
          flash("good");
        } else if (data.held) {
          flash("bad");
        } else if (data.lockedOut) {
          flash("bad");
        } else {
          flash("bad");
        }
        render();
      } catch (error) {
        flash("bad");
        render();
      }
    }

    joinBtn.addEventListener("click", () => joinRoom().catch((error) => {
      joinError.textContent = error.message || "Could not join room.";
    }));
    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        joinRoom().catch((error) => {
          joinError.textContent = error.message || "Could not join room.";
        });
      }
    });
    function releaseBuzzPress() {
      buzzBtn.classList.remove("is-pressing");
    }

    buzzBtn.addEventListener("pointerdown", () => {
      if (!buzzBtn.disabled) {
        buzzBtn.classList.add("is-pressing");
      }
      buzz();
    });
    buzzBtn.addEventListener("pointerup", releaseBuzzPress, { passive: true });
    buzzBtn.addEventListener("pointercancel", releaseBuzzPress, { passive: true });
    buzzBtn.addEventListener("pointerleave", releaseBuzzPress, { passive: true });

    ["click", "pointerdown", "touchstart", "keydown"].forEach((eventName) => {
      document.addEventListener(eventName, requestWakeLock, { passive: true });
    });
    window.addEventListener("focus", requestWakeLock);
    window.addEventListener("pageshow", requestWakeLock);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        requestWakeLock();
      }
    });
    setInterval(() => {
      if (document.visibilityState === "visible" && player) {
        requestWakeLock();
      }
    }, 12000);

    async function bootFromFriendzy() {
      const isSynced = await syncClassroomBeforeJoin();
      if (!isSynced) return;
      if (requireFriendzyJoin()) {
        nameInput.disabled = true;
        joinBtn.disabled = true;
      } else if (!code) {
        nameInput.disabled = true;
        joinBtn.disabled = true;
        joinError.textContent = "Missing room code.";
      } else if (effectiveAutoName) {
        nameInput.value = effectiveAutoName;
        if (effectiveShouldAutoJoin) {
          joinBtn.disabled = true;
          joinRoom().catch((error) => {
            joinBtn.disabled = false;
            joinError.textContent = error.message || "Could not join room.";
          });
        }
      }
      if (classroomCode) {
        clearTimeout(classroomPollTimer);
        pollClassroomRoute();
      }
    }
    bootFromFriendzy();

    window.addEventListener("pageshow", (event) => {
      if (!classroomCode) return;
      clearTimeout(classroomPollTimer);
      pollClassroomRoute();
    });
  </script>
</body>
</html>
