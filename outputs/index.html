<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friendzy</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --blue: #0b82ff;
      --orange: #ff7a00;
      --red: #ff2f45;
      --green: #22c66f;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 16%, rgba(11, 130, 255, 0.28), transparent 32%),
        radial-gradient(circle at 88% 20%, rgba(255, 122, 0, 0.28), transparent 30%),
        linear-gradient(135deg, #fff9dc 0%, #e8f5ff 46%, #ffe8db 100%);
      overflow-x: hidden;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(18px, 4vw, 44px) 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(18px, 4vw, 36px);
    }

    .intro {
      padding: clamp(18px, 3vw, 28px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,0.82), rgba(255,255,255,0.48));
      box-shadow: 0 22px 70px rgba(17, 12, 48, 0.12);
      backdrop-filter: blur(16px);
      display: grid;
      place-items: center;
    }

    h1 {
      margin: 0;
      width: 100%;
      font-family: "Franklin Gothic Heavy", "Arial Black", "Trebuchet MS", sans-serif;
      font-size: clamp(3rem, 8.4vw, 7.4rem);
      line-height: 0.86;
      letter-spacing: -0.055em;
      text-align: center;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(180deg, #fffdf2 0%, #ffe066 34%, #ff8a00 70%, #ff2f45 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: clamp(1px, 0.16vw, 2px) #073a9b;
      text-shadow:
        0 4px 0 #0b82ff,
        0 10px 0 rgba(255, 122, 0, 0.42),
        0 20px 34px rgba(16, 11, 47, 0.24);
      filter: drop-shadow(0 0 18px rgba(11, 130, 255, 0.22));
    }

    .grid {
      align-self: center;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(18px, 3vw, 30px);
    }

    .activity {
      position: relative;
      min-height: clamp(330px, 44vh, 470px);
      padding: clamp(18px, 3vw, 30px);
      border: 1px solid rgba(255,255,255,0.82);
      border-radius: 34px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(16, 11, 47, 0.16);
      text-decoration: none;
      color: inherit;
      display: grid;
      grid-template-rows: auto 1fr auto;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .activity:hover {
      transform: translateY(-6px);
      box-shadow: 0 34px 90px rgba(16, 11, 47, 0.22);
    }

    .activity::before {
      content: "";
      position: absolute;
      inset: -40% -20% auto auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      opacity: 0.5;
      background: var(--blue);
      filter: blur(6px);
    }

    .activity.buzzer::before { background: var(--red); }
    .activity.wheel::before { background: var(--green); }
    .activity.timer::before { background: var(--orange); }
    .activity.poll::before { background: var(--green); }

    .tag {
      width: max-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(16, 11, 47, 0.08);
      font-weight: 1000;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      z-index: 1;
    }

    .visual {
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .activity-logo {
      width: min(96%, 420px);
      max-height: 260px;
      object-fit: contain;
      filter: drop-shadow(0 22px 30px rgba(7, 20, 60, 0.2));
    }

    .buzzer-logo,
    .wheel-logo,
    .timer-logo,
    .poll-logo {
      width: min(96%, 390px);
      max-height: 280px;
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 1080px) and (min-width: 821px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <section class="intro">
        <h1>Friendzy</h1>
      </section>
    </header>

    <section class="grid" aria-label="Activities">
      <a class="activity" href="/letter-clash">
        <span class="tag">Game</span>
        <div class="visual">
          <img class="activity-logo" src="./letter-clash-logo.png" alt="Letter Clash">
        </div>
      </a>

      <a class="activity buzzer" href="/buzzer">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo buzzer-logo" src="./buzzer-logo.png" alt="Fast Buzzer">
        </div>
      </a>

      <a class="activity wheel" href="/name-wheel">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo wheel-logo" src="./spin-the-wheel-logo.png" alt="Spin The Wheel">
        </div>
      </a>

      <a class="activity timer" href="/timer">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo timer-logo" src="./timer-logo.png" alt="Timer">
        </div>
      </a>

      <a class="activity poll" href="/quick-poll">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo poll-logo" src="./quick-poll-logo.png" alt="Quick Poll">
        </div>
      </a>
    </section>
  </main>

  <script src="./friendzy-panel.js"></script>
</body>
</html>
