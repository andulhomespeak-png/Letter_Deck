<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Friendzy</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --blue: #0b82ff;
      --orange: #ff7a00;
      --red: #ff2f45;
      --green: #22c66f;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 16%, rgba(11, 130, 255, 0.28), transparent 32%),
        radial-gradient(circle at 88% 20%, rgba(255, 122, 0, 0.28), transparent 30%),
        linear-gradient(135deg, #fff9dc 0%, #e8f5ff 46%, #ffe8db 100%);
      overflow-x: hidden;
    }

    .shell {
      width: min(1180px, calc(100vw - 32px));
      min-height: 100vh;
      margin: 0 auto;
      padding: clamp(14px, 3.2vw, 34px) 0;
      display: grid;
      grid-template-rows: auto 1fr;
      gap: clamp(16px, 3vw, 28px);
    }

    .intro {
      position: relative;
      padding: clamp(14px, 2.2vw, 22px) clamp(18px, 3vw, 30px) clamp(13px, 2vw, 20px);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: clamp(24px, 3vw, 34px);
      background:
        radial-gradient(circle at 18% 0%, rgba(11, 130, 255, 0.18), transparent 34%),
        radial-gradient(circle at 82% 100%, rgba(255, 122, 0, 0.2), transparent 38%),
        linear-gradient(135deg, rgba(255,255,255,0.9), rgba(255,255,255,0.56));
      box-shadow: 0 18px 58px rgba(17, 12, 48, 0.13);
      backdrop-filter: blur(16px);
      display: grid;
      place-items: center;
      gap: clamp(4px, 0.8vw, 8px);
      overflow: hidden;
    }

    .intro::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: 0.85;
      width: clamp(120px, 18vw, 210px);
      height: clamp(120px, 18vw, 210px);
      right: -70px;
      top: -88px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 122, 0, 0.18), transparent 64%);
    }

    h1 {
      position: relative;
      z-index: 1;
      margin: 0;
      width: max-content;
      max-width: 100%;
      font-family: "Trebuchet MS", "Arial Rounded MT Bold", "Franklin Gothic Heavy", "Arial Black", sans-serif;
      font-size: clamp(3.05rem, 8vw, 6.8rem);
      line-height: 0.86;
      letter-spacing: -0.065em;
      text-align: center;
      text-transform: uppercase;
      color: transparent;
      transform: skewX(-3deg);
      background:
        linear-gradient(180deg, #ffffff 0%, #f8fdff 34%, #bfe9ff 62%, #2d9eff 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: clamp(1.8px, 0.26vw, 3.2px) #07286f;
      text-shadow:
        0 2px 0 #ffffff,
        0 5px 0 #0b82ff,
        0 9px 0 #0645b7,
        0 13px 20px rgba(16, 11, 47, 0.2);
      filter:
        drop-shadow(0 0 9px rgba(11, 130, 255, 0.18))
        drop-shadow(0 8px 0 rgba(255, 122, 0, 0.16));
    }

    h1::after {
      content: "";
      position: absolute;
      width: 0.14em;
      height: 0.14em;
      right: -0.08em;
      top: 0.06em;
      border-radius: 50%;
      background: var(--orange);
      box-shadow:
        -0.28em 0.1em 0 -0.045em #ffe066,
        -0.12em 0.28em 0 -0.055em var(--orange);
    }

    .intro-kicker {
      position: relative;
      z-index: 1;
      margin: 0;
      color: rgba(8, 40, 111, 0.74);
      font-size: clamp(0.68rem, 1.35vw, 0.9rem);
      font-weight: 1000;
      letter-spacing: clamp(0.15em, 0.58vw, 0.28em);
      text-align: center;
      text-transform: uppercase;
      text-shadow: 0 1px 0 rgba(255,255,255,0.9);
    }

    .grid {
      align-self: center;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: clamp(18px, 3vw, 30px);
    }

    .activity {
      position: relative;
      min-height: clamp(330px, 44vh, 470px);
      padding: clamp(18px, 3vw, 30px);
      border: 1px solid rgba(255,255,255,0.82);
      border-radius: 34px;
      overflow: hidden;
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(16, 11, 47, 0.16);
      text-decoration: none;
      color: inherit;
      display: grid;
      grid-template-rows: auto 1fr auto;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .activity:hover {
      transform: translateY(-6px);
      box-shadow: 0 34px 90px rgba(16, 11, 47, 0.22);
    }

    .activity::before {
      content: "";
      position: absolute;
      inset: -40% -20% auto auto;
      width: 260px;
      height: 260px;
      border-radius: 50%;
      opacity: 0.5;
      background: var(--blue);
      filter: blur(6px);
    }

    .activity.buzzer::before { background: var(--red); }
    .activity.wheel::before { background: var(--green); }
    .activity.timer::before { background: var(--orange); }
    .activity.poll::before { background: var(--green); }
    .activity.bingo::before { background: var(--blue); }

    .tag {
      width: max-content;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(16, 11, 47, 0.08);
      font-weight: 1000;
      text-transform: uppercase;
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      z-index: 1;
    }

    .visual {
      display: grid;
      place-items: center;
      z-index: 1;
    }

    .activity-logo {
      width: min(96%, 420px);
      max-height: 260px;
      object-fit: contain;
      filter: drop-shadow(0 22px 30px rgba(7, 20, 60, 0.2));
    }

    .buzzer-logo,
    .wheel-logo,
    .timer-logo,
    .poll-logo,
    .bingo-logo {
      width: min(96%, 390px);
      max-height: 280px;
    }

    .text-logo {
      position: relative;
      z-index: 1;
      margin: 0;
      font-size: clamp(3rem, 7vw, 5.4rem);
      line-height: 0.92;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: -0.06em;
      color: #fff;
      -webkit-text-stroke: 2px #071b63;
      text-shadow:
        0 4px 0 #0783ff,
        0 9px 0 #ff8a00,
        0 18px 30px rgba(7, 20, 60, 0.26);
      transform: rotate(-2deg);
    }

    .text-logo span {
      display: block;
      color: #ffd23d;
      -webkit-text-stroke-color: #071b63;
      text-shadow:
        0 4px 0 #ff4b18,
        0 12px 24px rgba(7, 20, 60, 0.22);
    }

    @media (max-width: 820px) {
      .grid { grid-template-columns: 1fr; }

      .intro {
        padding-inline: 14px;
      }

      h1 {
        font-size: clamp(2.8rem, 15vw, 4.4rem);
        -webkit-text-stroke-width: 1.5px;
        text-shadow:
          0 2px 0 #ffffff,
          0 4px 0 #0b82ff,
          0 7px 0 #0645b7,
          0 14px 22px rgba(16, 11, 47, 0.24);
      }
    }

    @media (max-width: 1080px) and (min-width: 821px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <section class="intro">
        <h1>Friendzy</h1>
        <p class="intro-kicker">Play &bull; Laugh &bull; Compete</p>
      </section>
    </header>

    <section class="grid" aria-label="Activities">
      <a class="activity" href="/letter-clash">
        <span class="tag">Game</span>
        <div class="visual">
          <img class="activity-logo" src="./letter-clash-logo.png" alt="Letter Clash">
        </div>
      </a>

      <a class="activity buzzer" href="/buzzer">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo buzzer-logo" src="./buzzer-logo.png" alt="Fast Buzzer">
        </div>
      </a>

      <a class="activity wheel" href="/name-wheel">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo wheel-logo" src="./spin-the-wheel-logo.png" alt="Spin The Wheel">
        </div>
      </a>

      <a class="activity timer" href="/timer">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo timer-logo" src="./timer-logo.png" alt="Timer">
        </div>
      </a>

      <a class="activity poll" href="/quick-poll">
        <span class="tag">Tool</span>
        <div class="visual">
          <img class="activity-logo poll-logo" src="./quick-poll-logo.png" alt="Quick Poll">
        </div>
      </a>

      <a class="activity bingo" href="/bingo">
        <span class="tag">Game</span>
        <div class="visual">
          <img class="activity-logo bingo-logo" src="./bingo-logo.png" alt="Bingo">
        </div>
      </a>
    </section>
  </main>

  <script src="./friendzy-panel.js"></script>
</body>
</html>
