<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Poll</title>
  <link rel="icon" type="image/png" href="./quick-poll-student-logo.png">
  <style>
    :root {
      --ink: #100b2f;
      --muted: rgba(16, 11, 47, 0.62);
      --line: rgba(16, 11, 47, 0.12);
      --blue: #087dff;
      --red: #ff2541;
      --green: #19c875;
      --orange: #ff8a00;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 14% 12%, rgba(8, 125, 255, 0.34), transparent 28%),
        radial-gradient(circle at 86% 18%, rgba(255, 138, 0, 0.3), transparent 30%),
        radial-gradient(circle at 50% 94%, rgba(25, 200, 117, 0.24), transparent 34%),
        linear-gradient(135deg, #fff4cf 0%, #eef8ff 46%, #ffe2e8 100%);
      display: grid;
      place-items: center;
      padding: 16px;
    }

    .card {
      width: min(100%, 480px);
      min-height: min(760px, calc(100dvh - 32px));
      padding: clamp(18px, 6vw, 30px);
      border-radius: 34px;
      border: 1px solid rgba(255,255,255,0.76);
      background: var(--panel);
      box-shadow: 0 28px 80px rgba(16, 11, 47, 0.18);
      backdrop-filter: blur(18px);
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr) auto;
      gap: 16px;
      overflow: hidden;
    }

    .hero {
      display: grid;
      place-items: center;
    }

    .tool-logo {
      width: min(82vw, 310px);
      max-height: 320px;
      object-fit: contain;
      filter: drop-shadow(0 20px 34px rgba(16, 11, 47, 0.18));
    }

    .form {
      display: grid;
      gap: 12px;
    }

    .reconnect {
      display: grid;
      gap: 12px;
      padding: 16px;
      border-radius: 24px;
      text-align: center;
      background: rgba(255,255,255,0.76);
      border: 1px solid var(--line);
    }

    .reconnect p {
      margin: 0;
      color: var(--muted);
      font-weight: 1000;
      line-height: 1.35;
    }

    .reconnect strong {
      color: var(--blue);
    }

    .reconnect-actions {
      display: grid;
    }

    label {
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 1000;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    input {
      width: 100%;
      min-height: 58px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 18px;
      font: inherit;
      font-size: 1.15rem;
      font-weight: 1000;
      color: var(--ink);
      background: rgba(255,255,255,0.94);
      outline: none;
    }

    input:focus {
      border-color: rgba(8, 125, 255, 0.4);
      box-shadow: 0 0 0 4px rgba(8, 125, 255, 0.12);
    }

    button {
      min-height: 58px;
      border: 0;
      border-radius: 999px;
      padding: 0 18px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 1000;
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 16px 36px rgba(255, 37, 65, 0.24);
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    .options {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 10px;
      padding-right: 2px;
    }

    .option {
      width: 100%;
      min-height: 64px;
      border-radius: 22px;
      color: var(--ink);
      background: rgba(255,255,255,0.86);
      border: 1px solid var(--line);
      box-shadow: 0 12px 26px rgba(16, 11, 47, 0.1);
    }

    .option.is-self {
      color: rgba(16, 11, 47, 0.44);
      background: rgba(255,255,255,0.44);
    }

    .nomination {
      display: grid;
      gap: 12px;
      align-content: center;
      padding: 8px 0;
    }

    .nomination-button {
      min-height: 84px;
      border-radius: 28px;
      font-size: clamp(1.35rem, 8vw, 2.15rem);
      background: linear-gradient(135deg, var(--blue), #3024d8);
      box-shadow: 0 20px 44px rgba(8, 125, 255, 0.26);
    }

    .nomination-button.is-sent {
      background: linear-gradient(135deg, var(--green), #039b52);
      box-shadow: 0 20px 44px rgba(25, 200, 117, 0.24);
    }

    .message {
      min-height: 54px;
      padding: 12px 14px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      text-align: center;
      color: var(--muted);
      font-weight: 1000;
      background: rgba(255,255,255,0.68);
      border: 1px solid var(--line);
    }

    .message.good {
      color: #075f35;
      background: rgba(220, 255, 238, 0.86);
      border-color: rgba(25, 200, 117, 0.28);
    }

    .message.bad {
      color: #8f0618;
      background: rgba(255, 226, 231, 0.86);
      border-color: rgba(255, 37, 65, 0.28);
    }

    .message.is-quiet {
      display: none;
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <section class="hero">
      <img class="tool-logo" src="./quick-poll-student-logo.png" alt="Quick Poll">
    </section>

    <form class="form" id="joinForm">
      <label for="nameInput">Enter your name or team name</label>
      <input id="nameInput" name="name" autocomplete="name" placeholder="Your name" required>
      <button id="joinBtn" type="submit">Join</button>
    </form>

    <section class="reconnect hidden" id="reconnectPanel">
      <p>This device is connected as <strong id="savedNameText">Player</strong>. You will continue participating under this name.</p>
      <div class="reconnect-actions">
        <button id="continueBtn" type="button">Continue</button>
      </div>
    </section>

    <section class="options" id="options"></section>

    <section class="nomination hidden" id="nominationPanel">
      <button class="nomination-button" id="nominateBtn" type="button">Nominate me</button>
    </section>

    <div class="message" id="message">Join the room and wait for the teacher to start.</div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = String(params.get("code") || "").toUpperCase();
    const autoName = String(params.get("name") || "").trim();
    const classroomCode = String(params.get("classroom") || "").toUpperCase();
    const shouldAutoJoin = params.get("auto") === "1";
    const playerKey = `quick-poll-player-${code}`;
    const nameKey = `quick-poll-name-${code}`;
    const voteKey = `quick-poll-vote-${code}`;
    const joinForm = document.getElementById("joinForm");
    const reconnectPanel = document.getElementById("reconnectPanel");
    const savedNameText = document.getElementById("savedNameText");
    const continueBtn = document.getElementById("continueBtn");
    const nameInput = document.getElementById("nameInput");
    const joinBtn = document.getElementById("joinBtn");
    const optionsEl = document.getElementById("options");
    const nominationPanel = document.getElementById("nominationPanel");
    const nominateBtn = document.getElementById("nominateBtn");
    const message = document.getElementById("message");

    let room = null;
    let playerId = Number(localStorage.getItem(playerKey) || 0);
    let playerName = localStorage.getItem(nameKey) || "";
    let votedPollId = Number(localStorage.getItem(voteKey) || 0);
    let awaitingReconnect = false;
    let removedByTeacher = false;
    let classroomPollTimer = null;

    if (playerName) {
      nameInput.value = playerName;
      savedNameText.textContent = playerName;
    } else if (autoName) {
      nameInput.value = autoName;
    }

    function setMessage(text, tone = "") {
      message.textContent = text;
      message.className = `message ${tone}`.trim();
    }

    function hideMessage() {
      message.className = "message is-quiet";
    }

    async function api(path, payload = null, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: payload ? { "Content-Type": "application/json" } : undefined,
        body: payload ? JSON.stringify(payload) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function returnToClassroomHub() {
      if (!classroomCode) return;
      window.location.href = `./student-hub.html?code=${encodeURIComponent(classroomCode)}`;
    }

    async function pollClassroomRoute() {
      if (!classroomCode) return;
      try {
        const data = await api(`/api/classroom/room?code=${encodeURIComponent(classroomCode)}`, null, "GET");
        const activeTool = String(data.room?.activeTool || "standby");
        const activeToolCode = String(data.room?.activeToolCode || "");
        if (activeTool !== "quick-poll" || activeToolCode !== code) {
          returnToClassroomHub();
          return;
        }
      } catch (_) {
        returnToClassroomHub();
        return;
      } finally {
        classroomPollTimer = setTimeout(pollClassroomRoute, 1000);
      }
    }

    function resetNominationButton() {
      nominateBtn.disabled = false;
      nominateBtn.classList.remove("is-sent");
      nominateBtn.textContent = "Nominate me";
    }

    function render() {
      if (!code) {
        setMessage("Missing room code. Scan the QR again.", "bad");
        return;
      }
      if (!playerId) {
        optionsEl.innerHTML = "";
        nominationPanel.classList.add("hidden");
        resetNominationButton();
        if (!awaitingReconnect && !removedByTeacher) {
          joinForm.classList.remove("hidden");
          reconnectPanel.classList.add("hidden");
          setMessage("Join the room and wait for the teacher to start.");
        }
        return;
      }
      if (awaitingReconnect) {
        optionsEl.innerHTML = "";
        nominationPanel.classList.add("hidden");
        resetNominationButton();
        joinForm.classList.add("hidden");
        reconnectPanel.classList.remove("hidden");
        hideMessage();
        return;
      }
      joinForm.classList.add("hidden");
      reconnectPanel.classList.add("hidden");
      const status = room?.status || "waiting";
      const pollId = Number(room?.pollId || 0);
      const alreadyVoted = votedPollId === pollId;
      const candidates = room?.candidates || [];
      const nomineeIds = (room?.nomineePlayerIds || []).map((id) => Number(id));
      const isNominated = nomineeIds.includes(Number(playerId));
      if (status !== "voting") {
        optionsEl.innerHTML = "";
        const canNominate = !!room?.nominationMode;
        nominationPanel.classList.toggle("hidden", !canNominate);
        nominateBtn.disabled = isNominated;
        nominateBtn.classList.toggle("is-sent", isNominated);
        nominateBtn.textContent = isNominated ? "Nomination sent" : "Nominate me";
        if (canNominate) {
          setMessage(isNominated ? "Your nomination was sent. Wait for the teacher's decision." : "You can nominate yourself as a candidate.", isNominated ? "good" : "");
          return;
        }
        resetNominationButton();
        setMessage(status === "closed" ? "Voting is closed. Watch the teacher screen." : `You are connected as ${playerName}. Wait for the teacher to start.`, status === "closed" ? "good" : "");
        return;
      }
      nominationPanel.classList.add("hidden");
      resetNominationButton();
      if (alreadyVoted) {
        optionsEl.innerHTML = "";
        setMessage("Vote submitted. Watch the teacher screen.", "good");
        return;
      }
      setMessage("Choose one option.", "");
      optionsEl.innerHTML = candidates.map((candidate) => {
        const isSelf = room.blockSelfVote && candidate.playerId === playerId;
        return `<button class="option ${isSelf ? "is-self" : ""}" data-id="${candidate.id}" ${isSelf ? "disabled" : ""} type="button">${escapeHtml(candidate.label)}</button>`;
      }).join("");
      optionsEl.querySelectorAll(".option").forEach((button) => {
        button.addEventListener("click", () => vote(button.dataset.id));
      });
    }

    function escapeHtml(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function joinPoll(name) {
      if (!code) {
        setMessage("Missing room code. Scan the QR again.", "bad");
        return;
      }
      if (!name) {
        setMessage("Type your name first.", "bad");
        nameInput.focus();
        return;
      }
      joinBtn.disabled = true;
      continueBtn.disabled = true;
      try {
        const data = await api("/api/poll/join", { code, name, playerId });
        room = data.room;
        playerId = data.player.id;
        playerName = data.player.name;
        awaitingReconnect = false;
        removedByTeacher = false;
        localStorage.setItem(playerKey, String(playerId));
        localStorage.setItem(nameKey, playerName);
        nameInput.disabled = true;
        joinBtn.textContent = "Join";
        joinForm.classList.add("hidden");
        reconnectPanel.classList.add("hidden");
        setMessage(`You are connected as ${playerName}. Wait for the teacher to start.`, "good");
        render();
      } catch (error) {
        setMessage(error.message || "Could not join this poll.", "bad");
        joinBtn.disabled = false;
        continueBtn.disabled = false;
      }
    }

    joinForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      await joinPoll(nameInput.value.trim());
    });

    continueBtn.addEventListener("click", () => {
      joinPoll(playerName || nameInput.value.trim());
    });

    nominateBtn.addEventListener("click", async () => {
      if (!room || !playerId) return;
      nominateBtn.disabled = true;
      try {
        const data = await api("/api/poll/nominate", { code, playerId });
        room = data.room;
        setMessage("Your nomination was sent. Wait for the teacher's decision.", "good");
        render();
      } catch (error) {
        setMessage(error.message || "Could not send your nomination.", "bad");
        render();
      }
    });

    if (!playerName && autoName && shouldAutoJoin) {
      joinPoll(autoName);
    }
    if (classroomCode) {
      clearTimeout(classroomPollTimer);
      pollClassroomRoute();
    }

    window.addEventListener("pageshow", (event) => {
      if (!classroomCode || !event.persisted) return;
      clearTimeout(classroomPollTimer);
      pollClassroomRoute();
    });

    async function vote(candidateId) {
      if (!room || !playerId) return;
      optionsEl.querySelectorAll("button").forEach((button) => { button.disabled = true; });
      try {
        const data = await api("/api/poll/vote", { code, playerId, candidateId });
        room = data.room;
        votedPollId = Number(room.pollId || 0);
        localStorage.setItem(voteKey, String(votedPollId));
        setMessage("Vote submitted. Watch the teacher screen.", "good");
        render();
      } catch (error) {
        setMessage(error.message || "Could not submit vote.", "bad");
        render();
      }
    }

    async function pollRoom() {
      if (!code) return;
      try {
        const data = await api(`/api/poll/room?code=${encodeURIComponent(code)}`, null, "GET");
        room = data.room;
        if (playerId && !room.players.some((player) => player.id === playerId)) {
          playerId = 0;
          playerName = "";
          awaitingReconnect = false;
          removedByTeacher = true;
          localStorage.removeItem(playerKey);
          localStorage.removeItem(nameKey);
          joinForm.classList.remove("hidden");
          reconnectPanel.classList.add("hidden");
          nameInput.disabled = false;
          joinBtn.disabled = false;
          joinBtn.textContent = "Join";
          nameInput.value = "";
          setMessage("You were removed from this poll. Ask before joining again.", "bad");
          optionsEl.innerHTML = "";
          return;
        }
        render();
      } catch (_) {
        setMessage("Room not found. Scan the QR again.", "bad");
      } finally {
        setTimeout(pollRoom, 1000);
      }
    }

    window.addEventListener("load", async () => {
      if (!playerName) {
        nameInput.focus();
      } else {
        joinForm.classList.add("hidden");
        reconnectPanel.classList.remove("hidden");
        hideMessage();
      }
      pollRoom();
    });
  </script>
</body>
</html>
