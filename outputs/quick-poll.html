<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Poll</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --muted: rgba(16, 11, 47, 0.62);
      --line: rgba(16, 11, 47, 0.12);
      --blue: #087dff;
      --red: #ff2541;
      --green: #19c875;
      --orange: #ff8a00;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 16%, rgba(8, 125, 255, 0.34), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(255, 138, 0, 0.3), transparent 30%),
        radial-gradient(circle at 52% 90%, rgba(25, 200, 117, 0.22), transparent 34%),
        linear-gradient(135deg, #fff4cf 0%, #eef8ff 46%, #ffe2e8 100%);
    }

    .app {
      height: 100vh;
      height: 100dvh;
      padding: clamp(8px, 1.3vw, 16px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(310px, 390px);
      gap: clamp(8px, 1.3vw, 16px);
    }

    .main,
    .side {
      min-height: 0;
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: clamp(24px, 3vw, 34px);
      background: var(--panel);
      box-shadow: 0 26px 78px rgba(16, 11, 47, 0.16);
      backdrop-filter: blur(18px);
    }

    .main {
      padding: clamp(12px, 1.7vw, 22px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, 1.4vw, 16px);
      overflow: clip;
    }

    .topbar {
      display: grid;
      grid-template-columns: minmax(260px, 500px) auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .mode-label {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 1000;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.78;
    }

    .mode-controls {
      display: flex;
      align-items: stretch;
      gap: 8px;
    }

    .self-switch {
      min-width: 142px;
      min-height: 62px;
      padding: 7px 10px;
      border-radius: 22px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-rows: auto auto;
      align-items: center;
      gap: 3px 8px;
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--line);
      box-shadow: 0 12px 26px rgba(16, 11, 47, 0.1);
    }

    .self-switch:hover,
    .self-switch:active {
      transform: none;
    }

    .self-switch .mode-label {
      grid-column: 1 / -1;
      text-align: center;
      color: var(--muted);
    }

    .self-switch-text {
      font-size: 0.95rem;
      font-weight: 1000;
      line-height: 1;
      color: var(--green);
      text-align: center;
    }

    .self-switch-knob {
      width: 40px;
      height: 22px;
      padding: 3px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green), #039b52);
      transition: background 140ms ease;
    }

    .self-switch-knob::before {
      content: "";
      display: block;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 4px 10px rgba(16, 11, 47, 0.24);
      transition: transform 140ms ease;
    }

    .self-switch.is-active {
      color: var(--ink);
      background: rgba(255,255,255,0.94);
    }

    .self-switch.is-active .self-switch-text {
      color: var(--red);
    }

    .self-switch.is-active .self-switch-knob {
      background: linear-gradient(135deg, var(--red), #a8001a);
    }

    .self-switch.is-active .self-switch-knob::before {
      transform: translateX(18px);
    }

    .nomination-toggle {
      min-width: 150px;
      min-height: 62px;
      padding: 7px 12px;
      border-radius: 22px;
      display: grid;
      place-items: center;
      gap: 4px;
      color: var(--ink);
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--line);
    }

    .nomination-toggle.is-active {
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
      border-color: transparent;
      box-shadow: 0 14px 32px rgba(25, 200, 117, 0.22);
    }

    .nomination-value {
      font-size: 1.15rem;
      line-height: 1;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: end;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-weight: 1000;
      color: var(--ink);
      background: rgba(255,255,255,0.94);
      box-shadow: 0 12px 26px rgba(16, 11, 47, 0.12);
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
      box-shadow: 0 14px 32px rgba(25, 200, 117, 0.22);
    }

    .danger {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
    }

    .stage {
      min-height: 0;
      border: 1px dashed rgba(16, 11, 47, 0.14);
      border-radius: clamp(24px, 4vw, 42px);
      padding: clamp(12px, 2vw, 24px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,255,255,0.18)),
        radial-gradient(circle at 50% 48%, rgba(8, 125, 255, 0.14), transparent 34%);
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 14px;
    }

    .results {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 12px;
      padding-right: 4px;
    }

    .empty-results {
      align-self: start;
      padding: 10px 4px;
      color: var(--muted);
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 1000;
    }

    .result-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-radius: 24px;
      background: rgba(255,255,255,0.84);
      border: 1px solid var(--line);
      box-shadow: 0 14px 30px rgba(16, 11, 47, 0.09);
    }

    .result-name {
      min-width: 0;
      font-size: clamp(1.05rem, 2vw, 1.55rem);
      font-weight: 1000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar {
      grid-column: 1 / -1;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(16,11,47,0.08);
    }

    .bar span {
      display: block;
      height: 100%;
      width: var(--w, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--orange));
      transition: width 220ms ease;
    }

    .votes {
      font-size: 1.2rem;
      font-weight: 1000;
      color: var(--blue);
    }

    .side {
      padding: clamp(14px, 1.8vw, 22px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
    }

    .side-content {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 12px;
    }

    .side.is-players-source .side-content {
      grid-template-rows: minmax(0, 1fr);
    }

    .side-head,
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .side-head {
      justify-content: flex-start;
    }

    h2,
    h3 {
      margin: 0;
      color: #3e3580;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .qr-box {
      display: grid;
      place-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      cursor: zoom-in;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .qr-box:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 16px 34px rgba(16, 11, 47, 0.14);
    }

    .qr-box img {
      width: min(100%, 190px);
      border-radius: 18px;
      background: #fff;
      image-rendering: pixelated;
    }

    .room-code {
      margin: 0;
      font-weight: 1000;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }

    .options-entry {
      align-self: stretch;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 118px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      font: inherit;
      font-weight: 900;
      background: rgba(255,255,255,0.74);
      outline: none;
    }

    .topbar textarea {
      min-height: 44px;
      border-radius: 18px;
      padding: 10px 12px;
      overflow-y: hidden;
    }

    .option-submit {
      width: 100%;
    }

    .topbar .option-submit {
      width: auto;
      align-self: center;
      min-width: 92px;
    }

    .remove-option {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 10px 20px rgba(168, 0, 26, 0.18);
      opacity: 0;
      pointer-events: none;
    }

    .result-row:hover .remove-option,
    .result-row:focus-within .remove-option {
      opacity: 1;
      pointer-events: auto;
    }

    .players {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .player {
      min-height: 48px;
      padding: 8px 9px 8px 14px;
      border-radius: 18px;
      font-weight: 1000;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      align-items: center;
      gap: 10px;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.96), rgba(232,245,255,0.86)),
        radial-gradient(circle at 8% 20%, rgba(8, 125, 255, 0.18), transparent 34%);
      border: 1px solid rgba(8, 125, 255, 0.22);
    }

    .player.is-nominee {
      color: #fff;
      background:
        linear-gradient(135deg, rgba(8, 125, 255, 0.98), rgba(48, 36, 216, 0.94)),
        radial-gradient(circle at 8% 20%, rgba(255,255,255,0.28), transparent 34%);
      border-color: rgba(8, 125, 255, 0.5);
      box-shadow: 0 14px 28px rgba(8, 125, 255, 0.2);
    }

    .player-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-tag {
      min-width: 72px;
      min-height: 30px;
      padding: 0 10px;
      border-radius: 999px;
      display: grid;
      place-items: center;
      color: #fff;
      background: rgba(255,255,255,0.2);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.32);
      font-size: 0.72rem;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .remove-player {
      width: 30px;
      height: 30px;
      min-height: 30px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 10px 20px rgba(168, 0, 26, 0.18);
    }

    .player[draggable="true"] {
      cursor: grab;
    }

    .player[draggable="true"]:active {
      cursor: grabbing;
    }

    .result-row[draggable="true"] {
      cursor: grab;
    }

    .result-row[draggable="true"]:active {
      cursor: grabbing;
    }

    .stage.is-drop-target,
    .side.is-drop-target {
      position: relative;
      border-radius: 22px;
      overflow: hidden;
    }

    .stage.is-drop-target::after,
    .side.is-drop-target::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 200;
      border-radius: inherit;
      background: rgba(8, 125, 255, 0.42);
      box-shadow: inset 0 0 0 6px rgba(8, 125, 255, 0.5);
      pointer-events: none;
    }

    .hidden { display: none !important; }

    .qr-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: clamp(12px, 3vw, 28px);
      background: rgba(16, 11, 47, 0.42);
      backdrop-filter: blur(18px);
    }

    .qr-modal-card {
      position: fixed;
      left: 50vw;
      top: 50vh;
      transform: translate(-50%, -50%);
      width: min(92vw, 980px);
      height: min(88vh, 820px);
      padding: clamp(16px, 3vw, 28px);
      border-radius: clamp(28px, 4vw, 42px);
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      gap: clamp(14px, 2vw, 22px);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 32px 90px rgba(16, 11, 47, 0.28);
      overflow: hidden;
    }

    .qr-modal-main {
      display: grid;
      gap: 10px;
      place-items: center;
      min-height: 0;
    }

    .qr-modal-main img {
      width: min(100%, 620px);
      max-height: min(62vh, 600px);
      border-radius: 24px;
      background: #fff;
      image-rendering: pixelated;
    }

    .qr-modal-list {
      min-height: 0;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
      gap: 10px;
      padding: 14px;
      border-radius: 28px;
      background: rgba(255,255,255,0.68);
      border: 1px solid var(--line);
    }

    .modal-names {
      min-height: 0;
      overflow-y: auto;
      font-weight: 1000;
      line-height: 1.55;
      white-space: pre-line;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(16, 11, 47, 0.52);
      backdrop-filter: blur(16px);
    }

    .confirm-overlay.hidden {
      display: none !important;
    }

    .confirm-modal {
      width: min(92vw, 560px);
      max-height: calc(100dvh - 48px);
      overflow: auto;
      border-radius: 32px;
      padding: 24px;
      display: grid;
      gap: 16px;
      text-align: center;
      align-content: center;
      background: linear-gradient(145deg, rgba(255,255,255,0.98), rgba(238,248,255,0.96));
      border: 1px solid rgba(255,255,255,0.88);
      box-shadow: 0 36px 80px rgba(16, 11, 47, 0.3);
    }

    .confirm-kicker {
      margin: 0;
      color: var(--red);
      font-size: 0.82rem;
      font-weight: 1000;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .confirm-title {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .confirm-text {
      margin: 0;
      color: var(--muted);
      font-size: 1rem;
      font-weight: 900;
      line-height: 1.45;
    }

    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    @media (max-width: 900px) {
      body { height: auto; overflow: auto; }
      .app {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
      }
      .topbar { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; }
      .actions button { flex: 1; }
      .side { min-height: 650px; }
      .qr-modal-card {
        grid-template-columns: 1fr;
        width: min(92vw, 520px);
        height: min(90vh, 760px);
      }
      .qr-modal-main img { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="main">
      <header class="topbar" id="topbar">
        <div class="options-entry" id="optionsPanel">
          <textarea id="optionsInput" rows="1" spellcheck="false" placeholder="Type one option, then submit."></textarea>
          <button class="primary option-submit" id="submitOptionBtn" type="button">Submit</button>
        </div>
        <div class="mode-controls">
          <button class="self-switch is-active" id="selfVoteBtn" type="button" aria-pressed="true">
            <span class="mode-label">Self-vote</span>
            <span class="self-switch-text" id="selfVoteText">Blocked</span>
            <span class="self-switch-knob" aria-hidden="true"></span>
          </button>
          <button class="nomination-toggle" id="nominationToggleBtn" type="button" aria-pressed="false">
            <span class="mode-label">Nomination</span>
            <span class="nomination-value" id="nominationValue">Off</span>
          </button>
        </div>
        <div></div>
        <div class="actions">
          <button class="primary" id="voteToggleBtn" type="button">Start</button>
          <button id="clearBtn" type="button">Clear</button>
          <button id="homeBtn" type="button">Home</button>
        </div>
      </header>

      <section class="stage">
        <div class="results" id="results"></div>
      </section>
    </section>

    <aside class="side is-qr-hidden" id="sidePanel">
      <div class="side-head">
        <h2>Players</h2>
      </div>
      <div class="side-content">
        <section class="panel connected-panel" id="connectedPanel">
          <div class="players" id="playersList"></div>
        </section>
      </div>
    </aside>
  </main>

  <div class="qr-modal hidden" id="qrModal" aria-hidden="true">
    <div class="qr-modal-card">
      <div class="qr-modal-main">
        <img id="qrLargeImage" alt="Large Quick Poll room QR">
        <p class="room-code" id="qrLargeCode">-----</p>
        <button id="qrModalCloseBtn" type="button">Close</button>
      </div>
      <section class="qr-modal-list" aria-label="Players">
        <h3>Players</h3>
        <div class="modal-names" id="modalNames"></div>
      </section>
    </div>
  </div>

  <div class="confirm-overlay hidden" id="confirmOverlay">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <p class="confirm-kicker">Confirm</p>
      <h2 class="confirm-title" id="confirmTitle">Are you sure?</h2>
      <p class="confirm-text" id="confirmText">This action may affect the current poll.</p>
      <div class="confirm-actions">
        <button id="confirmCancelBtn" type="button">Cancel</button>
        <button class="danger" id="confirmAcceptBtn" type="button">Continue</button>
      </div>
    </div>
  </div>

  <script>
    const storageKey = "quick-poll-room-code";
    const classroomStorageKey = "friendzy-classroom-code";
    const voteToggleBtn = document.getElementById("voteToggleBtn");
    const topbar = document.getElementById("topbar");
    const clearBtn = document.getElementById("clearBtn");
    const resetBtn = document.getElementById("resetBtn");
    const homeBtn = document.getElementById("homeBtn");
    const qrToggleBtn = document.getElementById("qrToggleBtn");
    const qrBox = document.getElementById("qrBox");
    const qrImage = document.getElementById("qrImage");
    const roomCodeEl = document.getElementById("roomCode");
    const qrModal = document.getElementById("qrModal");
    const qrLargeImage = document.getElementById("qrLargeImage");
    const qrLargeCode = document.getElementById("qrLargeCode");
    const qrModalCloseBtn = document.getElementById("qrModalCloseBtn");
    const confirmOverlay = document.getElementById("confirmOverlay");
    const confirmTitle = document.getElementById("confirmTitle");
    const confirmText = document.getElementById("confirmText");
    const confirmCancelBtn = document.getElementById("confirmCancelBtn");
    const confirmAcceptBtn = document.getElementById("confirmAcceptBtn");
    const sidePanel = document.getElementById("sidePanel");
    const selfVoteBtn = document.getElementById("selfVoteBtn");
    const selfVoteText = document.getElementById("selfVoteText");
    const nominationToggleBtn = document.getElementById("nominationToggleBtn");
    const nominationValue = document.getElementById("nominationValue");
    const optionsPanel = document.getElementById("optionsPanel");
    const optionsInput = document.getElementById("optionsInput");
    const submitOptionBtn = document.getElementById("submitOptionBtn");
    const playerCount = document.getElementById("playerCount");
    const connectedPanel = document.getElementById("connectedPanel");
    const playersList = document.getElementById("playersList");
    const modalNames = document.getElementById("modalNames");
    const results = document.getElementById("results");
    const stage = document.querySelector(".stage");

    let room = null;
    let baseUrl = window.location.origin;
    let qrVisible = false;
    let source = "mixed";
    let blockSelfVote = true;
    let joinRole = "voter";
    let options = [];
    let candidatePlayerIds = [];
    let nominationMode = false;
    let nomineePlayerIds = [];
    let pollTimer = null;
    let currentDragAction = "";
    let confirmState = null;

    async function api(path, payload = null, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: payload ? { "Content-Type": "application/json" } : undefined,
        body: payload ? JSON.stringify(payload) : undefined
      });
      const text = await response.text();
      let data = {};
      try {
        data = text ? JSON.parse(text) : {};
      } catch (_) {
        data = { error: text || "Request failed" };
      }
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function normalize(values) {
      const seen = new Set();
      return values.map((value) => String(value || "").trim()).filter(Boolean).filter((value) => {
        const key = value.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 100);
    }

    function getPendingOption() {
      return String(optionsInput.value || "").trim();
    }

    function getJoinUrl() {
      return room ? `${baseUrl}/quick-poll-student.html?code=${encodeURIComponent(room.code)}` : "";
    }

    function getQrSrc(size = 420) {
      return room ? `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(getJoinUrl())}` : "";
    }

    function renderPlayers() {
      const players = room?.players || [];
      const candidateIds = new Set(candidatePlayerIds.map((id) => Number(id)));
      const nomineeIds = new Set(nomineePlayerIds.map((id) => Number(id)));
      if (playerCount) playerCount.textContent = `(${players.length})`;
      playersList.innerHTML = players.length
        ? players.slice().sort((a, b) => {
          const nomineeDiff = Number(nomineeIds.has(Number(b.id))) - Number(nomineeIds.has(Number(a.id)));
          if (nomineeDiff) return nomineeDiff;
          return a.name.localeCompare(b.name);
        }).map((player) => {
          const isNominee = nomineeIds.has(Number(player.id));
          const isCandidate = candidateIds.has(Number(player.id));
          const tag = isNominee ? `<span class="player-tag">Nominated</span>` : (isCandidate ? `<span class="player-tag">Votable</span>` : "");
          return `<div class="player ${isNominee ? "is-nominee" : ""}" draggable="true" data-player-id="${player.id}"><span class="player-name">${escapeHtml(player.name)}</span>${tag}<button class="remove-player" type="button" data-player-id="${player.id}" aria-label="Remove ${escapeHtml(player.name)}">X</button></div>`;
        }).join("")
        : "";
      modalNames.textContent = players.length ? players.map((player) => player.name).sort((a, b) => a.localeCompare(b)).join("\n") : "No players yet.";
    }

    function renderResults() {
      const list = room?.results || [];
      if (!list.length) {
        results.innerHTML = `<div class="empty-results">Add options or drag players here.</div>`;
        return;
      }
      const maxVotes = Math.max(1, ...list.map((item) => item.votes));
      results.innerHTML = list.map((item) => {
        const width = Math.round((item.votes / maxVotes) * 100);
        const removeButton = !item.playerId
          ? `<button class="remove-option" type="button" data-option-label="${escapeHtml(item.label)}" aria-label="Remove ${escapeHtml(item.label)}">X</button>`
          : "";
        const dragAttrs = item.playerId
          ? `draggable="true" data-player-id="${item.playerId}"`
          : "";
        return `<div class="result-row" ${dragAttrs}><div class="result-name">${escapeHtml(item.label)}</div><div class="votes">${item.votes}</div>${removeButton}<div class="bar"><span style="--w:${width}%"></span></div></div>`;
      }).join("");
    }

    function render() {
      source = "mixed";
      blockSelfVote = room?.blockSelfVote ?? blockSelfVote;
      joinRole = room?.joinRole || joinRole;
      options = room?.options || options;
      candidatePlayerIds = (room?.candidatePlayerIds || candidatePlayerIds).map((id) => Number(id));
      nominationMode = !!room?.nominationMode;
      nomineePlayerIds = (room?.nomineePlayerIds || nomineePlayerIds).map((id) => Number(id));
      nominationToggleBtn.classList.toggle("is-active", nominationMode);
      nominationToggleBtn.setAttribute("aria-pressed", String(nominationMode));
      nominationValue.textContent = nominationMode ? "On" : "Off";
      selfVoteBtn.classList.toggle("is-active", blockSelfVote);
      selfVoteBtn.setAttribute("aria-pressed", String(blockSelfVote));
      selfVoteText.textContent = blockSelfVote ? "Blocked" : "Allowed";
      voteToggleBtn.disabled = !room;
      voteToggleBtn.textContent = room?.status === "voting" ? "End" : "Start";
      voteToggleBtn.classList.toggle("primary", room?.status !== "voting");
      voteToggleBtn.classList.toggle("danger", room?.status === "voting");
      clearBtn.disabled = !room || room.status === "voting";
      if (resetBtn) resetBtn.disabled = !room || room.status === "voting";
      if (room) {
        localStorage.setItem(storageKey, room.code);
        if (roomCodeEl) roomCodeEl.textContent = room.code;
        qrLargeCode.textContent = room.code;
        if (qrImage) qrImage.src = getQrSrc(420);
        qrLargeImage.src = getQrSrc(720);
      } else {
        if (roomCodeEl) roomCodeEl.textContent = "-----";
        if (qrImage) qrImage.removeAttribute("src");
      }
      sidePanel.classList.toggle("is-players-source", true);
      if (qrBox) qrBox.classList.toggle("hidden", true);
      if (qrToggleBtn) qrToggleBtn.textContent = qrVisible ? "Hide QR" : "Show QR";
      renderPlayers();
      renderResults();
    }

    function escapeHtml(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function hydrateBaseUrl() {
      try {
        const data = await api("/api/live/server-info", null, "GET");
        const localHost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
        baseUrl = localHost && data?.localOrigin ? data.localOrigin : (data?.publicOrigin || window.location.origin);
      } catch (_) {}
    }

    async function ensureRoom() {
      if (room) return room;
      const savedCode = localStorage.getItem(storageKey);
      if (savedCode) {
        try {
          const data = await api(`/api/poll/room?code=${encodeURIComponent(savedCode)}`, null, "GET");
          room = data.room;
          setClassroomTool("quick-poll", room.code).catch(() => {});
          render();
          return room;
        } catch (_) {
          localStorage.removeItem(storageKey);
        }
      }
      const data = await api("/api/poll/create-room");
      room = data.room;
      await syncSettings();
      setClassroomTool("quick-poll", room.code).catch(() => {});
      return room;
    }

    async function setClassroomTool(activeTool = "quick-poll", activeToolCode = room?.code || "") {
      const classroomCode = localStorage.getItem(classroomStorageKey);
      if (!classroomCode) return;
      try {
        await api("/api/classroom/set-tool", { code: classroomCode, activeTool, activeToolCode });
      } catch (_) {}
    }

    async function syncSettings() {
      if (!room) return;
      const data = await api("/api/poll/sync", { code: room.code, options, source: "mixed", blockSelfVote, candidatePlayerIds, joinRole, nominationMode, nomineePlayerIds });
      room = data.room;
      render();
    }

    async function pollRoom() {
      if (!room) return;
      try {
        const data = await api(`/api/poll/room?code=${encodeURIComponent(room.code)}`, null, "GET");
        room = data.room;
        render();
      } catch (_) {
        room = null;
        qrVisible = false;
        localStorage.removeItem(storageKey);
        render();
      } finally {
        pollTimer = setTimeout(pollRoom, 1200);
      }
    }

    function startPolling() {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(pollRoom, 500);
    }

    function openQrModal() {
      if (!room || !qrVisible) return;
      qrModal.classList.remove("hidden");
      qrModal.setAttribute("aria-hidden", "false");
      renderPlayers();
    }

    function closeQrModal() {
      qrModal.classList.add("hidden");
      qrModal.setAttribute("aria-hidden", "true");
    }

    function closeConfirm(result = false) {
      if (!confirmState) {
        return;
      }
      const { resolve } = confirmState;
      confirmState = null;
      confirmOverlay.classList.add("hidden");
      resolve(result);
    }

    function openConfirm({ title, text, confirmLabel = "Continue" }) {
      confirmTitle.textContent = title;
      confirmText.textContent = text;
      confirmAcceptBtn.textContent = confirmLabel;
      confirmOverlay.classList.remove("hidden");
      confirmAcceptBtn.focus();
      return new Promise((resolve) => {
        confirmState = { resolve };
      });
    }

    async function submitOption() {
      const nextOption = getPendingOption();
      if (!nextOption) {
        optionsInput.focus();
        return;
      }
      await ensureRoom();
      source = "mixed";
      options = normalize([...(options || []), nextOption]);
      optionsInput.value = "";
      optionsInput.style.height = "auto";
      await syncSettings();
      optionsInput.focus();
    }

    async function addCandidatePlayer(playerId) {
      await ensureRoom();
      source = "mixed";
      const id = Number(playerId);
      if (!id || candidatePlayerIds.includes(id)) {
        return;
      }
      candidatePlayerIds = [...candidatePlayerIds, id];
      nomineePlayerIds = nomineePlayerIds.filter((nomineeId) => Number(nomineeId) !== id);
      await syncSettings();
    }

    async function removeOption(label) {
      if (!label) {
        return;
      }
      await ensureRoom();
      options = normalize((options || []).filter((option) => option.toLowerCase() !== label.toLowerCase()));
      await syncSettings();
    }

    async function removePlayer(playerId) {
      await ensureRoom();
      const data = await api("/api/poll/remove-player", { code: room.code, playerId: Number(playerId || 0) });
      room = data.room;
      render();
    }

    submitOptionBtn.addEventListener("click", () => {
      submitOption().catch((error) => alert(error.message || "Could not add option."));
    });

    optionsInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) {
        return;
      }
      event.preventDefault();
      submitOption().catch((error) => alert(error.message || "Could not add option."));
    });

    optionsInput.addEventListener("input", () => {
      optionsInput.style.height = "auto";
      optionsInput.style.height = `${Math.min(optionsInput.scrollHeight, 118)}px`;
    });

    results.addEventListener("click", (event) => {
      const button = event.target.closest(".remove-option");
      if (!button) {
        return;
      }
      removeOption(button.dataset.optionLabel || "").catch((error) => alert(error.message || "Could not remove option."));
    });

    playersList.addEventListener("dragstart", (event) => {
      if (event.target.closest(".remove-player")) {
        event.preventDefault();
        return;
      }
      const player = event.target.closest(".player[draggable='true']");
      if (!player) {
        return;
      }
      event.dataTransfer.setData("application/x-poll-action", "add");
      event.dataTransfer.setData("text/plain", player.dataset.playerId || "");
      event.dataTransfer.effectAllowed = "move";
      currentDragAction = "add";
    });

    playersList.addEventListener("click", (event) => {
      const button = event.target.closest(".remove-player");
      if (!button) {
        return;
      }
      const playerName = button.closest(".player")?.querySelector(".player-name")?.textContent?.trim() || "this player";
      openConfirm({
        title: "Remove Player?",
        text: `Are you sure you want to remove ${playerName}?`,
        confirmLabel: "Remove"
      }).then((confirmed) => {
        if (!confirmed) return;
        removePlayer(button.dataset.playerId).catch((error) => alert(error.message || "Could not remove participant."));
      });
    });

    results.addEventListener("dragstart", (event) => {
      const result = event.target.closest(".result-row[draggable='true']");
      if (!result) {
        return;
      }
      event.dataTransfer.setData("application/x-poll-action", "remove");
      event.dataTransfer.setData("text/plain", result.dataset.playerId || "");
      event.dataTransfer.effectAllowed = "move";
      currentDragAction = "remove";
    });

    document.addEventListener("dragend", () => {
      currentDragAction = "";
      stage.classList.remove("is-drop-target");
      playersList.classList.remove("is-drop-target");
      connectedPanel.classList.remove("is-drop-target");
      sidePanel.classList.remove("is-drop-target");
    });

    stage.addEventListener("dragover", (event) => {
      if (currentDragAction === "remove") {
        return;
      }
      event.preventDefault();
      stage.classList.add("is-drop-target");
      event.dataTransfer.dropEffect = "move";
    });

    stage.addEventListener("dragleave", (event) => {
      if (!stage.contains(event.relatedTarget)) {
        stage.classList.remove("is-drop-target");
      }
    });

    stage.addEventListener("drop", (event) => {
      event.preventDefault();
      stage.classList.remove("is-drop-target");
      if (currentDragAction === "remove") {
        return;
      }
      addCandidatePlayer(event.dataTransfer.getData("text/plain")).catch((error) => alert(error.message || "Could not add candidate."));
    });

    sidePanel.addEventListener("dragover", (event) => {
      if (currentDragAction !== "remove") {
        return;
      }
      event.preventDefault();
      sidePanel.classList.add("is-drop-target");
      event.dataTransfer.dropEffect = "move";
    });

    sidePanel.addEventListener("dragleave", (event) => {
      if (!sidePanel.contains(event.relatedTarget)) {
        sidePanel.classList.remove("is-drop-target");
      }
    });

    sidePanel.addEventListener("drop", (event) => {
      event.preventDefault();
      sidePanel.classList.remove("is-drop-target");
      if (currentDragAction !== "remove") {
        return;
      }
      const playerId = Number(event.dataTransfer.getData("text/plain") || 0);
      if (!playerId) {
        return;
      }
      candidatePlayerIds = candidatePlayerIds.filter((id) => Number(id) !== playerId);
      syncSettings().catch((error) => alert(error.message || "Could not remove candidate."));
    });

    nominationToggleBtn.addEventListener("click", async () => {
      await ensureRoom();
      source = "mixed";
      nominationMode = !nominationMode;
      await syncSettings();
      startPolling();
    });

    selfVoteBtn.addEventListener("click", async () => {
      await ensureRoom();
      blockSelfVote = !blockSelfVote;
      await syncSettings();
    });

    qrToggleBtn?.addEventListener("click", async () => {
      if (!qrVisible) {
        await ensureRoom();
        qrVisible = true;
        render();
        startPolling();
        return;
      }
      qrVisible = false;
      closeQrModal();
      render();
    });

    voteToggleBtn.addEventListener("click", async () => {
      try {
        if (room?.status === "voting") {
          const data = await api("/api/poll/end", { code: room.code });
          room = data.room;
          render();
          return;
        }
        await ensureRoom();
        await syncSettings();
        const data = await api("/api/poll/start", { code: room.code });
        room = data.room;
        render();
        startPolling();
      } catch (error) {
        alert(error.message || "Could not start poll.");
      }
    });

    clearBtn.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Clear Votes?",
        text: "This clears the current results but keeps the room, players, and options.",
        confirmLabel: "Clear"
      });
      if (!room || !confirmed) return;
      const data = await api("/api/poll/reset", { code: room.code });
      room = data.room;
      render();
    });

    resetBtn?.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Reset Room?",
        text: "This deletes the current Quick Poll room and removes all connected players.",
        confirmLabel: "Reset"
      });
      if (!room || !confirmed) return;
      const oldCode = room.code;
      try {
        await api("/api/poll/delete-room", { code: oldCode });
      } catch (_) {}
      room = null;
      qrVisible = false;
      source = "mixed";
      blockSelfVote = true;
      joinRole = "voter";
      nominationMode = false;
      nomineePlayerIds = [];
      options = [];
      candidatePlayerIds = [];
      optionsInput.value = "";
      localStorage.removeItem(storageKey);
      closeQrModal();
      render();
    });

    homeBtn.addEventListener("click", () => {
      setClassroomTool("standby", "").finally(() => { window.location.href = "./"; });
    });
    qrBox?.addEventListener("click", openQrModal);
    qrBox?.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openQrModal();
      }
    });
    qrModalCloseBtn.addEventListener("click", closeQrModal);
    confirmCancelBtn.addEventListener("click", () => closeConfirm(false));
    confirmAcceptBtn.addEventListener("click", () => closeConfirm(true));
    confirmOverlay.addEventListener("click", (event) => {
      if (event.target === confirmOverlay) {
        closeConfirm(false);
      }
    });
    qrModal.addEventListener("click", (event) => {
      if (event.target === qrModal) closeQrModal();
    });

    document.addEventListener("keydown", (event) => {
      if (!confirmOverlay.classList.contains("hidden")) {
        if (event.key === "Escape") closeConfirm(false);
        if (event.key === "Enter") closeConfirm(true);
      }
    });

    hydrateBaseUrl().then(async () => {
      render();
      const savedCode = localStorage.getItem(storageKey);
      if (savedCode) {
        try {
          const data = await api(`/api/poll/room?code=${encodeURIComponent(savedCode)}`, null, "GET");
          room = data.room;
          setClassroomTool("quick-poll", room.code).catch(() => {});
          render();
          startPolling();
        } catch (_) {
          localStorage.removeItem(storageKey);
          render();
        }
      }
      if (!room && localStorage.getItem(classroomStorageKey)) {
        await ensureRoom();
        startPolling();
      }
    });
  </script>
  <script src="./friendzy-panel.js"></script>
</body>
</html>
