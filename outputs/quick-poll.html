<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quick Poll</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --muted: rgba(16, 11, 47, 0.62);
      --line: rgba(16, 11, 47, 0.12);
      --blue: #087dff;
      --red: #ff2541;
      --green: #19c875;
      --orange: #ff8a00;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 16%, rgba(8, 125, 255, 0.34), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(255, 138, 0, 0.3), transparent 30%),
        radial-gradient(circle at 52% 90%, rgba(25, 200, 117, 0.22), transparent 34%),
        linear-gradient(135deg, #fff4cf 0%, #eef8ff 46%, #ffe2e8 100%);
    }

    .app {
      height: 100vh;
      height: 100dvh;
      padding: clamp(8px, 1.3vw, 16px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(310px, 390px);
      gap: clamp(8px, 1.3vw, 16px);
    }

    .main,
    .side {
      min-height: 0;
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: clamp(24px, 3vw, 34px);
      background: var(--panel);
      box-shadow: 0 26px 78px rgba(16, 11, 47, 0.16);
      backdrop-filter: blur(18px);
    }

    .main {
      padding: clamp(12px, 1.7vw, 22px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, 1.4vw, 16px);
      overflow: clip;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(280px, 520px) auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .status {
      min-width: 132px;
    }

    .mode-label {
      margin: 0;
      font-size: 0.7rem;
      font-weight: 1000;
      line-height: 1;
      text-align: center;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      opacity: 0.78;
    }

    .mode-toggle {
      width: 100%;
      display: grid;
      place-items: center;
      gap: 4px;
      min-height: 62px;
      padding-block: 8px;
      border-radius: 22px;
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
    }

    .mode-value {
      font-size: clamp(1.25rem, 2vw, 2rem);
      line-height: 1;
    }

    .mode-toggle.is-players {
      background: linear-gradient(135deg, var(--blue), #3024d8);
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: end;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      min-height: 44px;
      padding: 0 16px;
      font: inherit;
      font-weight: 1000;
      color: var(--ink);
      background: rgba(255,255,255,0.94);
      box-shadow: 0 12px 26px rgba(16, 11, 47, 0.12);
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .primary {
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
      box-shadow: 0 14px 32px rgba(25, 200, 117, 0.22);
    }

    .danger {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
    }

    .stage {
      min-height: 0;
      border: 1px dashed rgba(16, 11, 47, 0.14);
      border-radius: clamp(24px, 4vw, 42px);
      padding: clamp(12px, 2vw, 24px);
      background:
        linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,255,255,0.18)),
        radial-gradient(circle at 50% 48%, rgba(8, 125, 255, 0.14), transparent 34%);
      overflow: hidden;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 14px;
    }

    .results {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 12px;
      padding-right: 4px;
    }

    .empty-results {
      align-self: start;
      padding: 10px 4px;
      color: var(--muted);
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 1000;
    }

    .result-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      gap: 12px;
      align-items: center;
      padding: 14px;
      border-radius: 24px;
      background: rgba(255,255,255,0.84);
      border: 1px solid var(--line);
      box-shadow: 0 14px 30px rgba(16, 11, 47, 0.09);
    }

    .result-name {
      min-width: 0;
      font-size: clamp(1.05rem, 2vw, 1.55rem);
      font-weight: 1000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .bar {
      grid-column: 1 / -1;
      height: 14px;
      border-radius: 999px;
      overflow: hidden;
      background: rgba(16,11,47,0.08);
    }

    .bar span {
      display: block;
      height: 100%;
      width: var(--w, 0%);
      border-radius: inherit;
      background: linear-gradient(90deg, var(--blue), var(--green), var(--orange));
      transition: width 220ms ease;
    }

    .votes {
      font-size: 1.2rem;
      font-weight: 1000;
      color: var(--blue);
    }

    .side {
      padding: clamp(14px, 1.8vw, 22px);
      display: grid;
      grid-template-rows: auto auto auto minmax(0, 1fr);
      gap: 12px;
      overflow: hidden;
    }

    .side.is-qr-hidden {
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    .side-content {
      min-height: 0;
      display: grid;
      grid-template-rows: minmax(0, 1fr);
      gap: 12px;
    }

    .side.is-players-source .side-content {
      grid-template-rows: minmax(0, 1fr);
    }

    .side-head,
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h2,
    h3 {
      margin: 0;
      color: #3e3580;
      font-size: 1rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .qr-box {
      display: grid;
      place-items: center;
      gap: 8px;
      padding: 12px;
      border-radius: 24px;
      background: rgba(255,255,255,0.72);
      border: 1px solid var(--line);
      cursor: zoom-in;
      transition: transform 140ms ease, box-shadow 140ms ease;
    }

    .qr-box:hover {
      transform: translateY(-2px) scale(1.01);
      box-shadow: 0 16px 34px rgba(16, 11, 47, 0.14);
    }

    .qr-box img {
      width: min(100%, 190px);
      border-radius: 18px;
      background: #fff;
      image-rendering: pixelated;
    }

    .room-code {
      margin: 0;
      font-weight: 1000;
      letter-spacing: 0.18em;
      color: var(--muted);
    }

    .panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
    }

    .options-entry {
      align-self: stretch;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }

    textarea {
      width: 100%;
      min-height: 44px;
      max-height: 118px;
      resize: none;
      border: 1px solid var(--line);
      border-radius: 24px;
      padding: 14px;
      font: inherit;
      font-weight: 900;
      background: rgba(255,255,255,0.74);
      outline: none;
    }

    .topbar textarea {
      min-height: 44px;
      border-radius: 18px;
      padding: 10px 12px;
      overflow-y: hidden;
    }

    .option-submit {
      width: 100%;
    }

    .topbar .option-submit {
      width: auto;
      align-self: center;
      min-width: 92px;
    }

    .remove-option {
      width: 34px;
      height: 34px;
      min-height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 10px 20px rgba(168, 0, 26, 0.18);
      opacity: 0;
      pointer-events: none;
    }

    .result-row:hover .remove-option,
    .result-row:focus-within .remove-option {
      opacity: 1;
      pointer-events: auto;
    }

    .players {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 8px;
    }

    .player {
      padding: 10px 12px;
      border-radius: 18px;
      font-weight: 1000;
      background: rgba(255,255,255,0.76);
      border: 1px solid var(--line);
    }

    .player[draggable="true"] {
      cursor: grab;
    }

    .player[draggable="true"]:active {
      cursor: grabbing;
    }

    .stage.is-drop-target {
      border-color: rgba(8, 125, 255, 0.55);
      box-shadow: inset 0 0 0 3px rgba(8, 125, 255, 0.12);
    }

    .self-toggle.is-active {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #3024d8);
    }

    .hidden { display: none !important; }

    .qr-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: clamp(12px, 3vw, 28px);
      background: rgba(16, 11, 47, 0.42);
      backdrop-filter: blur(18px);
    }

    .qr-modal-card {
      position: fixed;
      left: 50vw;
      top: 50vh;
      transform: translate(-50%, -50%);
      width: min(92vw, 980px);
      height: min(88vh, 820px);
      padding: clamp(16px, 3vw, 28px);
      border-radius: clamp(28px, 4vw, 42px);
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      gap: clamp(14px, 2vw, 22px);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 32px 90px rgba(16, 11, 47, 0.28);
      overflow: hidden;
    }

    .qr-modal-main {
      display: grid;
      gap: 10px;
      place-items: center;
      min-height: 0;
    }

    .qr-modal-main img {
      width: min(100%, 620px);
      max-height: min(62vh, 600px);
      border-radius: 24px;
      background: #fff;
      image-rendering: pixelated;
    }

    .qr-modal-list {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding: 14px;
      border-radius: 28px;
      background: rgba(255,255,255,0.68);
      border: 1px solid var(--line);
    }

    .modal-names {
      min-height: 0;
      overflow-y: auto;
      font-weight: 1000;
      line-height: 1.55;
      white-space: pre-line;
    }

    @media (max-width: 900px) {
      body { height: auto; overflow: auto; }
      .app {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
      }
      .topbar { grid-template-columns: 1fr; }
      .actions { justify-content: stretch; }
      .actions button { flex: 1; }
      .side { min-height: 650px; }
      .qr-modal-card {
        grid-template-columns: 1fr;
        width: min(92vw, 520px);
        height: min(90vh, 760px);
      }
      .qr-modal-main img { max-height: 42vh; }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="main">
      <header class="topbar">
        <div class="status">
          <button id="modeToggleBtn" class="mode-toggle" type="button">
            <span class="mode-label">Mode</span>
            <span class="mode-value" id="modeValue">Manual</span>
          </button>
        </div>
        <div class="options-entry" id="optionsPanel">
          <textarea id="optionsInput" rows="1" spellcheck="false" placeholder="Type one option, then submit."></textarea>
          <button class="primary option-submit" id="submitOptionBtn" type="button">Submit</button>
        </div>
        <button class="self-toggle is-active" id="selfVoteBtn" type="button">Block Self-Vote</button>
        <div></div>
        <div class="actions">
          <button class="primary" id="voteToggleBtn" type="button">Start</button>
          <button class="danger" id="resetBtn" type="button">Reset</button>
          <button id="homeBtn" type="button">Home</button>
        </div>
      </header>

      <section class="stage">
        <div class="results" id="results"></div>
      </section>
    </section>

    <aside class="side is-qr-hidden" id="sidePanel">
      <div class="side-head">
        <h2>Players</h2>
        <button id="qrToggleBtn" type="button">Show QR</button>
      </div>
      <div class="qr-box hidden" id="qrBox" role="button" tabindex="0" aria-label="Quick Poll room QR">
        <img id="qrImage" alt="Quick Poll room QR">
        <p class="room-code" id="roomCode">-----</p>
      </div>
      <div class="side-content">
        <section class="panel">
          <div class="row">
            <h3>Connected <span id="playerCount">(0)</span></h3>
          </div>
          <div class="players" id="playersList"></div>
        </section>
      </div>
    </aside>
  </main>

  <div class="qr-modal hidden" id="qrModal" aria-hidden="true">
    <div class="qr-modal-card">
      <div class="qr-modal-main">
        <img id="qrLargeImage" alt="Large Quick Poll room QR">
        <p class="room-code" id="qrLargeCode">-----</p>
        <button id="qrModalCloseBtn" type="button">Close</button>
      </div>
      <section class="qr-modal-list" aria-label="Connected players">
        <h3>Connected Players</h3>
        <div class="modal-names" id="modalNames"></div>
      </section>
    </div>
  </div>

  <script>
    const storageKey = "quick-poll-room-code";
    const voteToggleBtn = document.getElementById("voteToggleBtn");
    const resetBtn = document.getElementById("resetBtn");
    const homeBtn = document.getElementById("homeBtn");
    const qrToggleBtn = document.getElementById("qrToggleBtn");
    const qrBox = document.getElementById("qrBox");
    const qrImage = document.getElementById("qrImage");
    const roomCodeEl = document.getElementById("roomCode");
    const qrModal = document.getElementById("qrModal");
    const qrLargeImage = document.getElementById("qrLargeImage");
    const qrLargeCode = document.getElementById("qrLargeCode");
    const qrModalCloseBtn = document.getElementById("qrModalCloseBtn");
    const sidePanel = document.getElementById("sidePanel");
    const modeToggleBtn = document.getElementById("modeToggleBtn");
    const modeValue = document.getElementById("modeValue");
    const selfVoteBtn = document.getElementById("selfVoteBtn");
    const optionsPanel = document.getElementById("optionsPanel");
    const optionsInput = document.getElementById("optionsInput");
    const submitOptionBtn = document.getElementById("submitOptionBtn");
    const playerCount = document.getElementById("playerCount");
    const playersList = document.getElementById("playersList");
    const modalNames = document.getElementById("modalNames");
    const results = document.getElementById("results");
    const stage = document.querySelector(".stage");

    let room = null;
    let baseUrl = window.location.origin;
    let qrVisible = false;
    let source = "manual";
    let blockSelfVote = true;
    let options = [];
    let candidatePlayerIds = [];
    let pollTimer = null;

    async function api(path, payload = null, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: payload ? { "Content-Type": "application/json" } : undefined,
        body: payload ? JSON.stringify(payload) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function normalize(values) {
      const seen = new Set();
      return values.map((value) => String(value || "").trim()).filter(Boolean).filter((value) => {
        const key = value.toLowerCase();
        if (seen.has(key)) return false;
        seen.add(key);
        return true;
      }).slice(0, 100);
    }

    function getPendingOption() {
      return String(optionsInput.value || "").trim();
    }

    function getJoinUrl() {
      return room ? `${baseUrl}/quick-poll-student.html?code=${encodeURIComponent(room.code)}` : "";
    }

    function getQrSrc(size = 420) {
      return room ? `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(getJoinUrl())}` : "";
    }

    function renderPlayers() {
      const players = room?.players || [];
      const candidateIds = new Set(candidatePlayerIds.map((id) => Number(id)));
      const availablePlayers = source === "players"
        ? players.filter((player) => !candidateIds.has(Number(player.id)))
        : players;
      playerCount.textContent = `(${players.length})`;
      playersList.innerHTML = availablePlayers.length
        ? availablePlayers.slice().sort((a, b) => a.name.localeCompare(b.name)).map((player) => (
          `<div class="player" ${source === "players" ? `draggable="true" data-player-id="${player.id}"` : ""}>${escapeHtml(player.name)}</div>`
        )).join("")
        : `<div class="player">${source === "players" ? "Drag candidates back here by removing them from the center." : "Waiting for players..."}</div>`;
      modalNames.textContent = players.length ? players.map((player) => player.name).sort((a, b) => a.localeCompare(b)).join("\n") : "No players yet.";
    }

    function renderResults() {
      const list = room?.results || [];
      if (!list.length) {
        results.innerHTML = `<div class="empty-results">${source === "players" ? "Drag candidate players here." : "Add options or use players as options."}</div>`;
        return;
      }
      const maxVotes = Math.max(1, ...list.map((item) => item.votes));
      results.innerHTML = list.map((item) => {
        const width = Math.round((item.votes / maxVotes) * 100);
        const removeButton = source === "manual" || source === "players"
          ? `<button class="remove-option" type="button" data-option-label="${escapeHtml(item.label)}" aria-label="Remove ${escapeHtml(item.label)}">X</button>`
          : "";
        return `<div class="result-row"><div class="result-name">${escapeHtml(item.label)}</div><div class="votes">${item.votes}</div>${removeButton}<div class="bar"><span style="--w:${width}%"></span></div></div>`;
      }).join("");
    }

    function render() {
      source = room?.source || source;
      blockSelfVote = room?.blockSelfVote ?? blockSelfVote;
      options = room?.options || options;
      candidatePlayerIds = (room?.candidatePlayerIds || candidatePlayerIds).map((id) => Number(id));
      modeValue.textContent = source === "manual" ? "Manual" : "Players";
      modeToggleBtn.classList.toggle("is-players", source === "players");
      selfVoteBtn.classList.toggle("hidden", source !== "players");
      selfVoteBtn.classList.toggle("is-active", blockSelfVote);
      selfVoteBtn.textContent = blockSelfVote ? "Block Self-Vote" : "Allow Self-Vote";
      optionsPanel.classList.toggle("hidden", source !== "manual");
      voteToggleBtn.disabled = !room;
      voteToggleBtn.textContent = room?.status === "voting" ? "End" : "Start";
      voteToggleBtn.classList.toggle("primary", room?.status !== "voting");
      voteToggleBtn.classList.toggle("danger", room?.status === "voting");
      resetBtn.disabled = !room || room.status === "voting";
      if (room) {
        localStorage.setItem(storageKey, room.code);
        roomCodeEl.textContent = room.code;
        qrLargeCode.textContent = room.code;
        qrImage.src = getQrSrc(420);
        qrLargeImage.src = getQrSrc(720);
      } else {
        roomCodeEl.textContent = "-----";
        qrImage.removeAttribute("src");
      }
      sidePanel.classList.toggle("is-qr-hidden", !qrVisible);
      sidePanel.classList.toggle("is-players-source", source === "players");
      qrBox.classList.toggle("hidden", !qrVisible || !room);
      qrToggleBtn.textContent = qrVisible ? "Hide QR" : "Show QR";
      renderPlayers();
      renderResults();
    }

    function escapeHtml(value) {
      return String(value || "").replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    async function hydrateBaseUrl() {
      try {
        const data = await api("/api/live/server-info", null, "GET");
        const localHost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
        baseUrl = localHost && data?.localOrigin ? data.localOrigin : (data?.publicOrigin || window.location.origin);
      } catch (_) {}
    }

    async function ensureRoom() {
      if (room) return room;
      const savedCode = localStorage.getItem(storageKey);
      if (savedCode) {
        try {
          const data = await api(`/api/poll/room?code=${encodeURIComponent(savedCode)}`, null, "GET");
          room = data.room;
          render();
          return room;
        } catch (_) {
          localStorage.removeItem(storageKey);
        }
      }
      const data = await api("/api/poll/create-room");
      room = data.room;
      await syncSettings();
      return room;
    }

    async function syncSettings() {
      if (!room) return;
      const data = await api("/api/poll/sync", { code: room.code, options, source, blockSelfVote, candidatePlayerIds });
      room = data.room;
      render();
    }

    async function pollRoom() {
      if (!room) return;
      try {
        const data = await api(`/api/poll/room?code=${encodeURIComponent(room.code)}`, null, "GET");
        room = data.room;
        render();
      } catch (_) {
        room = null;
        qrVisible = false;
        localStorage.removeItem(storageKey);
        render();
      } finally {
        pollTimer = setTimeout(pollRoom, 1200);
      }
    }

    function startPolling() {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(pollRoom, 500);
    }

    function openQrModal() {
      if (!room || !qrVisible) return;
      qrModal.classList.remove("hidden");
      qrModal.setAttribute("aria-hidden", "false");
      renderPlayers();
    }

    function closeQrModal() {
      qrModal.classList.add("hidden");
      qrModal.setAttribute("aria-hidden", "true");
    }

    async function submitOption() {
      const nextOption = getPendingOption();
      if (!nextOption) {
        optionsInput.focus();
        return;
      }
      await ensureRoom();
      source = "manual";
      options = normalize([...(options || []), nextOption]);
      optionsInput.value = "";
      optionsInput.style.height = "auto";
      await syncSettings();
      optionsInput.focus();
    }

    async function addCandidatePlayer(playerId) {
      await ensureRoom();
      source = "players";
      const id = Number(playerId);
      if (!id || candidatePlayerIds.includes(id)) {
        return;
      }
      candidatePlayerIds = [...candidatePlayerIds, id];
      await syncSettings();
    }

    async function removeOption(label) {
      if (!label) {
        return;
      }
      await ensureRoom();
      if (source === "players") {
        const player = (room?.players || []).find((item) => String(item.name || "").trim().toLowerCase() === label.toLowerCase());
        if (player) {
          candidatePlayerIds = candidatePlayerIds.filter((id) => Number(id) !== Number(player.id));
        }
      } else {
        options = normalize((options || []).filter((option) => option.toLowerCase() !== label.toLowerCase()));
      }
      await syncSettings();
    }

    submitOptionBtn.addEventListener("click", () => {
      submitOption().catch((error) => alert(error.message || "Could not add option."));
    });

    optionsInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter" || event.shiftKey) {
        return;
      }
      event.preventDefault();
      submitOption().catch((error) => alert(error.message || "Could not add option."));
    });

    optionsInput.addEventListener("input", () => {
      optionsInput.style.height = "auto";
      optionsInput.style.height = `${Math.min(optionsInput.scrollHeight, 118)}px`;
    });

    results.addEventListener("click", (event) => {
      const button = event.target.closest(".remove-option");
      if (!button) {
        return;
      }
      removeOption(button.dataset.optionLabel || "").catch((error) => alert(error.message || "Could not remove option."));
    });

    playersList.addEventListener("dragstart", (event) => {
      const player = event.target.closest(".player[draggable='true']");
      if (!player) {
        return;
      }
      event.dataTransfer.setData("text/plain", player.dataset.playerId || "");
      event.dataTransfer.effectAllowed = "move";
    });

    stage.addEventListener("dragover", (event) => {
      if (source !== "players") {
        return;
      }
      event.preventDefault();
      stage.classList.add("is-drop-target");
      event.dataTransfer.dropEffect = "move";
    });

    stage.addEventListener("dragleave", (event) => {
      if (!stage.contains(event.relatedTarget)) {
        stage.classList.remove("is-drop-target");
      }
    });

    stage.addEventListener("drop", (event) => {
      event.preventDefault();
      stage.classList.remove("is-drop-target");
      addCandidatePlayer(event.dataTransfer.getData("text/plain")).catch((error) => alert(error.message || "Could not add candidate."));
    });

    modeToggleBtn.addEventListener("click", async () => {
      await ensureRoom();
      source = source === "manual" ? "players" : "manual";
      await syncSettings();
    });

    selfVoteBtn.addEventListener("click", async () => {
      await ensureRoom();
      blockSelfVote = !blockSelfVote;
      await syncSettings();
    });

    qrToggleBtn.addEventListener("click", async () => {
      if (!qrVisible) {
        await ensureRoom();
        qrVisible = true;
        render();
        startPolling();
        return;
      }
      qrVisible = false;
      closeQrModal();
      render();
    });

    voteToggleBtn.addEventListener("click", async () => {
      try {
        if (room?.status === "voting") {
          const data = await api("/api/poll/end", { code: room.code });
          room = data.room;
          render();
          return;
        }
        await ensureRoom();
        await syncSettings();
        const data = await api("/api/poll/start", { code: room.code });
        room = data.room;
        render();
        startPolling();
      } catch (error) {
        alert(error.message || "Could not start poll.");
      }
    });

    resetBtn.addEventListener("click", async () => {
      if (!room || !confirm("Reset votes for this poll?")) return;
      const data = await api("/api/poll/reset", { code: room.code });
      room = data.room;
      render();
    });

    homeBtn.addEventListener("click", () => { window.location.href = "./"; });
    qrBox.addEventListener("click", openQrModal);
    qrBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openQrModal();
      }
    });
    qrModalCloseBtn.addEventListener("click", closeQrModal);
    qrModal.addEventListener("click", (event) => {
      if (event.target === qrModal) closeQrModal();
    });

    hydrateBaseUrl().then(async () => {
      render();
      const savedCode = localStorage.getItem(storageKey);
      if (savedCode) {
        try {
          const data = await api(`/api/poll/room?code=${encodeURIComponent(savedCode)}`, null, "GET");
          room = data.room;
          render();
          startPolling();
        } catch (_) {
          localStorage.removeItem(storageKey);
          render();
        }
      }
    });
  </script>
</body>
</html>
