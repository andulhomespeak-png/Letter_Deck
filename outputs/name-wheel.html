<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Name Wheel</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --muted: rgba(16, 11, 47, 0.62);
      --line: rgba(16, 11, 47, 0.12);
      --blue: #087dff;
      --red: #ff2541;
      --green: #19c875;
      --orange: #ff8a00;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    @property --winner-scale {
      syntax: "<number>";
      inherits: true;
      initial-value: 1;
    }

    @property --winner-y {
      syntax: "<length>";
      inherits: true;
      initial-value: 0px;
    }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 16%, rgba(8, 125, 255, 0.34), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(255, 138, 0, 0.3), transparent 30%),
        radial-gradient(circle at 52% 90%, rgba(25, 200, 117, 0.22), transparent 34%),
        linear-gradient(135deg, #fff4cf 0%, #eef8ff 46%, #ffe2e8 100%);
    }

    .app {
      height: 100vh;
      height: 100dvh;
      padding: clamp(8px, 1.3vw, 16px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(230px, 310px);
      gap: clamp(8px, 1.3vw, 16px);
    }

    .main,
    .side-panel {
      min-height: 0;
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: clamp(24px, 3vw, 34px);
      background: var(--panel);
      box-shadow: 0 26px 78px rgba(16, 11, 47, 0.16);
      backdrop-filter: blur(18px);
    }

    .main {
      padding: clamp(12px, 1.7vw, 22px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, 1.4vw, 16px);
      overflow: clip;
    }

    .side-panel {
      padding: clamp(12px, 1.4vw, 18px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(10px, 1.4vw, 14px);
      overflow: hidden;
    }

    .side-panel-head {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 8px;
    }

    .side-panel h2 {
      margin: 0;
      color: #3e3580;
      font-size: 1rem;
      font-weight: 1000;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .player-filter {
      width: 100%;
      min-width: 0;
      min-height: 34px;
      border: 1px solid rgba(16, 11, 47, 0.12);
      border-radius: 999px;
      padding: 0 11px;
      color: var(--ink);
      background: rgba(255,255,255,0.86);
      font: inherit;
      font-size: 0.82rem;
      font-weight: 1000;
      outline: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,0.48);
    }

    .player-filter:focus {
      border-color: rgba(8, 125, 255, 0.38);
      box-shadow: 0 0 0 3px rgba(8, 125, 255, 0.12);
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-family: "Franklin Gothic Heavy", "Arial Black", "Trebuchet MS", sans-serif;
      font-size: clamp(1.9rem, 4.2vw, 4.7rem);
      line-height: 0.9;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      color: transparent;
      background: linear-gradient(180deg, #fffdf2 0%, #ffe066 34%, #ff8a00 70%, #ff2541 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-stroke: clamp(1px, 0.14vw, 2px) #073a9b;
      text-shadow: 0 4px 0 #087dff, 0 14px 28px rgba(16, 11, 47, 0.18);
    }

    .status {
      justify-self: center;
      min-width: 120px;
      padding: 8px 14px;
      border-radius: 22px;
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--line);
      box-shadow: inset 0 -10px 20px rgba(8, 125, 255, 0.06);
      text-align: center;
    }

    .status-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .status-main {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 1000;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: end;
      flex-wrap: wrap;
    }

    button {
      border: 0;
      border-radius: 999px;
      min-height: 46px;
      padding: 0 18px;
      font: inherit;
      font-weight: 1000;
      color: var(--ink);
      background: rgba(255,255,255,0.94);
      box-shadow: 0 12px 26px rgba(16, 11, 47, 0.12);
      cursor: pointer;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .spin-btn {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 16px 36px rgba(255, 37, 65, 0.24);
    }

    .center-spin {
      position: absolute;
      left: 50%;
      top: 50%;
      width: clamp(84px, 13vmin, 128px);
      height: clamp(84px, 13vmin, 128px);
      min-height: 0;
      padding: 0;
      transform: translate(-50%, -50%);
      border: 8px solid rgba(255,255,255,0.92);
      color: #fff;
      background: radial-gradient(circle at 34% 28%, #fff4a8 0 12%, #ffb000 34%, #ff2541 100%);
      box-shadow:
        inset 0 -10px 18px rgba(16, 11, 47, 0.18),
        0 16px 30px rgba(16, 11, 47, 0.24);
      font-size: clamp(1.05rem, 2.4vmin, 1.45rem);
      letter-spacing: -0.02em;
      z-index: 5;
    }

    .center-spin:hover {
      transform: translate(-50%, -50%) scale(1.04);
    }

    .center-spin:active {
      transform: translate(-50%, -50%) scale(0.98);
    }

    .center-spin:disabled {
      transform: translate(-50%, -50%);
    }

    .center-spin:focus,
    .center-spin:focus-visible {
      outline: 0;
      box-shadow:
        inset 0 -10px 18px rgba(16, 11, 47, 0.18),
        0 16px 30px rgba(16, 11, 47, 0.24);
    }

    .mode-toggle.is-remove {
      color: #fff;
      background: linear-gradient(135deg, var(--orange), var(--red));
      box-shadow: 0 14px 32px rgba(255, 122, 0, 0.2);
    }

    .mode-toggle:not(.is-remove) {
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
      box-shadow: 0 14px 32px rgba(25, 200, 117, 0.2);
    }

    .danger {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
    }

    .stage {
      --stage-shift: 0px;
      --winner-scale: 1;
      --winner-y: 0px;
      min-height: 0;
      position: relative;
      border-radius: clamp(24px, 4vw, 42px);
      display: grid;
      place-items: center;
      padding: clamp(10px, 1.6vw, 22px);
      overflow: clip;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.62), rgba(255,255,255,0.18)),
        radial-gradient(circle at 50% 48%, rgba(8, 125, 255, 0.14), transparent 34%);
      border: 1px dashed rgba(16, 11, 47, 0.14);
    }

    .stage.is-list-visible {
      --stage-shift: clamp(-145px, -10vw, -92px);
    }

    .stage.is-list-visible .wheel-wrap {
      transform: translateX(var(--stage-shift));
    }

    .wheel-wrap {
      position: relative;
      width: min(78vmin, 720px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      filter: drop-shadow(0 36px 42px rgba(16, 11, 47, 0.18));
      transition: transform 220ms ease;
    }

    canvas {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      transition: transform 8.4s cubic-bezier(0.07, 0.64, 0.01, 1);
    }

    .wheel-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
      box-shadow:
        inset 0 0 0 14px rgba(255,255,255,0.9),
        inset 0 0 0 24px rgba(16, 11, 47, 0.08),
        0 0 0 1px rgba(255,255,255,0.8);
    }

    .pointer {
      position: absolute;
      top: -5px;
      left: 50%;
      width: clamp(28px, 4.2vw, 46px);
      height: clamp(42px, 6vw, 64px);
      transform: translateX(-50%);
      clip-path: polygon(50% 100%, 0 0, 100% 0);
      background: linear-gradient(180deg, #fff7b4, var(--orange), var(--red));
      filter: drop-shadow(0 10px 16px rgba(255, 37, 65, 0.28));
      z-index: 4;
    }

    .winner-banner {
      position: absolute;
      left: 50%;
      bottom: clamp(18px, 3vw, 34px);
      transform: translateX(calc(-50% + var(--stage-shift))) translateY(var(--winner-y)) scale(var(--winner-scale));
      width: min(680px, calc(100% - 30px));
      padding: clamp(14px, 2vw, 22px);
      border-radius: 28px;
      text-align: center;
      color: #fff;
      background: linear-gradient(135deg, #087dff, #3024d8 48%, #ff2541);
      box-shadow: 0 24px 58px rgba(16, 11, 47, 0.24);
      opacity: 0;
      pointer-events: none;
      transition: transform 220ms ease, opacity 180ms ease;
    }

    .winner-banner.show {
      --winner-scale: 1;
      --winner-y: 0px;
      opacity: 1;
      pointer-events: auto;
      animation: winnerPop 900ms cubic-bezier(0.18, 1.2, 0.28, 1) both;
    }

    .winner-label {
      margin: 0 0 4px;
      font-size: 0.78rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 1000;
      opacity: 0.86;
    }

    .winner-name {
      margin: 0;
      font-size: clamp(2.2rem, 6vw, 5.2rem);
      line-height: 0.9;
      font-weight: 1000;
      overflow-wrap: anywhere;
      text-shadow: 0 7px 0 rgba(0,0,0,0.12);
    }

    .winner-close {
      position: absolute;
      right: 12px;
      bottom: 10px;
      min-height: 28px;
      padding: 0 10px;
      color: var(--ink);
      font-size: 0.68rem;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.66);
      box-shadow: 0 8px 18px rgba(16, 11, 47, 0.16);
    }

    .player-count {
      color: var(--red);
    }

    .qr-toggle {
      min-height: 36px;
      padding: 0 12px;
      font-size: 0.8rem;
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .room-code {
      margin: 0;
      color: var(--red);
      font-size: 1.4rem;
      font-weight: 1000;
      letter-spacing: 0.1em;
    }

    .qr-box {
      border-radius: 28px;
      padding: 12px;
      display: grid;
      gap: 8px;
      place-items: center;
      background: rgba(255,255,255,0.78);
      border: 1px solid var(--line);
      cursor: zoom-in;
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
    }

    .qr-box:hover {
      transform: translateY(-3px) scale(1.01);
      border-color: rgba(8, 125, 255, 0.36);
      box-shadow: 0 18px 42px rgba(8, 125, 255, 0.16);
    }

    .qr-box img {
      width: min(100%, 190px);
      border-radius: 18px;
      image-rendering: pixelated;
      background: #fff;
    }

    .connected-list {
      min-height: 0;
      overflow-y: auto;
      display: grid;
      align-content: start;
      gap: 10px;
      padding: 2px 2px 8px;
    }

    .connected-pill {
      position: relative;
      min-height: 44px;
      display: flex;
      align-items: center;
      padding: 8px 68px 8px 12px;
      border-radius: 999px;
      color: var(--ink);
      font-weight: 1000;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.96), rgba(238,248,255,0.88)),
        radial-gradient(circle at 12% 20%, rgba(8, 125, 255, 0.2), transparent 36%);
      border: 1px solid rgba(8, 125, 255, 0.18);
      box-shadow: 0 12px 28px rgba(16, 11, 47, 0.1);
    }

    .connected-name {
      min-width: 0;
      width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      text-align: left;
    }

    .turn-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      min-height: 28px;
      min-width: 48px;
      padding: 0 10px;
      border-radius: 999px;
      border: 1px solid rgba(8, 125, 255, 0.18);
      color: var(--ink);
      background: rgba(255, 255, 255, 0.96);
      box-shadow: 0 8px 18px rgba(16, 11, 47, 0.1);
      font-size: 0.78rem;
      font-weight: 1000;
      transform: translateY(-50%);
    }

    .turn-btn:hover {
      transform: translateY(-50%) translateY(-1px);
    }

    .turn-btn.is-active {
      color: #fff;
      border-color: rgba(25, 200, 117, 0.45);
      background: linear-gradient(135deg, #22d77b, #069b54);
      box-shadow: 0 10px 20px rgba(25, 200, 117, 0.24);
    }

    .connected-empty {
      margin: 0;
      padding: 18px 12px;
      color: var(--muted);
      font-weight: 1000;
      text-align: center;
      border-radius: 22px;
      background: rgba(255,255,255,0.58);
      border: 1px dashed rgba(16, 11, 47, 0.14);
    }

    textarea {
      min-height: 0;
      width: 100%;
      resize: none;
      border: 1px solid rgba(16, 11, 47, 0.12);
      border-radius: 24px;
      padding: 14px 16px;
      font: inherit;
      font-weight: 900;
      color: var(--ink);
      background: rgba(255,255,255,0.9);
      outline: none;
      box-shadow: inset 0 0 0 1px rgba(16, 11, 47, 0.03);
    }

    textarea:focus {
      border-color: rgba(8, 125, 255, 0.38);
      box-shadow: 0 0 0 4px rgba(8, 125, 255, 0.12);
    }

    .names-panel {
      position: absolute;
      right: clamp(12px, 2vw, 24px);
      top: clamp(12px, 2vw, 24px);
      bottom: clamp(12px, 2vw, 24px);
      width: clamp(190px, 22vw, 310px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 8px;
      padding: 12px;
      border-radius: 28px;
      background: rgba(255,255,255,0.76);
      border: 1px solid rgba(8, 125, 255, 0.18);
      box-shadow: 0 20px 50px rgba(16, 11, 47, 0.12);
      opacity: 0;
      transform: translateX(22px) scale(0.96);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
      z-index: 6;
    }

    .stage.is-list-visible .names-panel {
      opacity: 1;
      transform: translateX(0) scale(1);
      pointer-events: auto;
    }

    .names-panel-head {
      min-width: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .names-panel h2 {
      margin: 0;
      min-width: 0;
      color: #3e3580;
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .names-panel-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .list-add-btn,
    .list-clear-btn {
      min-height: 28px;
      padding: 0 10px;
      font-size: 0.7rem;
    }

    .list-add-btn {
      color: #fff;
      background: linear-gradient(135deg, #087dff, #3024d8);
      box-shadow: 0 8px 18px rgba(8, 125, 255, 0.18);
    }

    .list-add-btn:disabled {
      opacity: 0.48;
      cursor: not-allowed;
      transform: none;
    }

    .list-clear-btn {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 8px 18px rgba(255, 37, 65, 0.18);
    }

    .entry-count {
      color: var(--red);
    }

    .names-panel textarea {
      border-radius: 20px;
      padding: 12px 13px;
      background: rgba(255,255,255,0.94);
    }

    .empty {
      padding: 14px;
      color: var(--muted);
      font-weight: 1000;
      text-align: center;
    }

    .qr-modal {
      position: fixed;
      inset: 0;
      z-index: 50;
      padding: clamp(12px, 3vw, 28px);
      background: rgba(16, 11, 47, 0.42);
      backdrop-filter: blur(18px);
      overflow: hidden;
    }

    .qr-modal-card {
      position: fixed;
      left: 50vw;
      top: 50vh;
      transform: translate(-50%, -50%);
      width: min(92vw, 980px);
      height: min(88vh, 820px);
      max-width: calc(100vw - clamp(24px, 6vw, 56px));
      max-height: calc(100vh - clamp(24px, 6vw, 56px));
      padding: clamp(16px, 3vw, 28px);
      border-radius: clamp(28px, 4vw, 42px);
      display: grid;
      grid-template-columns: minmax(0, 1.15fr) minmax(240px, 0.85fr);
      gap: clamp(14px, 2vw, 22px);
      background: rgba(255,255,255,0.92);
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 32px 90px rgba(16, 11, 47, 0.28);
      animation: qrModalIn 220ms ease both;
      overflow: hidden;
    }

    .qr-modal-main {
      min-width: 0;
      min-height: 0;
      display: grid;
      gap: 10px;
      place-items: center;
    }

    .qr-modal-main img {
      width: min(100%, 620px);
      max-height: min(62vh, 600px);
      border-radius: 24px;
      image-rendering: pixelated;
      background: #fff;
    }

    .qr-modal-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
    }

    .qr-modal-actions button {
      min-height: 38px;
    }

    .qr-modal-list-panel {
      min-height: 0;
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      padding: 14px;
      border-radius: 28px;
      background: rgba(255,255,255,0.68);
      border: 1px solid var(--line);
    }

    .qr-modal-list-panel h3 {
      margin: 0;
      color: #3e3580;
      font-size: 0.95rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .qr-modal-names {
      min-height: 0;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      font-weight: 1000;
      line-height: 1.55;
      white-space: pre-line;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: clamp(16px, 4vw, 34px);
      background: rgba(16, 11, 47, 0.36);
      backdrop-filter: blur(14px);
    }

    .confirm-overlay.hidden {
      display: none;
    }

    .confirm-modal {
      width: min(92vw, 460px);
      padding: clamp(20px, 4vw, 28px);
      border-radius: 32px;
      text-align: center;
      background:
        radial-gradient(circle at 15% 0%, rgba(255, 212, 38, 0.24), transparent 38%),
        linear-gradient(145deg, rgba(255,255,255,0.96), rgba(238,248,255,0.92));
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 30px 84px rgba(16, 11, 47, 0.28);
      animation: confirmModalIn 180ms ease both;
    }

    .confirm-kicker {
      margin: 0 0 8px;
      color: var(--red);
      font-size: 0.76rem;
      font-weight: 1000;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .confirm-title {
      margin: 0;
      color: var(--ink);
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      line-height: 0.95;
      letter-spacing: -0.04em;
    }

    .confirm-text {
      margin: 12px 0 18px;
      color: var(--muted);
      font-weight: 900;
      line-height: 1.4;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .confirm-actions .ghost {
      color: var(--ink);
      background: rgba(255,255,255,0.94);
      border: 1px solid var(--line);
    }

    .hidden { display: none !important; }

    @keyframes winnerPop {
      0% { --winner-y: 20px; --winner-scale: 0.92; opacity: 0; }
      65% { --winner-y: 0px; --winner-scale: 1.04; opacity: 1; }
      100% { --winner-y: 0px; --winner-scale: 1; opacity: 1; }
    }

    @keyframes qrModalIn {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.92); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes confirmModalIn {
      0% { opacity: 0; transform: scale(0.92); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (max-height: 760px) and (min-width: 761px) {
      .app {
        grid-template-columns: minmax(0, 1fr) minmax(210px, 270px);
      }
      .wheel-wrap { width: min(70vmin, 610px); }
      .winner-name { font-size: clamp(1.9rem, 5vw, 4rem); }
      .qr-box img { width: min(100%, 150px); }
      button { min-height: 40px; }
      .names-panel { width: clamp(170px, 20vw, 260px); }
      .stage.is-list-visible { --stage-shift: clamp(-150px, -11vw, -105px); }
    }

    @media (max-width: 760px) {
      body { height: auto; overflow: auto; }
      .app {
        height: auto;
        min-height: 100dvh;
        grid-template-columns: 1fr;
      }
      .main { min-height: 62vh; }
      .topbar { grid-template-columns: 1fr; }
      .status { justify-self: stretch; }
      .actions { justify-content: stretch; }
      .actions button { flex: 1; }
      .stage.is-list-visible .wheel-wrap {
        transform: none;
      }
      .stage.is-list-visible {
        --stage-shift: 0px;
      }
      .names-panel {
        position: relative;
        inset: auto;
        width: 100%;
        min-height: 260px;
        order: 2;
      }
      .stage:not(.is-list-visible) .names-panel {
        display: none;
      }
      .side-panel {
        min-height: min(360px, 68vh);
      }
      .qr-modal-card {
        grid-template-columns: 1fr;
        width: min(92vw, 520px);
        height: min(90vh, 760px);
      }
      .qr-modal-main img {
        max-height: 42vh;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="main">
      <header class="topbar">
        <div class="status">
          <p class="status-label">Entries</p>
          <p class="status-main" id="nameCount">0</p>
        </div>
        <div class="actions">
          <button class="mode-toggle" id="modeToggleBtn" type="button">Keep Pick</button>
          <button id="listToggleBtn" type="button">Hide List</button>
          <button id="homeBtn" type="button">Home</button>
        </div>
      </header>

      <section class="stage is-list-visible" id="stage">
        <div class="wheel-wrap">
          <canvas id="wheelCanvas" width="1000" height="1000" aria-label="Name wheel"></canvas>
          <div class="wheel-ring"></div>
          <div class="pointer"></div>
          <button class="center-spin spin-btn" id="spinBtn" type="button">Spin</button>
        </div>
        <div class="winner-banner" id="winnerBanner">
          <p class="winner-label">Selected</p>
          <p class="winner-name" id="winnerName">Name</p>
          <button class="winner-close" id="winnerCloseBtn" type="button">Close</button>
        </div>
        <div class="names-panel" id="namesPanel">
          <div class="names-panel-head">
            <h2>Entries <span class="entry-count" id="entryCount">(0)</span></h2>
            <div class="names-panel-actions">
              <button class="list-add-btn" id="addPlayersBtn" type="button">Add Players</button>
              <button class="list-clear-btn" id="clearEntriesBtn" type="button">Clear</button>
            </div>
          </div>
          <textarea id="namesInput" spellcheck="false" placeholder="Type or paste entries here. One per line."></textarea>
        </div>
      </section>
    </section>

    <aside class="side-panel" id="sidePanel" aria-label="Connected players">
      <div class="side-panel-head">
        <h2>Players <span id="playerCount">(0)</span></h2>
        <input class="player-filter" id="playerFilterInput" type="search" placeholder="Find" aria-label="Filter players" autocomplete="off">
      </div>
      <button class="hidden" id="qrToggleBtn" type="button">Show QR</button>
      <div class="hidden" id="qrBox" role="button" tabindex="-1">
        <img id="qrImage" alt="">
        <p id="roomCode">-----</p>
      </div>
      <div class="connected-list" id="connectedList"></div>
    </aside>
  </main>

  <div class="qr-modal hidden" id="qrModal" aria-hidden="true">
    <div class="qr-modal-card">
      <div class="qr-modal-main">
        <img id="qrLargeImage" alt="Large name wheel room QR">
        <p class="room-code" id="qrLargeCode">-----</p>
        <div class="qr-modal-actions">
          <button id="qrModalCloseBtn" type="button">Close</button>
        </div>
      </div>
      <section class="qr-modal-list-panel" aria-label="Connected players">
        <h3>Connected Players</h3>
        <div class="qr-modal-names" id="qrModalNames"></div>
      </section>
    </div>
  </div>

  <div class="confirm-overlay hidden" id="confirmOverlay">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <p class="confirm-kicker">Confirm</p>
      <h2 class="confirm-title" id="confirmTitle">Are you sure?</h2>
      <p class="confirm-text" id="confirmText">This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="ghost" id="confirmCancelBtn" type="button">Cancel</button>
        <button class="danger" id="confirmAcceptBtn" type="button">Continue</button>
      </div>
    </div>
  </div>

  <script>
    const storageKey = "name-wheel-room-code";
    const classroomStorageKey = "friendzy-classroom-code";
    const colors = ["#087dff", "#ff2541", "#ff8a00", "#19c875", "#3024d8", "#ffd426", "#00b8ff", "#ff5db1"];
    const stage = document.getElementById("stage");
    const canvas = document.getElementById("wheelCanvas");
    const ctx = canvas.getContext("2d");
    const nameCountEl = document.getElementById("nameCount");
    const entryCountEl = document.getElementById("entryCount");
    const spinBtn = document.getElementById("spinBtn");
    const modeToggleBtn = document.getElementById("modeToggleBtn");
    const listToggleBtn = document.getElementById("listToggleBtn");
    const addPlayersBtn = document.getElementById("addPlayersBtn");
    const clearEntriesBtn = document.getElementById("clearEntriesBtn");
    const homeBtn = document.getElementById("homeBtn");
    const resetBtn = document.getElementById("resetBtn");
    const qrToggleBtn = document.getElementById("qrToggleBtn");
    const sidePanel = document.getElementById("sidePanel");
    const qrBox = document.getElementById("qrBox");
    const qrImage = document.getElementById("qrImage");
    const roomCodeEl = document.getElementById("roomCode");
    const qrModal = document.getElementById("qrModal");
    const qrLargeImage = document.getElementById("qrLargeImage");
    const qrLargeCode = document.getElementById("qrLargeCode");
    const qrModalNames = document.getElementById("qrModalNames");
    const qrModalCloseBtn = document.getElementById("qrModalCloseBtn");
    const connectedList = document.getElementById("connectedList");
    const playerFilterInput = document.getElementById("playerFilterInput");
    const confirmOverlay = document.getElementById("confirmOverlay");
    const confirmTitle = document.getElementById("confirmTitle");
    const confirmText = document.getElementById("confirmText");
    const confirmCancelBtn = document.getElementById("confirmCancelBtn");
    const confirmAcceptBtn = document.getElementById("confirmAcceptBtn");
    const namesInput = document.getElementById("namesInput");
    const winnerBanner = document.getElementById("winnerBanner");
    const winnerName = document.getElementById("winnerName");
    const winnerCloseBtn = document.getElementById("winnerCloseBtn");
    const playerCountEl = document.getElementById("playerCount");

    let room = null;
    let baseUrl = window.location.origin;
    let qrVisible = false;
    let listVisible = true;
    let names = [];
    let connectedPlayers = [];
    let playerFilter = "";
    let connectedListSignature = "";
    let turnRequestInFlight = false;
    let spinningNames = null;
    let removeWinner = false;
    let pendingRemovalName = "";
    const removedNames = new Set();
    let rotation = 0;
    let spinning = false;
    let spinStartedAt = 0;
    let spinTimeout = null;
    let boostWindowTimer = null;
    let spinWinnerIndex = -1;
    let tickAnimationFrame = null;
    let lastTickBoundary = null;
    let pollTimer = null;
    let syncTimer = null;
    let lastHandledSpinCommandId = 0;
    let audioContext = null;
    let editingNames = false;
    let namesDirty = false;
    let editIdleTimer = null;
    let confirmState = null;
    const spinEasing = "cubic-bezier(0.07, 0.64, 0.01, 1)";
    const boostWindowMs = 3000;

    async function api(path, payload = null, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: payload ? { "Content-Type": "application/json" } : undefined,
        body: payload ? JSON.stringify(payload) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function normalize(values) {
      const seen = new Set();
      return values
        .map((value) => String(value || "").trim())
        .filter(Boolean)
        .filter((value) => {
          const key = value.toLowerCase();
          if (seen.has(key)) return false;
          seen.add(key);
          return true;
        })
        .slice(0, 500);
    }

    function getInputNames() {
      return normalize(namesInput.value.split(/\r?\n/));
    }

    function commitNamesFromInput(updateInput = false) {
      pendingRemovalName = "";
      removedNames.clear();
      setNames(getInputNames(), updateInput);
      scheduleSync();
    }

    function setNames(nextNames, updateInput = true) {
      const normalizedNames = normalize(nextNames);
      const changed = normalizedNames.join("\n") !== names.join("\n");
      names = normalizedNames;
      if (updateInput && namesInput.value !== names.join("\n")) {
        namesInput.value = names.join("\n");
      }
      if (!changed && updateInput) return;
      render();
    }

    function mergeNames(remoteNames) {
      if (editingNames) {
        return;
      }
      const nextNames = normalize(remoteNames || [])
        .filter((name) => !removedNames.has(String(name || "").trim().toLowerCase()));
      setNames(nextNames, true);
    }

    function drawWheel() {
      const wheelNames = spinningNames || names;
      const size = canvas.width;
      const center = size / 2;
      const radius = size * 0.47;
      ctx.clearRect(0, 0, size, size);
      ctx.save();
      ctx.translate(center, center);

      if (!wheelNames.length) {
        const emptySlices = 7;
        const slice = (Math.PI * 2) / emptySlices;
        for (let index = 0; index < emptySlices; index += 1) {
          const start = -Math.PI / 2 + index * slice;
          const end = start + slice;
          ctx.beginPath();
          ctx.moveTo(0, 0);
          ctx.arc(0, 0, radius, start, end);
          ctx.closePath();
          ctx.fillStyle = colors[index % colors.length];
          ctx.fill();
          ctx.strokeStyle = "rgba(255,255,255,0.78)";
          ctx.lineWidth = 5;
          ctx.stroke();
        }
        ctx.beginPath();
        ctx.arc(0, 0, radius * 0.18, 0, Math.PI * 2);
        ctx.fillStyle = "#fff";
        ctx.fill();
        ctx.lineWidth = 10;
        ctx.strokeStyle = "rgba(16,11,47,0.12)";
        ctx.stroke();
        ctx.restore();
        return;
      }

      const slice = (Math.PI * 2) / wheelNames.length;
      wheelNames.forEach((name, index) => {
        const start = -Math.PI / 2 + index * slice;
        const end = start + slice;
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.arc(0, 0, radius, start, end);
        ctx.closePath();
        ctx.fillStyle = colors[index % colors.length];
        ctx.fill();
        ctx.strokeStyle = "rgba(255,255,255,0.78)";
        ctx.lineWidth = 5;
        ctx.stroke();

        ctx.save();
        ctx.rotate(start + slice / 2);
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#fff";
        ctx.font = `1000 ${Math.max(24, Math.min(44, 280 / Math.max(6, wheelNames.length)))}px Trebuchet MS`;
        ctx.shadowColor = "rgba(0,0,0,0.25)";
        ctx.shadowBlur = 8;
        ctx.fillText(name.slice(0, 22), radius - 42, 0);
        ctx.restore();
      });

      ctx.beginPath();
      ctx.arc(0, 0, radius * 0.18, 0, Math.PI * 2);
      ctx.fillStyle = "#fff";
      ctx.fill();
      ctx.lineWidth = 10;
      ctx.strokeStyle = "rgba(16,11,47,0.12)";
      ctx.stroke();
      ctx.restore();
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function sameName(a, b) {
      return String(a || "").trim().toLowerCase() === String(b || "").trim().toLowerCase();
    }

    function getJoinUrl() {
      if (!room) return "";
      return `${baseUrl}/name-wheel-student.html?code=${encodeURIComponent(room.code)}`;
    }

    function getQrSrc(size = 420) {
      if (!room) return "";
      return `https://api.qrserver.com/v1/create-qr-code/?size=${size}x${size}&data=${encodeURIComponent(getJoinUrl())}`;
    }

    function renderPlayerPills(target, filterText = "") {
      const filter = String(filterText || "").trim().toLowerCase();
      const players = filter
        ? connectedPlayers.filter((player) => String(player.name || "").toLowerCase().includes(filter))
        : connectedPlayers;
      const signature = `${target.id || "players"}|${filter}|${room?.activeTurnName || ""}|${players.map((player) => player.name).join("|")}`;
      if (target === connectedList && signature === connectedListSignature) {
        return;
      }
      if (target === connectedList) {
        connectedListSignature = signature;
      }
      if (!players.length) {
        target.innerHTML = `<p class="connected-empty">Connected players will appear here.</p>`;
        return;
      }
      target.innerHTML = players.map((player) => `
        <div class="connected-pill">
          <span class="connected-name">${escapeHtml(player.name)}</span>
          <button class="turn-btn ${sameName(room?.activeTurnName, player.name) ? "is-active" : ""}" type="button" data-turn-name="${escapeHtml(player.name)}">Turn</button>
        </div>
      `).join("");
    }

    function renderQrModalNames() {
      renderPlayerPills(qrModalNames);
    }

    function renderConnectedList() {
      renderPlayerPills(connectedList, playerFilter);
    }

    function render() {
      nameCountEl.textContent = names.length;
      entryCountEl.textContent = `(${names.length})`;
      playerCountEl.textContent = `(${connectedPlayers.length})`;
      addPlayersBtn.disabled = !connectedPlayers.length || spinning;
      clearEntriesBtn.disabled = !names.length || spinning;
      spinBtn.disabled = names.length < 2 || (spinning && !canBoost());
      spinBtn.textContent = spinning ? (canBoost() ? "Boost" : "Locked") : "Spin";
      modeToggleBtn.textContent = removeWinner ? "Remove Pick" : "Keep Pick";
      modeToggleBtn.classList.toggle("is-remove", removeWinner);
      listToggleBtn.textContent = listVisible ? "Hide List" : "Show List";
      stage.classList.toggle("is-list-visible", listVisible);
      drawWheel();
      renderConnectedList();

      if (!room) {
        roomCodeEl.textContent = "-----";
        qrImage.removeAttribute("src");
      } else {
        localStorage.setItem(storageKey, room.code);
        roomCodeEl.textContent = room.code;
        qrImage.src = getQrSrc(420);
        qrLargeCode.textContent = room.code;
        qrLargeImage.src = getQrSrc(720);
      }
      renderQrModalNames();

      sidePanel.classList.toggle("is-qr-hidden", !qrVisible);
      qrBox.classList.toggle("hidden", !qrVisible || !room);
      qrToggleBtn.textContent = qrVisible ? "Hide QR" : "Show QR";
    }

    function openQrModal() {
      if (!room || !qrVisible) return;
      qrModal.classList.remove("hidden");
      qrModal.setAttribute("aria-hidden", "false");
      renderQrModalNames();
    }

    function closeQrModal() {
      qrModal.classList.add("hidden");
      qrModal.setAttribute("aria-hidden", "true");
    }

    function closeConfirm(result) {
      if (!confirmState) return;
      const { resolve } = confirmState;
      confirmState = null;
      confirmOverlay.classList.add("hidden");
      resolve(result);
    }

    function openConfirm({ title, text, confirmLabel = "Continue" }) {
      confirmTitle.textContent = title;
      confirmText.textContent = text;
      confirmAcceptBtn.textContent = confirmLabel;
      confirmOverlay.classList.remove("hidden");
      confirmAcceptBtn.focus();
      return new Promise((resolve) => {
        confirmState = { resolve };
      });
    }

    async function hydrateBaseUrl() {
      try {
        const data = await api("/api/live/server-info", null, "GET");
        const onLocalHost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
        baseUrl = onLocalHost && data?.localOrigin ? data.localOrigin : (data?.publicOrigin || window.location.origin);
      } catch (_) {}
    }

    async function ensureRoom() {
      if (room) return room;
      const savedCode = localStorage.getItem(storageKey);
      if (savedCode) {
        try {
          const existing = await api(`/api/wheel/room?code=${encodeURIComponent(savedCode)}`, null, "GET");
          room = existing.room;
          lastHandledSpinCommandId = Number(room.spinCommandId || 0);
          connectedPlayers = room.players || [];
          await importClassroomPlayers();
          mergeNames(room.names);
          setClassroomTool("wheel", room.code).catch(() => {});
          return room;
        } catch (_) {
          localStorage.removeItem(storageKey);
        }
      }
      const data = await api("/api/wheel/create-room");
      room = data.room;
      lastHandledSpinCommandId = Number(room.spinCommandId || 0);
      connectedPlayers = room.players || [];
      await importClassroomPlayers();
      await syncNamesNow();
      setClassroomTool("wheel", room.code).catch(() => {});
      return room;
    }

    async function setClassroomTool(activeTool = "wheel", activeToolCode = room?.code || "") {
      const classroomCode = localStorage.getItem(classroomStorageKey);
      if (!classroomCode) return;
      try {
        await api("/api/classroom/set-tool", { code: classroomCode, activeTool, activeToolCode });
      } catch (_) {}
    }

    async function importClassroomPlayers() {
      const classroomCode = localStorage.getItem(classroomStorageKey);
      if (!room || !classroomCode) return false;
      try {
        const data = await api("/api/wheel/import-classroom", { code: room.code, classroomCode });
        room = data.room;
        connectedPlayers = room.players || [];
        return true;
      } catch (_) {
        return false;
      }
    }

    async function syncNamesNow() {
      if (!room) return;
      const data = await api("/api/wheel/sync", { code: room.code, names });
      room = data.room;
      connectedPlayers = room.players || [];
      if (!editingNames) {
        setNames(room.names || [], true);
      } else {
        names = room.names || [];
      }
      render();
    }

    function scheduleSync() {
      clearTimeout(syncTimer);
      syncTimer = setTimeout(() => {
        syncNamesNow().catch(() => {});
      }, 250);
    }

    function getAudioContext() {
      if (!audioContext) {
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioContext.state === "suspended") {
        audioContext.resume().catch(() => {});
      }
      return audioContext;
    }

    function playWinChime() {
      try {
        const audio = getAudioContext();
        const now = audio.currentTime;
        [523.25, 659.25, 783.99, 1046.5].forEach((pitch, index) => {
          const start = now + index * 0.09;
          const osc = audio.createOscillator();
          const gain = audio.createGain();
          osc.type = "triangle";
          osc.frequency.setValueAtTime(pitch, start);
          gain.gain.setValueAtTime(0.0001, start);
          gain.gain.exponentialRampToValueAtTime(0.18, start + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.42);
          osc.connect(gain);
          gain.connect(audio.destination);
          osc.start(start);
          osc.stop(start + 0.45);
        });
      } catch (_) {}
    }

    function playWheelTick(strength = 1) {
      try {
        const audio = getAudioContext();
        const now = audio.currentTime;
        const volume = Math.min(0.18, 0.09 + strength * 0.035);
        const noiseLength = Math.floor(audio.sampleRate * 0.028);
        const noiseBuffer = audio.createBuffer(1, noiseLength, audio.sampleRate);
        const noiseData = noiseBuffer.getChannelData(0);
        for (let index = 0; index < noiseLength; index += 1) {
          const fade = 1 - index / noiseLength;
          noiseData[index] = (Math.random() * 2 - 1) * fade;
        }
        const noise = audio.createBufferSource();
        const filter = audio.createBiquadFilter();
        const noiseGain = audio.createGain();
        noise.buffer = noiseBuffer;
        filter.type = "bandpass";
        filter.frequency.setValueAtTime(2600, now);
        filter.Q.setValueAtTime(5, now);
        noiseGain.gain.setValueAtTime(0.0001, now);
        noiseGain.gain.exponentialRampToValueAtTime(volume, now + 0.003);
        noiseGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.03);
        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(audio.destination);
        noise.start(now);
        noise.stop(now + 0.034);

        const tone = audio.createOscillator();
        const toneGain = audio.createGain();
        tone.type = "triangle";
        tone.frequency.setValueAtTime(980 + Math.min(220, strength * 80), now);
        tone.frequency.exponentialRampToValueAtTime(520, now + 0.045);
        toneGain.gain.setValueAtTime(0.0001, now);
        toneGain.gain.exponentialRampToValueAtTime(volume * 0.45, now + 0.004);
        toneGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.055);
        tone.connect(toneGain);
        toneGain.connect(audio.destination);
        tone.start(now);
        tone.stop(now + 0.06);
      } catch (_) {}
    }

    function stopBoundaryTicks() {
      if (tickAnimationFrame) {
        cancelAnimationFrame(tickAnimationFrame);
      }
      tickAnimationFrame = null;
      lastTickBoundary = null;
    }

    function startBoundaryTicks() {
      stopBoundaryTicks();
      getAudioContext();
      const activeNames = spinningNames || names;
      if (activeNames.length < 2) return;
      const sliceDeg = 360 / activeNames.length;
      let previousAngle = getCurrentWheelAngle();
      lastTickBoundary = Math.floor((((-previousAngle % 360) + 360) % 360) / sliceDeg);

      const tick = () => {
        if (!spinning) {
          stopBoundaryTicks();
          return;
        }
        const angle = getCurrentWheelAngle();
        const localFromTop = (((-angle % 360) + 360) % 360);
        const boundary = Math.floor(localFromTop / sliceDeg);
        if (boundary !== lastTickBoundary) {
          const movement = Math.abs(angle - previousAngle);
          playWheelTick(Math.min(3, Math.max(0.7, movement / sliceDeg)));
          lastTickBoundary = boundary;
        }
        previousAngle = angle;
        tickAnimationFrame = requestAnimationFrame(tick);
      };

      tickAnimationFrame = requestAnimationFrame(tick);
    }

    function getCurrentWheelAngle() {
      const transform = getComputedStyle(canvas).transform;
      if (!transform || transform === "none") {
        return ((rotation % 360) + 360) % 360;
      }
      const matrix = new DOMMatrixReadOnly(transform);
      return ((Math.atan2(matrix.b, matrix.a) * 180 / Math.PI) + 360) % 360;
    }

    function setWheelTransition(durationMs) {
      canvas.style.transition = `transform ${durationMs}ms ${spinEasing}`;
    }

    function getIndexAtPointer(rotationDeg, count) {
      if (!count) return -1;
      const sliceDeg = 360 / count;
      const normalizedRotation = ((rotationDeg % 360) + 360) % 360;
      const localFromTop = ((-normalizedRotation % 360) + 360) % 360;
      return Math.floor(localFromTop / sliceDeg) % count;
    }

    function scheduleSpinFinish(durationMs) {
      clearTimeout(spinTimeout);
      spinTimeout = setTimeout(() => {
        const activeNames = spinningNames || names;
        const selectedIndex = getIndexAtPointer(rotation, activeNames.length);
        const selectedName = activeNames[selectedIndex] || activeNames[spinWinnerIndex] || activeNames[0] || "Name";
        winnerName.textContent = selectedName;
        playWinChime();
        stopBoundaryTicks();
        winnerBanner.classList.remove("show");
        winnerBanner.offsetHeight;
        winnerBanner.classList.add("show");
        spinning = false;
        spinStartedAt = 0;
        clearTimeout(boostWindowTimer);
        boostWindowTimer = null;
        spinningNames = null;
        spinWinnerIndex = -1;
        if (removeWinner && selectedName) {
          pendingRemovalName = selectedName;
        }
        render();
      }, durationMs + 80);
    }

    function boostSpin() {
      if (!canBoost()) return;
      const boostDurationMs = 5200;
      const activeNames = spinningNames || names;
      const currentAngle = getCurrentWheelAngle();
      canvas.style.transition = "none";
      canvas.style.transform = `rotate(${currentAngle}deg)`;
      canvas.offsetHeight;
      const sliceDeg = 360 / activeNames.length;
      const centerDeg = spinWinnerIndex * sliceDeg + sliceDeg / 2;
      const desired = (360 - centerDeg) % 360;
      rotation = currentAngle + 4 * 360 + ((desired - currentAngle + 360) % 360);
      setWheelTransition(boostDurationMs);
      canvas.style.transform = `rotate(${rotation}deg)`;
      armBoostWindow();
      scheduleSpinFinish(boostDurationMs);
    }

    async function pollRoom() {
      if (!room) return;
      try {
        const data = await api(`/api/wheel/room?code=${encodeURIComponent(room.code)}`, null, "GET");
        room = data.room;
        connectedPlayers = room.players || [];
        await importClassroomPlayers();
        mergeNames(room.names);
        processRemoteSpinCommand();
      } catch (_) {
        room = null;
        qrVisible = false;
        localStorage.removeItem(storageKey);
        render();
      } finally {
        pollTimer = setTimeout(pollRoom, 300);
      }
    }

    function startPolling() {
      clearTimeout(pollTimer);
      pollTimer = setTimeout(pollRoom, 700);
    }

    async function togglePlayerTurn(name) {
      if (!room || !name || turnRequestInFlight) return;
      turnRequestInFlight = true;
      const previousTurnName = room.activeTurnName || "";
      room.activeTurnName = sameName(previousTurnName, name) ? "" : name;
      connectedListSignature = "";
      render();
      try {
        const data = await api("/api/wheel/set-turn", { code: room.code, name });
        room = data.room;
        connectedPlayers = room.players || [];
        render();
      } catch (_) {
        if (room) room.activeTurnName = previousTurnName;
        render();
      } finally {
        turnRequestInFlight = false;
      }
    }

    async function consumeActiveTurn() {
      const turnName = room?.activeTurnName || "";
      if (!room || !turnName) return;
      try {
        const data = await api("/api/wheel/consume-turn", { code: room.code, name: turnName });
        room = data.room;
        connectedPlayers = room.players || [];
      } catch (_) {
        if (room) room.activeTurnName = "";
      }
      render();
    }

    function processRemoteSpinCommand() {
      const commandId = Number(room?.spinCommandId || 0);
      if (!commandId || commandId <= lastHandledSpinCommandId) return;
      const pendingCommands = Math.min(6, commandId - lastHandledSpinCommandId);
      lastHandledSpinCommandId = commandId;
      for (let index = 0; index < pendingCommands; index += 1) {
        spin();
      }
    }

    function spin() {
      if (spinning) {
        boostSpin();
        render();
        return;
      }
      if (namesDirty) {
        clearTimeout(editIdleTimer);
        commitNamesFromInput(false);
        namesDirty = false;
      }
      if (pendingRemovalName) {
        const pendingKey = pendingRemovalName.toLowerCase();
        removedNames.add(pendingKey);
        const nextNames = names.filter((name) => name.toLowerCase() !== pendingKey);
        if (nextNames.length !== names.length) {
          names = nextNames;
          namesInput.value = names.join("\n");
          syncNamesNow().catch(() => scheduleSync());
        }
        pendingRemovalName = "";
      }
      if (names.length < 2) return;
      spinning = true;
      armBoostWindow();
      spinningNames = names.slice();
      const spinDurationMs = 8400;
      winnerBanner.classList.remove("show");
      const winnerIndex = Math.floor(Math.random() * spinningNames.length);
      spinWinnerIndex = winnerIndex;
      const sliceDeg = 360 / spinningNames.length;
      const centerDeg = winnerIndex * sliceDeg + sliceDeg / 2;
      const extraTurns = 6 + Math.floor(Math.random() * 3);
      const current = ((rotation % 360) + 360) % 360;
      const desired = (360 - centerDeg) % 360;
      const delta = extraTurns * 360 + ((desired - current + 360) % 360);
      rotation += delta;
      setWheelTransition(spinDurationMs);
      canvas.style.transform = `rotate(${rotation}deg)`;
      render();
      startBoundaryTicks();
      scheduleSpinFinish(spinDurationMs);
    }

    function canBoost() {
      return spinning && spinStartedAt > 0 && performance.now() - spinStartedAt <= boostWindowMs;
    }

    function armBoostWindow() {
      spinStartedAt = performance.now();
      clearTimeout(boostWindowTimer);
      boostWindowTimer = setTimeout(() => {
        consumeActiveTurn();
        render();
      }, boostWindowMs + 30);
    }

    namesInput.addEventListener("input", () => {
      editingNames = true;
      namesDirty = true;
      clearTimeout(editIdleTimer);
      editIdleTimer = setTimeout(() => {
        if (namesDirty) {
          commitNamesFromInput(false);
          namesDirty = false;
        }
      }, 900);
    });

    playerFilterInput.addEventListener("input", () => {
      playerFilter = playerFilterInput.value;
      renderConnectedList();
    });

    document.addEventListener("click", (event) => {
      const turnBtn = event.target.closest("[data-turn-name]");
      if (!turnBtn) return;
      event.preventDefault();
      event.stopPropagation();
      turnBtn.blur();
      togglePlayerTurn(turnBtn.dataset.turnName || "");
    });

    namesInput.addEventListener("focus", () => {
      editingNames = true;
    });

    namesInput.addEventListener("blur", () => {
      clearTimeout(editIdleTimer);
      editingNames = false;
      if (namesDirty) {
        commitNamesFromInput(true);
        namesDirty = false;
      }
    });

    spinBtn.addEventListener("click", () => {
      spinBtn.blur();
      spin();
    });
    modeToggleBtn.addEventListener("click", () => {
      removeWinner = !removeWinner;
      render();
    });
    winnerCloseBtn.addEventListener("click", () => {
      winnerBanner.classList.remove("show");
    });
    listToggleBtn.addEventListener("click", () => {
      listVisible = !listVisible;
      render();
    });
    addPlayersBtn.addEventListener("click", () => {
      if (!connectedPlayers.length || spinning) return;
      const playerNames = connectedPlayers.map((player) => player.name).filter(Boolean);
      const nextNames = normalize([...names, ...playerNames]);
      pendingRemovalName = "";
      removedNames.clear();
      namesDirty = false;
      editingNames = false;
      setNames(nextNames, true);
      syncNamesNow().catch(() => scheduleSync());
    });
    clearEntriesBtn.addEventListener("click", async () => {
      if (!names.length || spinning) return;
      const confirmed = await openConfirm({
        title: "Clear entries?",
        text: "This will remove every entry from the wheel. Connected players will stay in the room.",
        confirmLabel: "Clear"
      });
      if (!confirmed) return;
      names = [];
      namesInput.value = "";
      pendingRemovalName = "";
      removedNames.clear();
      namesDirty = false;
      editingNames = false;
      winnerBanner.classList.remove("show");
      syncNamesNow().catch(() => scheduleSync());
      render();
    });
    confirmCancelBtn.addEventListener("click", () => closeConfirm(false));
    confirmAcceptBtn.addEventListener("click", () => closeConfirm(true));
    confirmOverlay.addEventListener("click", (event) => {
      if (event.target === confirmOverlay) {
        closeConfirm(false);
      }
    });
    document.addEventListener("keydown", (event) => {
      const target = event.target;
      const isTyping = target && ["INPUT", "TEXTAREA", "SELECT"].includes(target.tagName);
      if (isTyping || event.code !== "Space") return;
      event.preventDefault();
      spinBtn.blur();
      spin();
    });
    homeBtn.addEventListener("click", () => {
      setClassroomTool("standby", "").finally(() => { window.location.href = "./"; });
    });

    resetBtn?.addEventListener("click", async () => {
      if (!confirm("Reset this wheel and clear all names?")) return;
      const oldCode = room?.code;
      names = [];
      namesInput.value = "";
      pendingRemovalName = "";
      removedNames.clear();
      winnerBanner.classList.remove("show");
      if (oldCode) {
        try { await api("/api/wheel/delete-room", { code: oldCode }); } catch (_) {}
      }
      room = null;
      connectedPlayers = [];
      qrVisible = false;
      localStorage.removeItem(storageKey);
      closeQrModal();
      render();
    });

    window.addEventListener("friendzy:reset", () => {
      const oldCode = room?.code || localStorage.getItem(storageKey);
      if (oldCode) {
        api("/api/wheel/delete-room", { code: oldCode }).catch(() => {});
      }
      room = null;
      connectedPlayers = [];
      qrVisible = false;
      localStorage.removeItem(storageKey);
      closeQrModal();
      render();
      ensureRoom().then(() => startPolling()).catch(() => {});
    });

    window.addEventListener("friendzy:player-removed", (event) => {
      const name = String(event.detail?.name || "").trim();
      if (!room || !name) return;
      api("/api/wheel/remove-player", { code: room.code, name })
        .then((data) => {
          room = data.room;
          connectedPlayers = room.players || [];
          render();
        })
        .catch(() => {});
    });

    window.addEventListener("friendzy:players-updated", () => {
      importClassroomPlayers().then((changed) => {
        if (changed) render();
      });
    });

    qrToggleBtn.addEventListener("click", async () => {
      if (!qrVisible) {
        await ensureRoom();
        qrVisible = true;
        render();
        startPolling();
        return;
      }
      qrVisible = false;
      closeQrModal();
      render();
    });

    qrBox.addEventListener("click", openQrModal);
    qrBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" || event.key === " ") {
        event.preventDefault();
        openQrModal();
      }
    });
    qrModalCloseBtn.addEventListener("click", closeQrModal);
    qrModal.addEventListener("click", (event) => {
      if (event.target === qrModal) {
        closeQrModal();
      }
    });

    hydrateBaseUrl().then(async () => {
      drawWheel();
      render();
      const savedCode = localStorage.getItem(storageKey);
      if (savedCode) {
        try {
          const data = await api(`/api/wheel/room?code=${encodeURIComponent(savedCode)}`, null, "GET");
          room = data.room;
          lastHandledSpinCommandId = Number(room.spinCommandId || 0);
          connectedPlayers = room.players || [];
          await importClassroomPlayers();
          mergeNames(room.names);
          setClassroomTool("wheel", room.code).catch(() => {});
          startPolling();
        } catch (_) {
          localStorage.removeItem(storageKey);
          render();
        }
      }
      if (!room && localStorage.getItem(classroomStorageKey)) {
        await ensureRoom();
        startPolling();
      }
    });
  </script>
  <script src="./friendzy-panel.js"></script>
</body>
</html>
