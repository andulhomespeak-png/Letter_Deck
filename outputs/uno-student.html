  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>

    .play-card { position:relative; flex:0 0 clamp(104px,31vw,142px); aspect-ratio:2 / 3; min-width:0; padding:0; overflow:hidden; border:3px solid transparent; border-radius:12%; background:#fff; box-shadow:0 7px 14px rgba(16,11,47,.18); cursor:pointer; scroll-snap-align:center; transition:transform 120ms ease,opacity 120ms ease,filter 120ms ease; touch-action:pan-x; }

    .draw-choice-card .uno-card { width:clamp(132px,42vw,180px); } .draw-choice-copy { margin:0; color:#100b2f; font-size:.82rem; font-weight:1000; text-align:center; }
    .draw-choice-actions { width:100%; display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; } .draw-choice-actions button { min-height:42px; border:0; border-radius:14px; color:#fff; font:inherit; font-size:.7rem; font-weight:1000; cursor:pointer; } .draw-choice-play { background:linear-gradient(135deg,#22c66f,#078c49); } .draw-choice-keep { background:linear-gradient(135deg,#5b6382,#252742); }

    .uno-call-toast.is-visible { opacity:1; transform:translate(-50%,0) scale(1); }
    .uno-penalty-toast { position:fixed; top:23%; left:50%; z-index:61; transform:translate(-50%,-10px) scale(.9); padding:12px 20px; border:3px solid rgba(255,255,255,.96); border-radius:20px; color:#fff; background:linear-gradient(135deg,#4b207d,#d91529); box-shadow:0 16px 30px rgba(0,0,0,.34),0 0 0 5px rgba(255,192,0,.2); font-size:.86rem; font-weight:1000; letter-spacing:.06em; opacity:0; pointer-events:none; text-align:center; transition:opacity 160ms ease,transform 160ms ease; white-space:nowrap; }
    .uno-penalty-toast.is-visible { opacity:1; transform:translate(-50%,0) scale(1); }
    .victory-modal { position:fixed; inset:0; z-index:70; display:grid; place-items:center; padding:24px; overflow:hidden; background:rgba(16,11,47,.34); backdrop-filter:blur(4px); animation:victory-overlay-in 180ms ease-out both; }

<body>
  <main class="card">
    <section class="table-zone" id="tableZone">
      <div class="turn-status" id="status">Connecting</div>
      <section class="table" aria-label="UNO table">
        <button class="draw-card" id="drawBtn" type="button" aria-label="Draw one card"><img src="./assets/uno/uno-card-back.png" alt=""></button>
        <section class="play-area" id="playedCards" aria-label="Played cards"></section>
        <section class="opening-reveal hidden" id="openingReveal" aria-label="Latest opening card"><div id="openingRevealCard"></div><span class="opening-score" id="openingScore"></span></section>
        <div class="uno-call-toast" id="unoCallToast" aria-live="polite"></div>
        <section class="incoming-cards hidden" id="incomingCards" aria-label="New cards"><div class="incoming-stack" id="incomingStack"></div></section>
        <section class="draw-choice hidden" id="drawChoice" aria-live="assertive"><div class="draw-choice-card"><div id="drawChoiceCard"></div><p class="draw-choice-copy">Play this card now?</p><div class="draw-choice-actions"><button class="draw-choice-play" data-draw-choice="play" type="button">Play now</button><button class="draw-choice-keep" data-draw-choice="keep" type="button">Keep card</button></div></div></section>
      </section>
      <div class="wild-panel hidden" id="wildPanel"><div><section class="wild-chooser"><button class="color-red" data-color="red" type="button">Red</button><button class="color-yellow" data-color="yellow" type="button">Yellow</button><button class="color-green" data-color="green" type="button">Green</button><button class="color-blue" data-color="blue" type="button">Blue</button></section></div></div>
    </section>
    <section class="hand-zone"><section class="opening-draw hidden" id="openingDraw" aria-label="Opening draw"><div class="opening-draw-list" id="openingDrawList"></div></section><section class="seat-strip hidden" id="seatStrip" aria-label="UNO player order"></section><section class="hand" id="hand" aria-label="Your cards"></section><div class="hand-meta"><button class="uno-call" id="unoCallBtn" type="button">UNO!</button><span class="own-card-count" id="ownCardCount">0 cards</span></div></section>
  </main>
  <section class="victory-modal hidden" id="victoryModal" aria-live="assertive"><i class="firework one"></i><i class="firework two"></i><i class="firework three"></i><div class="victory-card"><p class="victory-kicker">WINNER!</p><h1 class="victory-name" id="victoryName"></h1><p class="victory-copy">TAKES THE UNO TABLE</p></div></section>
  <div class="uno-penalty-toast" id="unoPenaltyToast" aria-live="assertive"></div>
  <div class="message" id="message" aria-live="polite"></div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const code = String(params.get("code") || "").toUpperCase(); const autoName = String(params.get("name") || "").trim(); const classroomCode = String(params.get("classroom") || "").toUpperCase(); const classroomPlayerId = Number(params.get("classroomPlayerId") || 0); const shouldAutoJoin = params.get("auto") === "1";
