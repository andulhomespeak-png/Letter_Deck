<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary Bingo Player</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --muted: rgba(16, 11, 47, 0.62);
      --line: rgba(16, 11, 47, 0.12);
      --blue: #087dff;
      --red: #ff2541;
      --green: #19c875;
      --orange: #ff8a00;
      --panel: rgba(255, 255, 255, 0.9);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 16% 16%, rgba(8, 125, 255, 0.34), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(255, 138, 0, 0.3), transparent 30%),
        radial-gradient(circle at 52% 90%, rgba(25, 200, 117, 0.22), transparent 34%),
        linear-gradient(135deg, #fff4cf 0%, #eef8ff 46%, #ffe2e8 100%);
    }

    .screen {
      min-height: 100vh;
      min-height: 100dvh;
      padding: clamp(10px, 3vw, 18px);
      display: grid;
      place-items: center;
    }

    .card {
      width: min(100%, 560px);
      border: 1px solid rgba(255,255,255,0.78);
      border-radius: 30px;
      background: var(--panel);
      box-shadow: 0 26px 78px rgba(16, 11, 47, 0.18);
      backdrop-filter: blur(18px);
      padding: clamp(16px, 4vw, 24px);
    }

    .join-card {
      display: grid;
      gap: 14px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 11vw, 4.1rem);
      line-height: 0.92;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: -0.06em;
      color: #fff;
      -webkit-text-stroke: 1.5px #071b63;
      text-shadow: 0 4px 0 var(--blue), 0 9px 0 var(--orange), 0 18px 28px rgba(7,20,60,0.25);
    }

    input {
      width: 100%;
      min-height: 54px;
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 0 16px;
      font: inherit;
      font-size: 1.05rem;
      font-weight: 900;
      outline: none;
      background: #fff;
    }

    button {
      border: 0;
      border-radius: 999px;
      min-height: 50px;
      padding: 0 18px;
      font: inherit;
      font-weight: 1000;
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
      box-shadow: 0 14px 32px rgba(25, 200, 117, 0.22);
      cursor: pointer;
      transition: transform 90ms ease, opacity 120ms ease;
    }

    button:active { transform: scale(0.96); }
    button:disabled { opacity: 0.48; cursor: not-allowed; transform: none; }

    .game {
      width: min(100%, 760px);
      display: none;
      gap: 8px;
      align-self: start;
      padding-top: clamp(2px, 1.2vh, 10px);
    }

    body.is-playing .join-card { display: none; }
    body.is-playing .game { display: grid; }

    .hud {
      display: grid;
      gap: 4px;
      align-items: center;
      justify-content: center;
      min-height: 72px;
      padding: 8px 12px 9px;
      border-radius: 22px;
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 14px 34px rgba(16,11,47,0.12);
    }

    .player-name {
      min-width: 0;
      font-size: clamp(1rem, 5vw, 1.5rem);
      font-weight: 1000;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .called {
      width: 100%;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,0.72);
      border: 1px solid rgba(8,125,255,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.88);
      font-size: clamp(1.2rem, 6vw, 2rem);
      font-weight: 1000;
      color: var(--ink);
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .hud .message {
      min-height: 0;
      padding: 0 10px;
      border: 0;
      border-radius: 0;
      background: transparent;
      box-shadow: none;
    }

    .board-wrap {
      display: grid;
      gap: 7px;
      padding: clamp(7px, 1.8vw, 12px);
      border-radius: 30px;
      background:
        radial-gradient(circle at 18% 8%, rgba(255,255,255,0.8), transparent 24%),
        linear-gradient(145deg, rgba(255,255,255,0.82), rgba(232,242,255,0.72));
      border: 1px solid rgba(255,255,255,0.78);
      box-shadow: 0 18px 46px rgba(16,11,47,0.14);
    }

    .bingo-letters {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(5px, 1.5vw, 9px);
      padding: clamp(5px, 1vw, 8px);
      width: 100%;
      min-height: clamp(54px, 12vw, 74px);
      border: 2px solid rgba(255,255,255,0.92);
      border-radius: 999px;
      background: linear-gradient(135deg, var(--green), #039b52);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.36),
        0 14px 32px rgba(25, 200, 117, 0.28),
        0 5px 0 rgba(0,107,57,0.42);
      cursor: pointer;
      transition: transform 90ms ease, filter 120ms ease, opacity 120ms ease;
    }

    .bingo-letters:active {
      transform: translateY(3px) scale(0.985);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.3),
        0 8px 22px rgba(25, 200, 117, 0.24),
        0 2px 0 rgba(0,107,57,0.42);
    }

    .bingo-letters:disabled {
      cursor: not-allowed;
      opacity: 0.62;
      transform: none;
      filter: grayscale(0.12);
    }

    .bingo-letters span {
      display: grid;
      place-items: center;
      min-height: clamp(28px, 7vw, 44px);
      color: #fff;
      font-family: "Arial Black", "Franklin Gothic Heavy", "Trebuchet MS", sans-serif;
      font-size: clamp(1.5rem, 8vw, 3rem);
      line-height: 0.85;
      font-weight: 1000;
      text-transform: uppercase;
      -webkit-text-stroke: clamp(0.8px, 0.2vw, 1.7px) #05366b;
      text-shadow:
        0 2px 0 #087dff,
        0 5px 0 rgba(255, 210, 61, 0.65),
        0 9px 14px rgba(0,107,57,0.25);
    }

    .bingo-letters span:first-child {
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      font-weight: 1000;
      -webkit-text-stroke: clamp(0.8px, 0.2vw, 1.7px) #05366b;
      text-shadow:
        0 2px 0 #087dff,
        0 5px 0 rgba(255, 210, 61, 0.65),
        0 9px 14px rgba(0,107,57,0.25);
    }

    .bingo-card {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: clamp(5px, 1.5vw, 9px);
      padding: clamp(5px, 1vw, 8px);
      border-radius: 24px;
      background: rgba(255,255,255,0.56);
      border: 1px solid rgba(8,125,255,0.12);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    }

    .cell {
      aspect-ratio: 1;
      min-height: 0;
      border: 2px solid rgba(8,125,255,0.32);
      border-radius: clamp(10px, 2.6vw, 18px);
      padding: 5px;
      display: grid;
      place-items: center;
      text-align: center;
      font-size: clamp(0.74rem, 3.2vw, 1.16rem);
      line-height: 0.92;
      font-weight: 1000;
      color: var(--ink);
      background: linear-gradient(135deg, #fff, rgba(232,242,255,0.96));
      box-shadow: 0 8px 18px rgba(16,11,47,0.08);
      overflow: hidden;
      white-space: nowrap;
      text-overflow: clip;
      word-break: keep-all;
      transition: transform 70ms ease, box-shadow 70ms ease;
    }

    .cell.is-marked {
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #005be8);
      border-color: transparent;
      box-shadow: 0 12px 22px rgba(8,125,255,0.24);
    }

    .cell.mark-error {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      border-color: rgba(255,255,255,0.9);
      box-shadow:
        0 0 0 4px rgba(255,37,65,0.18),
        0 12px 24px rgba(255,37,65,0.28);
      animation: markErrorPulse 560ms ease both;
    }

    .cell.bingo-line {
      position: relative;
      color: #100b2f;
      background:
        radial-gradient(circle at 34% 22%, #fff 0 12%, transparent 13%),
        linear-gradient(135deg, #fff86a, #19c875 52%, #00b8ff);
      border-color: rgba(255, 255, 255, 0.88);
      box-shadow:
        0 0 0 4px rgba(255, 210, 61, 0.7),
        0 0 24px rgba(25, 200, 117, 0.78),
        0 18px 32px rgba(8, 125, 255, 0.28);
      animation: bingoCellPop 900ms cubic-bezier(0.18, 1.2, 0.28, 1) both, bingoGlow 1100ms ease-in-out infinite alternate;
      z-index: 2;
    }

    .cell.bingo-line::after {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: inherit;
      background:
        radial-gradient(circle at 20% 18%, rgba(255,255,255,0.95) 0 5%, transparent 6%),
        radial-gradient(circle at 82% 28%, rgba(255,255,255,0.9) 0 4%, transparent 5%),
        radial-gradient(circle at 64% 82%, rgba(255,255,255,0.85) 0 4%, transparent 5%);
      pointer-events: none;
      animation: bingoSparkle 950ms ease-in-out infinite alternate;
    }

    .cell.free {
      color: #fff;
      background: linear-gradient(135deg, var(--orange), #ff4b18);
    }

    .cell.shuffle-cell {
      color: var(--ink);
      background:
        radial-gradient(circle at 28% 18%, rgba(255,255,255,0.96), transparent 24%),
        linear-gradient(135deg, #ffffff 0%, #e6f3ff 42%, #fff3cf 100%);
      border-color: rgba(8,125,255,0.52);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,0.92),
        0 0 0 3px rgba(8,125,255,0.12),
        0 12px 22px rgba(8,125,255,0.18);
      animation: shuffleNudge 1300ms ease-in-out infinite;
    }

    .footer {
      display: grid;
      gap: 7px;
    }

    .message {
      min-height: 38px;
      padding: 8px 11px;
      border-radius: 18px;
      font-weight: 900;
      text-align: center;
      color: var(--muted);
      background: rgba(255,255,255,0.82);
      border: 1px solid rgba(255,255,255,0.78);
    }

    .message.good {
      color: #006b39;
      background: rgba(25,200,117,0.16);
    }

    .message.bad {
      color: #a8001a;
      background: rgba(255,37,65,0.14);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: clamp(14px, 4vw, 22px);
      z-index: 20;
      max-width: min(88vw, 360px);
      padding: 11px 15px;
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 18px 42px rgba(16,11,47,0.22);
      font-weight: 1000;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transform: translate(-50%, 12px) scale(0.96);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .toast.is-visible {
      opacity: 1;
      transform: translate(-50%, 0) scale(1);
    }

    @keyframes pulse {
      from { transform: scale(1); }
      to { transform: scale(1.035); }
    }

    @keyframes bingoCellPop {
      0% { transform: scale(0.88) rotate(-3deg); }
      55% { transform: scale(1.12) rotate(2deg); }
      100% { transform: scale(1.04) rotate(0deg); }
    }

    @keyframes bingoGlow {
      from { filter: saturate(1.1) brightness(1); }
      to { filter: saturate(1.35) brightness(1.12); }
    }

    @keyframes bingoSparkle {
      from { opacity: 0.45; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1.04); }
    }

    @keyframes markErrorPulse {
      0% { transform: scale(1); }
      35% { transform: scale(1.06); }
      100% { transform: scale(1); }
    }

    @keyframes shuffleNudge {
      0%, 100% { transform: translateY(0) rotate(0deg) scale(1); }
      35% { transform: translateY(-3px) rotate(-1.5deg) scale(1.03); }
      70% { transform: translateY(1px) rotate(1deg) scale(1.01); }
    }

    @media (max-width: 420px) {
      .screen { padding: 8px; }
      .card { padding: 12px; border-radius: 24px; }
      .game { gap: 6px; padding-top: 0; }
      .hud { padding: 7px 8px; }
      .board-wrap { padding: 7px; gap: 4px; }
      .bingo-letters { gap: 5px; }
      .bingo-card { gap: 5px; }
      .cell { border-radius: 11px; padding: 4px; }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="card join-card">
      <input id="nameInput" type="hidden" autocomplete="name">
      <button type="button" hidden id="joinBtn">Join</button>
      <div class="message" id="joinMessage">Scan the Friendzy QR to join.</div>
    </section>

    <section class="game">
      <div class="hud">
        <div class="called" id="calledLabel">Waiting</div>
        <div class="message game-info" id="gameMessage">Mark words as they are called.</div>
      </div>
      <button type="button" class="bingo-letters" id="bingoBtn" aria-label="Call Bingo">
        <span>B</span><span>I</span><span>N</span><span>G</span><span>O</span>
      </button>
      <div class="board-wrap">
        <div class="bingo-card" id="cardGrid"></div>
      </div>
    </section>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </main>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code = String(params.get("code") || "").toUpperCase();
    const classroomCode = String(params.get("classroom") || "").toUpperCase();
    const autoName = String(params.get("name") || "").trim();
    const isAuto = params.get("auto") === "1";
    const playerKey = `bingo-player-${code}`;
    const nameKey = `bingo-name-${code}`;
    const nameInput = document.getElementById("nameInput");
    const joinBtn = document.getElementById("joinBtn");
    const joinMessage = document.getElementById("joinMessage");
    const calledLabel = document.getElementById("calledLabel");
    const cardGrid = document.getElementById("cardGrid");
    const bingoBtn = document.getElementById("bingoBtn");
    const gameMessage = document.getElementById("gameMessage");
    const toast = document.getElementById("toast");

    let room = null;
    let player = null;
    let pollTimer = null;
    let toastTimer = null;
    let retryingMarks = false;
    const pendingMarkRetries = new Map();

    nameInput.value = autoName || localStorage.getItem(nameKey) || "";

    async function api(path, payload = null, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: payload ? { "Content-Type": "application/json" } : undefined,
        body: payload ? JSON.stringify(payload) : undefined
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || "Request failed");
      }
      return data;
    }

    function setJoinMessage(text, tone = "") {
      joinMessage.textContent = text;
      joinMessage.className = `message ${tone}`.trim();
    }

    function requireFriendzyJoin() {
      if (isAuto && autoName) return false;
      if (classroomCode) {
        window.location.replace(`./student-hub.html?code=${encodeURIComponent(classroomCode)}`);
        return true;
      }
      setJoinMessage("Scan the Friendzy QR to join this activity.");
      return true;
    }

    function setGameMessage(text, tone = "") {
      gameMessage.textContent = text;
      gameMessage.className = `message game-info ${tone}`.trim();
    }

    function showToast(text) {
      clearTimeout(toastTimer);
      toast.textContent = text;
      toast.classList.add("is-visible");
      toastTimer = setTimeout(() => {
        toast.classList.remove("is-visible");
      }, 1800);
    }

    function isConnectionError(error) {
      if (!navigator.onLine) return true;
      return /failed to fetch|network|load failed|request failed/i.test(String(error?.message || ""));
    }

    function queueMarkRetry(word) {
      const clean = String(word || "").trim().toLowerCase();
      if (!clean) return;
      pendingMarkRetries.set(clean, { word, attempts: 0 });
    }

    async function retryPendingMarks() {
      if (retryingMarks || !player || !pendingMarkRetries.size || room?.status !== "live") return;
      retryingMarks = true;
      let savedAny = false;
      try {
        for (const [key, pending] of Array.from(pendingMarkRetries.entries())) {
          try {
            const data = await api("/api/bingo/mark", { code, playerId: player.id, word: pending.word });
            room = data.room;
            pendingMarkRetries.delete(key);
            savedAny = true;
          } catch (error) {
            pending.attempts += 1;
            pendingMarkRetries.set(key, pending);
            if (!isConnectionError(error) || pending.attempts >= 5) {
              pendingMarkRetries.delete(key);
            }
          }
        }
      } finally {
        retryingMarks = false;
      }
      if (savedAny) {
        render();
      }
    }

    async function join() {
      const name = String(nameInput.value || "").trim();
      if (!code) {
        setJoinMessage("Missing room code.", "bad");
        return;
      }
      if (!name) {
        setJoinMessage("Enter your name first.", "bad");
        return;
      }
      joinBtn.disabled = true;
      try {
        const savedId = Number(localStorage.getItem(playerKey) || 0);
        const data = await api("/api/bingo/join", { code, name, playerId: savedId });
        room = data.room;
        player = data.player;
        localStorage.setItem(playerKey, String(player.id));
        localStorage.setItem(nameKey, player.name);
        document.body.classList.add("is-playing");
        render();
        startPolling();
      } catch (error) {
        setJoinMessage(error.message, "bad");
        joinBtn.disabled = false;
      }
    }

    async function pollRoom() {
      if (!player) return;
      try {
        const data = await api(`/api/bingo/room?code=${encodeURIComponent(code)}&playerId=${encodeURIComponent(player.id)}`, null, "GET");
        room = data.room;
        render();
        retryPendingMarks().catch(() => {});
        if (classroomCode) {
          syncClassroom().catch(() => {});
        }
      } catch (_) {
        setGameMessage("This Bingo room is no longer available.", "bad");
      } finally {
        pollTimer = setTimeout(pollRoom, 900);
      }
    }

    async function syncClassroom() {
      const data = await api(`/api/classroom/room?code=${encodeURIComponent(classroomCode)}`, null, "GET");
      const activeTool = String(data.room?.activeTool || "standby");
      const activeToolCode = String(data.room?.activeToolCode || "");
      if (activeTool !== "bingo" || activeToolCode !== code) {
        window.location.href = `./student-hub.html?code=${encodeURIComponent(classroomCode)}`;
      }
    }

    function startPolling() {
      clearTimeout(pollTimer);
      pollRoom();
    }

    function getClientBingoLine(card, calledWords = []) {
      const cells = card?.cells || [];
      if (cells.length !== 25) return [];
      const called = new Set((calledWords || []).map((word) => String(word || "").trim().toLowerCase()));
      const isValidMark = (index) => {
        const cell = cells[index] || {};
        if (cell.free) return true;
        return !!cell.marked && called.has(String(cell.word || "").trim().toLowerCase());
      };
      for (let row = 0; row < 5; row += 1) {
        const line = [0, 1, 2, 3, 4].map((offset) => row * 5 + offset);
        if (line.every(isValidMark)) return line;
      }
      for (let column = 0; column < 5; column += 1) {
        const line = [0, 1, 2, 3, 4].map((offset) => offset * 5 + column);
        if (line.every(isValidMark)) return line;
      }
      const diagonalA = [0, 6, 12, 18, 24];
      if (diagonalA.every(isValidMark)) return diagonalA;
      const diagonalB = [4, 8, 12, 16, 20];
      if (diagonalB.every(isValidMark)) return diagonalB;
      return [];
    }

    function getCardWordFontSize(word) {
      const length = String(word || "").trim().length;
      if (/^\d{1,2}$/.test(String(word || "").trim())) return "clamp(1.85rem, 11vw, 3.35rem)";
      if (length <= 4) return "clamp(1rem, 4.9vw, 1.55rem)";
      if (length <= 6) return "clamp(0.86rem, 3.9vw, 1.25rem)";
      if (length <= 8) return "clamp(0.72rem, 3.15vw, 1rem)";
      if (length <= 10) return "clamp(0.62rem, 2.55vw, 0.84rem)";
      return "clamp(0.52rem, 2.1vw, 0.7rem)";
    }

    function getBingoNumberDisplay(word) {
      const ones = {
        one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9,
        ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15,
        sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19
      };
      const tens = { twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70 };
      const clean = String(word || "").trim().toLowerCase().replace(/-/g, " ").replace(/\s+/g, " ");
      if (ones[clean]) return String(ones[clean]);
      if (tens[clean]) return String(tens[clean]);
      const [ten, one] = clean.split(" ");
      const value = (tens[ten] || 0) + (ones[one] || 0);
      return value >= 1 && value <= 75 ? String(value) : "";
    }

    function getBingoCallText(word) {
      return String(word || "").split(/\s*(?:->|→)\s*/)[0].trim();
    }

    function render() {
      const current = room?.calledWords?.[0] || "";
      calledLabel.textContent = current ? getBingoCallText(current).toUpperCase() : (room?.status === "live" ? "Listen" : "Waiting");
      cardGrid.innerHTML = "";
      const card = room?.card;
      if (!card) {
        setGameMessage("Waiting for the vocabulary card.", "");
        bingoBtn.disabled = true;
        return;
      }
      const isWinner = String(room?.winner?.playerId || "") === String(player?.id || "");
      const isReviewedClaimant = String(room?.pendingClaim?.playerId || "") === String(player?.id || "")
        && !!room?.pendingClaim?.reviewed
        && !!room?.pendingClaim?.isValid;
      const winnerLine = Array.isArray(room?.winner?.line) && room.winner.line.length
        ? room.winner.line
        : Array.isArray(room?.pendingClaim?.line) && room.pendingClaim.line.length
          ? room.pendingClaim.line
          : getClientBingoLine(card, room?.calledWords || []);
      const winningLine = (isWinner || isReviewedClaimant) ? new Set(winnerLine) : new Set();
      const canShuffle = room.status === "setup";
      (card.cells || []).forEach((cell, index) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "cell";
        const displayWord = cell.display || getBingoNumberDisplay(cell.word) || cell.word;
        const cellText = cell.free && canShuffle ? "Shuffle" : displayWord;
        button.textContent = cellText;
        button.style.fontSize = cell.free && canShuffle ? "clamp(0.72rem, 3.2vw, 1rem)" : getCardWordFontSize(cellText);
        if (cell.free) button.classList.add(canShuffle ? "shuffle-cell" : "free");
        if (cell.marked) button.classList.add("is-marked");
        if (winningLine.has(index)) button.classList.add("bingo-line");
        button.disabled = cell.free ? !canShuffle : room.status !== "live";
        button.addEventListener("click", () => {
          if (cell.free && canShuffle) {
            shuffleCard();
            return;
          }
          markWord(cell.word, button);
        });
        cardGrid.appendChild(button);
      });
      if (room.status === "finished" && room.winner) {
        setGameMessage(`${room.winner.name} got Bingo!`, "good");
      } else if (room.status === "checking" && room.pendingClaim) {
        const isClaimant = String(room.pendingClaim.playerId || "") === String(player?.id || "");
        setGameMessage(isClaimant ? "You called Bingo. Wait for verification." : "Somebody called Bingo. Wait for verification.", "");
      } else if (room.status === "live") {
        setGameMessage(current ? "Find it and mark it if you have it." : "Listen, search, and mark your card.", "");
      } else {
        setGameMessage("Check your card. Tap Shuffle if you want a different one before the game starts.", "");
      }
      bingoBtn.disabled = room.status !== "live";
    }

    async function shuffleCard() {
      try {
        const data = await api("/api/bingo/shuffle-card", { code, playerId: player.id });
        room = data.room;
        setGameMessage("New card ready. Shuffle again if you want another one.", "good");
        render();
      } catch (error) {
        setGameMessage(error.message, "bad");
      }
    }

    async function markWord(word, targetButton = null) {
      const clean = String(word || "").trim().toLowerCase();
      const localCell = (room?.card?.cells || []).find((cell) => String(cell.word || "").trim().toLowerCase() === clean);
      if (localCell && !localCell.free && room?.status === "live") {
        localCell.marked = !localCell.marked;
        targetButton?.classList.toggle("is-marked", localCell.marked);
      }
      try {
        const data = await api("/api/bingo/mark", { code, playerId: player.id, word });
        room = data.room;
        render();
      } catch (error) {
        if (localCell && !localCell.free) {
          localCell.marked = !localCell.marked;
          targetButton?.classList.remove("is-marked");
          targetButton?.classList.add("mark-error");
          setTimeout(() => {
            targetButton?.classList.remove("mark-error");
            render();
          }, 620);
        }
        if (isConnectionError(error)) {
          queueMarkRetry(word);
          showToast("Connection issue. Will retry automatically.");
        } else {
          showToast(error.message || "Mark failed.");
        }
      }
    }

    bingoBtn.addEventListener("click", async () => {
      try {
        const data = await api("/api/bingo/claim", { code, playerId: player.id });
        room = data.room;
        setGameMessage("Bingo called. Wait for verification.", "good");
        render();
      } catch (error) {
        setGameMessage(error.message, "bad");
      }
    });

    joinBtn.addEventListener("click", join);
    window.addEventListener("online", () => retryPendingMarks().catch(() => {}));
    nameInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        join();
      }
    });

    if (requireFriendzyJoin()) {
      nameInput.disabled = true;
      joinBtn.disabled = true;
    } else if (isAuto && nameInput.value) {
      join();
    }
  </script>
</body>
</html>
