<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Room</title>
  <style>
    :root {
      --bg: #fff36b;
      --bg-deep: #ff8a00;
      --panel: rgba(255, 255, 255, 0.78);
      --ink: #160f2e;
      --muted: #4a3f7a;
      --accent: #ff4d2d;
      --line: rgba(22, 15, 46, 0.16);
      --radius: 26px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Avenir Next Condensed", "Franklin Gothic Medium", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, rgba(255, 47, 146, 0.36), transparent 18%),
        radial-gradient(circle at 88% 12%, rgba(36, 87, 255, 0.34), transparent 16%),
        radial-gradient(circle at 50% 100%, rgba(0, 208, 132, 0.2), transparent 26%),
        linear-gradient(180deg, #fffcc5 0%, var(--bg) 42%, var(--bg-deep) 100%);
      padding: 10px;
      overflow: hidden;
    }
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 44vw;
      height: 44vw;
      border-radius: 50%;
      filter: blur(26px);
      pointer-events: none;
      opacity: 0.34;
      z-index: 0;
    }
    body::before {
      top: -10vw;
      left: -10vw;
      background: radial-gradient(circle, rgba(255, 47, 146, 0.46) 0%, rgba(255, 47, 146, 0) 70%);
    }
    body::after {
      right: -10vw;
      bottom: -14vw;
      background: radial-gradient(circle, rgba(36, 87, 255, 0.4) 0%, rgba(36, 87, 255, 0) 70%);
    }
    body.flash-good::selection,
    body.flash-bad::selection {
      background: transparent;
    }
    body.flash-good .feedback-flash,
    body.flash-bad .feedback-flash {
      opacity: 1;
    }
    body.flash-good .feedback-flash {
      background: rgba(0, 208, 132, 0.22);
    }
    body.flash-bad .feedback-flash {
      background: rgba(255, 77, 45, 0.24);
    }
    .card {
      width: min(100%, 720px);
      min-height: calc(100dvh - 20px);
      margin: 0 auto;
      position: relative;
      z-index: 1;
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(255, 247, 253, 0.82)),
        var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.66);
      border-radius: var(--radius);
      padding: 16px;
      backdrop-filter: blur(14px);
      display: grid;
      align-content: start;
      gap: 14px;
      box-shadow: 0 28px 70px rgba(67, 28, 145, 0.22);
    }
    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 7vw, 3rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }
    .join-logo {
      display: block;
      width: min(100%, 320px);
      height: auto;
      margin: 0 auto 4px;
      filter: drop-shadow(0 12px 20px rgba(20, 12, 55, 0.18));
    }
    section {
      display: grid;
      gap: 14px;
    }
    p { margin: 0; color: var(--muted); }
    input, button {
      width: 100%;
      border-radius: 18px;
      font: inherit;
      padding: 14px 16px;
      border: 0;
    }
    input {
      background: rgba(255,255,255,0.94);
      color: #20153d;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.84);
    }
    button {
      background: linear-gradient(180deg, #4f46ff, #2412b8);
      color: white;
      font-weight: 800;
      box-shadow: 0 10px 18px rgba(31, 26, 23, 0.12);
      transition: transform 120ms ease, box-shadow 120ms ease, filter 120ms ease;
      cursor: pointer;
    }
    button:hover,
    button:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 16px 24px rgba(31, 26, 23, 0.18);
      filter: brightness(1.04);
    }
    button:active {
      transform: translateY(1px) scale(0.98);
      box-shadow: 0 8px 14px rgba(31, 26, 23, 0.14);
    }
    .join-stack,
    #waitingView,
    .play-stack {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 244, 255, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 24px;
      padding: 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.72);
    }
    .play-info {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      gap: 10px;
      align-items: stretch;
    }
    .letters {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 10px;
      margin: 0;
      perspective: 1200px;
    }
    .letter {
      min-height: clamp(88px, 15dvh, 136px);
      border-radius: 28px;
      border: 1px solid rgba(56, 31, 18, 0.12);
      background: linear-gradient(145deg, rgba(255, 255, 255, 1), rgba(242, 247, 255, 1));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 18px 30px rgba(31, 26, 23, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      position: relative;
      overflow: hidden;
      transform: rotate(var(--tilt, 0deg));
    }
    .letter::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(130deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 36%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
      pointer-events: none;
    }
    .letter::after {
      content: "";
      position: absolute;
      inset: 10px;
      border-radius: 20px;
      border: 1px dashed rgba(52, 31, 20, 0.08);
      pointer-events: none;
    }
    .letter[data-color="0"] { color: #ff3b30; }
    .letter[data-color="1"] { color: #5b2be0; }
    .letter[data-color="2"] { color: #10bf67; }
    .letter[data-color="3"] { color: #f3c645; }
    .letter[data-color="4"] { color: #ba60dc; }
    .letter-score {
      position: absolute;
      top: 9px;
      right: 9px;
      min-width: 22px;
      padding: 3px 5px 2px;
      border-radius: 999px;
      background: rgba(22, 15, 46, 0.08);
      border: 1px solid rgba(22, 15, 46, 0.08);
      color: rgba(22, 15, 46, 0.76);
      font-size: 0.62rem;
      line-height: 1;
      text-align: center;
      font-weight: 900;
      z-index: 1;
    }
    .letter-glyph {
      position: relative;
      z-index: 1;
      font-size: clamp(2.4rem, 8vw, 4.2rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 0.9;
    }
    .play-stack {
      display: grid;
      gap: 14px;
    }
    .submit-row {
      display: grid;
      grid-template-columns: minmax(0, 4fr) minmax(88px, 1fr);
      gap: 10px;
      align-items: stretch;
    }
    .submit-row input,
    .submit-row button {
      height: 100%;
    }
    .submit-row button {
      position: relative;
      overflow: hidden;
    }
    .submit-row button::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.22), rgba(255,255,255,0));
      pointer-events: none;
    }
    .join-stack {
      display: grid;
      gap: 14px;
    }
    .score-toast {
      width: 100%;
      min-height: 100%;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(20, 11, 47, 0.88);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 18px 34px rgba(0,0,0,0.24);
      backdrop-filter: blur(14px);
      display: grid;
      gap: 6px;
      align-content: start;
    }
    .score-toast-label {
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffd96c;
      font-weight: 800;
    }
    .score-toast.good .score-toast-label {
      color: #8ff7c8;
    }
    .score-toast.bad .score-toast-label {
      color: #ffb39f;
    }
    .score-toast-main {
      font-size: 0.94rem;
      line-height: 1.22;
      color: #fff;
      font-weight: 800;
    }
    .score-breakdown {
      font-size: 0.76rem;
      line-height: 1.2;
      color: rgba(255, 255, 255, 0.84);
      font-weight: 700;
    }
    .score-toast-word {
      color: #ffd96c;
      margin-left: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .score-toast-word .used-letter {
      color: #42f5a1;
      text-shadow: 0 0 14px rgba(66, 245, 161, 0.34);
    }
    .rank-badge {
      min-height: 100%;
      width: max-content;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(20, 11, 47, 0.72);
      border: 1px solid rgba(255,255,255,0.16);
      color: #fff;
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 26px rgba(0,0,0,0.22);
      display: grid;
      align-content: center;
      gap: 3px;
    }
    .rank-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #d6d4f3;
      font-weight: 800;
    }
    .rank-value {
      font-size: 1rem;
      font-weight: 900;
      color: #ffd96c;
      line-height: 1;
    }
    .rank-score {
      font-size: 0.82rem;
      font-weight: 800;
      color: #fff;
      line-height: 1;
      opacity: 0.88;
    }
    .feedback-flash {
      position: fixed;
      inset: 0;
      z-index: 16;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
    }
    .mobile-podium {
      position: fixed;
      inset: 0;
      z-index: 24;
      display: grid;
      place-items: center;
      padding: 16px;
      background:
        radial-gradient(circle at top center, rgba(255, 233, 91, 0.22), transparent 26%),
        linear-gradient(180deg, rgba(12, 8, 34, 0.52), rgba(12, 8, 34, 0.78));
    }
    .mobile-podium-card {
      width: min(100%, 520px);
      border-radius: 28px;
      padding: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(248,245,255,0.98));
      box-shadow: 0 36px 80px rgba(24, 11, 58, 0.3);
      display: grid;
      gap: 12px;
      text-align: center;
    }
    .mobile-podium-kicker {
      margin: 0;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      font-weight: 800;
      color: #ff2f92;
    }
    .mobile-podium-title {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.3rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      color: #160f2e;
    }
    .mobile-podium-stage {
      display: grid;
      gap: 10px;
    }
    .mobile-podium-place {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(20, 11, 47, 0.08);
      border: 1px solid rgba(22, 15, 46, 0.08);
    }
    .mobile-podium-rank {
      min-width: 42px;
      padding: 6px 0;
      border-radius: 999px;
      color: white;
      font-weight: 900;
      font-size: 0.84rem;
    }
    .mobile-podium-place[data-rank="1"] .mobile-podium-rank {
      background: linear-gradient(180deg, #ff7f52, #ff4d2d);
    }
    .mobile-podium-place[data-rank="2"] .mobile-podium-rank {
      background: linear-gradient(180deg, #5c77ff, #2457ff);
    }
    .mobile-podium-place[data-rank="3"] .mobile-podium-rank {
      background: linear-gradient(180deg, #12c977, #00a868);
    }
    .mobile-podium-name {
      text-align: left;
      font-size: 1rem;
      font-weight: 900;
      color: #160f2e;
      line-height: 1;
      text-transform: uppercase;
    }
    .mobile-podium-score {
      font-size: 0.88rem;
      font-weight: 800;
      color: #4a3f7a;
      white-space: nowrap;
    }
    @media (max-height: 760px) {
      .card {
        padding: 12px;
      }
      .join-stack,
      #waitingView,
      .play-stack {
        padding: 14px;
      }
      .letters {
        gap: 8px;
      }
      .play-info {
        gap: 8px;
      }
      .letter {
        min-height: clamp(78px, 13dvh, 110px);
      }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="feedback-flash" id="feedbackFlash"></div>
  <div class="mobile-podium hidden" id="mobilePodium">
    <div class="mobile-podium-card">
      <p class="mobile-podium-kicker">Game Over</p>
      <h2 class="mobile-podium-title">Top 3</h2>
      <div class="mobile-podium-stage" id="mobilePodiumStage"></div>
    </div>
  </div>
  <main class="card">
    <section id="joinView" class="join-stack">
      <img class="join-logo" src="./student-letter-clash-logo.png" alt="Letter Clash">
      <p>Enter your name or team name.</p>
      <input id="teamName" placeholder="Team name">
      <button id="joinBtn">Join Room</button>
    </section>

    <section id="waitingView" class="hidden">
      <h1>Waiting</h1>
      <p>Stay ready. The teacher will start the game.</p>
    </section>

    <section id="playView" class="hidden play-stack">
      <div class="play-info">
        <div class="rank-badge hidden" id="rankBadge">
          <div class="rank-label">Position</div>
          <div class="rank-value" id="rankValue">1st</div>
          <div class="rank-score" id="rankScore">0 pts</div>
        </div>
        <div class="score-toast hidden" id="scoreToast">
          <div class="score-toast-label" id="scoreToastLabel">Point scored</div>
          <div class="score-toast-main" id="scoreToastText"></div>
        </div>
      </div>
      <div class="letters" id="letters"></div>
      <div class="submit-row">
        <input id="wordInput" placeholder="Type your word">
        <button id="submitBtn">Send</button>
      </div>
    </section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const code = (params.get("code") || "").toUpperCase();
    const colors = [0, 1, 2, 3, 4];
    const joinView = document.getElementById("joinView");
    const waitingView = document.getElementById("waitingView");
    const playView = document.getElementById("playView");
    const teamName = document.getElementById("teamName");
    const joinBtn = document.getElementById("joinBtn");
    const letters = document.getElementById("letters");
    const wordInput = document.getElementById("wordInput");
    const submitBtn = document.getElementById("submitBtn");
    const scoreToast = document.getElementById("scoreToast");
    const scoreToastLabel = document.getElementById("scoreToastLabel");
    const scoreToastText = document.getElementById("scoreToastText");
    const rankBadge = document.getElementById("rankBadge");
    const rankValue = document.getElementById("rankValue");
    const rankScore = document.getElementById("rankScore");
    const feedbackFlash = document.getElementById("feedbackFlash");
    const mobilePodium = document.getElementById("mobilePodium");
    const mobilePodiumStage = document.getElementById("mobilePodiumStage");

    let player = null;
    let room = null;
    let timer = null;
    let roomSocket = null;
    let roomSocketActive = false;
    let lastSeenSuccessId = "";
    let lastSeenFeedbackId = "";
    let flashTimer = null;
    let quickPollUntil = 0;
    let audioCtx = null;
    let podiumSoundPlayed = false;
    let lastMobilePodiumKey = "";
    const letterPoints = {
      A: 1, E: 1, I: 1, O: 1, N: 1, R: 1, T: 1, L: 1, S: 1, U: 1,
      D: 2, G: 2,
      B: 3, C: 3, M: 3, P: 3,
      F: 4, H: 4, V: 4, W: 4, Y: 4,
      K: 5,
      J: 8, X: 8,
      Q: 10, Z: 10
    };

    async function api(path, body, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: method === "POST" ? { "Content-Type": "application/json" } : undefined,
        body: method === "POST" ? JSON.stringify(body || {}) : undefined
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        const error = new Error(data.error || "Request failed");
        error.data = data;
        throw error;
      }
      return data;
    }

    function getRoomSocketUrl() {
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      return `${protocol}//${window.location.host}/ws/live?code=${encodeURIComponent(code)}`;
    }

    function closeRoomSocket() {
      if (!roomSocket) {
        return;
      }
      try {
        roomSocket.close();
      } catch (_) {
      }
      roomSocket = null;
      roomSocketActive = false;
    }

    function keepInputReady() {
      if (!wordInput || !playView || playView.classList.contains("hidden")) {
        return;
      }
      if (document.activeElement === wordInput) {
        return;
      }
      requestAnimationFrame(() => {
        wordInput.focus({ preventScroll: true });
        const end = wordInput.value.length;
        wordInput.setSelectionRange(end, end);
      });
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function tone({ frequency, start, duration, type = "sine", gain = 0.08 }) {
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, start);
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.linearRampToValueAtTime(gain, start + 0.02);
      amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(amp);
      amp.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.03);
    }

    function playFeedbackSound(toneName) {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      if (toneName === "bad") {
        tone({ frequency: 280, start: now, duration: 0.1, type: "square", gain: 0.085 });
        tone({ frequency: 220, start: now + 0.08, duration: 0.16, type: "square", gain: 0.075 });
        return;
      }
      tone({ frequency: 523.25, start: now, duration: 0.11, type: "triangle", gain: 0.05 });
      tone({ frequency: 659.25, start: now + 0.06, duration: 0.12, type: "triangle", gain: 0.07 });
      tone({ frequency: 1046.5, start: now + 0.13, duration: 0.18, type: "sine", gain: 0.09 });
    }

    function playPodiumSound() {
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      tone({ frequency: 523.25, start: now, duration: 0.16, type: "triangle", gain: 0.08 });
      tone({ frequency: 659.25, start: now + 0.09, duration: 0.18, type: "triangle", gain: 0.095 });
      tone({ frequency: 783.99, start: now + 0.18, duration: 0.2, type: "triangle", gain: 0.1 });
      tone({ frequency: 1046.5, start: now + 0.28, duration: 0.34, type: "sine", gain: 0.13 });
    }

    function flashScreen(tone) {
      document.body.classList.remove("flash-good", "flash-bad");
      void document.body.offsetWidth;
      document.body.classList.add(tone === "bad" ? "flash-bad" : "flash-good");
      if (flashTimer) {
        clearTimeout(flashTimer);
      }
      flashTimer = setTimeout(() => {
        document.body.classList.remove("flash-good", "flash-bad");
      }, 320);
    }

    function showToast({ label, html, tone = "good" }) {
      scoreToast.classList.remove("hidden", "good", "bad");
      scoreToast.classList.add(tone);
      scoreToastLabel.textContent = label;
      scoreToastText.innerHTML = html;
    }

    function showScoreToast(entry) {
      if (!entry?.id || !entry.teamName || !entry.word) return;
      if (entry.id === lastSeenSuccessId) return;
      lastSeenSuccessId = entry.id;
      showToast({
        label: "Point scored",
        tone: "good",
        html: `<strong>${entry.teamName}</strong><span class="score-toast-word">${highlightUsedLetters(entry.word, entry.consumedLetters || [])}</span><div>+${Number(entry.points) || 0} pts</div>`
      });
    }

    function showFeedbackToast(entry) {
      if (!entry?.id || entry.id === lastSeenFeedbackId) return;
      lastSeenFeedbackId = entry.id;
      quickPollUntil = 0;
      const tone = entry.tone === "bad" ? "bad" : "good";
      const wordHtml = entry.word
        ? `<span class="score-toast-word">${highlightUsedLetters(entry.word, entry.consumedLetters || [])}</span>`
        : "";
      const detail = entry.message ? `<div>${escapeHtml(entry.message)}</div>` : "";
      const breakdown = tone === "good"
        ? `<div class="score-breakdown">${Number(entry.lettersScore) || 0} letters + ${Number(entry.lengthBonus) || 0} length + ${Number(entry.stealBonus) || 0} steal</div>`
        : "";
      playFeedbackSound(tone);
      flashScreen(tone);
      showToast({
        label: tone === "bad" ? "Not valid" : "Correct",
        tone,
        html: `<strong>${entry.teamName || "You"}</strong>${wordHtml}${detail}${breakdown}`
      });
    }

    function formatOrdinal(value) {
      const num = Number(value) || 0;
      const mod100 = num % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${num}th`;
      const mod10 = num % 10;
      if (mod10 === 1) return `${num}st`;
      if (mod10 === 2) return `${num}nd`;
      if (mod10 === 3) return `${num}rd`;
      return `${num}th`;
    }

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll("\"", "&quot;")
        .replaceAll("'", "&#39;");
    }

    function highlightUsedLetters(word, consumedLetters) {
      const counts = {};
      consumedLetters.forEach((letter) => {
        const key = String(letter || "").toUpperCase();
        counts[key] = (counts[key] || 0) + 1;
      });
      return String(word || "").toUpperCase().split("").map((letter) => {
        if (counts[letter] > 0) {
          counts[letter] -= 1;
          return `<span class="used-letter">${escapeHtml(letter)}</span>`;
        }
        return escapeHtml(letter);
      }).join("");
    }

    function renderRank() {
      const rankedTeams = Array.isArray(room?.teams)
        ? room.teams
          .slice()
          .sort((a, b) => (Number(b.score) - Number(a.score)) || String(a.name || "").localeCompare(String(b.name || "")))
        : [];
      const teamIndex = rankedTeams.findIndex((team) => team.id === player?.teamId);
      const ownTeam = teamIndex === -1 ? null : rankedTeams[teamIndex];
      if (teamIndex === -1 || room?.status !== "live" || !Array.isArray(room?.letters) || room.letters.length === 0) {
        rankBadge.classList.add("hidden");
        return;
      }
      rankValue.textContent = formatOrdinal(teamIndex + 1);
      rankScore.textContent = `${Number(ownTeam?.score) || 0} pts`;
      rankBadge.classList.remove("hidden");
    }

    function renderMobilePodium() {
      const ranked = Array.isArray(room?.podium) && room.podium.length
        ? room.podium.slice(0, 3)
        : (room?.teams || [])
          .slice()
          .sort((a, b) => (Number(b.score) - Number(a.score)) || String(a.name || "").localeCompare(String(b.name || "")))
          .slice(0, 3);
      const podiumKey = ranked.map((team) => `${team.id}:${team.score}`).join("|");
      if (podiumKey && podiumKey === lastMobilePodiumKey) {
        return;
      }
      lastMobilePodiumKey = podiumKey;
      mobilePodiumStage.innerHTML = ranked.map((team, index) => `
        <div class="mobile-podium-place" data-rank="${index + 1}">
          <div class="mobile-podium-rank">#${index + 1}</div>
          <div class="mobile-podium-name">${escapeHtml(team.name)}</div>
          <div class="mobile-podium-score">${Number(team.score) || 0} pts</div>
        </div>
      `).join("");
    }

    function render() {
      if (!room || !player) return;
      const live = room.status === "live";
      const finished = room.status === "finished";
      waitingView.classList.toggle("hidden", live);
      playView.classList.toggle("hidden", !live);
      if (finished) {
        mobilePodium.classList.remove("hidden");
        renderMobilePodium();
        if (!podiumSoundPlayed) {
          playPodiumSound();
          podiumSoundPlayed = true;
        }
        waitingView.classList.add("hidden");
        playView.classList.add("hidden");
      } else {
        mobilePodium.classList.add("hidden");
        lastMobilePodiumKey = "";
        podiumSoundPlayed = false;
        waitingView.querySelector("h1").textContent = "Waiting";
        waitingView.querySelector("p").textContent = "Stay ready. The teacher will start the game.";
      }
      letters.innerHTML = "";
      room.letters.forEach((item) => {
        const el = document.createElement("div");
        el.className = "letter";
        el.dataset.color = String(colors[letters.children.length % colors.length]);
        el.style.setProperty("--tilt", `${letters.children.length % 2 === 0 ? -2 : 2}deg`);
        el.innerHTML = `
          <div class="letter-score">${letterPoints[item] || 0}</div>
          <div class="letter-glyph">${item}</div>
        `;
        letters.appendChild(el);
      });
      if (live && room.lastFeedback && room.lastFeedback.teamId === player?.teamId) {
        showFeedbackToast(room.lastFeedback);
      }
      if (live && room.lastSuccess && room.lastSuccess.teamId !== player?.teamId) {
        showScoreToast(room.lastSuccess);
      }
      renderRank();
      keepInputReady();
    }

    async function poll() {
      if (!room || roomSocketActive) return;
      try {
        const data = await api(`/api/live/room?code=${encodeURIComponent(code)}`, null, "GET");
        room = data.room;
        render();
      } finally {
        const interval = Date.now() < quickPollUntil ? 220 : 850;
        timer = setTimeout(poll, interval);
      }
    }

    function connectRoomSocket() {
      closeRoomSocket();
      try {
        roomSocket = new WebSocket(getRoomSocketUrl());
      } catch (_) {
        roomSocket = null;
        roomSocketActive = false;
        return;
      }
      roomSocket.addEventListener("open", () => {
        roomSocketActive = true;
        if (timer) {
          clearTimeout(timer);
          timer = null;
        }
      });
      roomSocket.addEventListener("message", (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload?.type !== "room" || !payload.room) {
            return;
          }
          room = payload.room;
          render();
        } catch (_) {
        }
      });
      roomSocket.addEventListener("close", () => {
        roomSocketActive = false;
        roomSocket = null;
        if (room && !timer) {
          poll();
        }
      });
      roomSocket.addEventListener("error", () => {
        roomSocketActive = false;
      });
    }

    async function joinRoom(reconnect = false) {
      const data = await api("/api/live/join", { code, teamName: teamName.value, reconnect });
      player = data.player;
      room = data.room;
      joinView.classList.add("hidden");
      waitingView.classList.remove("hidden");
      connectRoomSocket();
      if (!roomSocketActive) {
        poll();
      }
    }

    joinBtn.addEventListener("click", async () => {
      try {
        await joinRoom(false);
      } catch (error) {
        if (error?.data?.reconnectable) {
          const existingName = error.data.teamName || teamName.value.trim();
          const shouldReconnect = window.confirm(`A participant named "${existingName}" is already connected. Do you want to reconnect to that session?`);
          if (shouldReconnect) {
            await joinRoom(true);
          }
          return;
        }
        throw error;
      }
    });

    async function submitWord() {
      if (!player || !room) return;
      const nextWord = wordInput.value.trim();
      if (!nextWord) {
        keepInputReady();
        return;
      }
      try {
        getAudioContext();
        quickPollUntil = Date.now() + 2500;
        await api("/api/live/submit", {
          code,
          playerId: player.id,
          teamId: player.teamId,
          teamName: player.teamName,
          word: nextWord,
          roundId: room.roundId
        });
        wordInput.value = "";
        if (timer) {
          clearTimeout(timer);
        }
        if (!roomSocketActive) {
          poll();
        }
        keepInputReady();
      } catch (error) {
        showFeedbackToast({
          id: `${Date.now()}-submit-error`,
          teamId: player.teamId,
          teamName: player.teamName,
          word: nextWord,
          tone: "bad",
          message: error.message || "Request failed"
        });
        keepInputReady();
      }
    }

    submitBtn.addEventListener("click", async () => {
      submitWord();
    });

    wordInput.addEventListener("keydown", (event) => {
      if (event.key !== "Enter") {
        return;
      }
      event.preventDefault();
      submitWord();
    });

    wordInput.addEventListener("blur", () => {
      setTimeout(() => keepInputReady(), 0);
    });

    document.addEventListener("visibilitychange", () => {
      if (!document.hidden) {
        keepInputReady();
      }
    });
  </script>
</body>
</html>
