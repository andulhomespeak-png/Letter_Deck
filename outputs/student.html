<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join Room</title>
  <style>
    :root {
      --bg: #160f2e;
      --panel: rgba(255,255,255,0.12);
      --ink: #fff;
      --muted: #d6d4f3;
      --accent: #ff4d2d;
      --line: rgba(255,255,255,0.14);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Avenir Next Condensed", "Franklin Gothic Medium", sans-serif;
      color: var(--ink);
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at top left, rgba(255,47,146,0.28), transparent 24%),
        radial-gradient(circle at bottom right, rgba(36,87,255,0.28), transparent 20%),
        linear-gradient(180deg, #24105f 0%, var(--bg) 100%);
      padding: 18px;
    }
    .card {
      width: min(100%, 520px);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 22px;
      backdrop-filter: blur(14px);
      display: grid;
      gap: 14px;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 8vw, 3.4rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }
    section {
      display: grid;
      gap: 14px;
    }
    p { margin: 0; color: var(--muted); }
    input, button {
      width: 100%;
      border-radius: 18px;
      font: inherit;
      padding: 14px 16px;
      border: 0;
    }
    input { background: rgba(255,255,255,0.94); color: #20153d; }
    button { background: linear-gradient(180deg, #ff7a45, var(--accent)); color: white; font-weight: 800; }
    .letters {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin: 6px 0 2px;
    }
    .letter {
      min-height: 104px;
      border-radius: 22px;
      background: rgba(255,255,255,0.94);
      color: #20153d;
      display: grid;
      place-items: center;
      font-size: 3rem;
      font-weight: 900;
      position: relative;
      box-shadow: 0 14px 28px rgba(0,0,0,0.16);
    }
    .letter-score {
      position: absolute;
      top: 10px;
      right: 10px;
      min-width: 28px;
      padding: 4px 7px 3px;
      border-radius: 999px;
      background: rgba(32, 21, 61, 0.08);
      color: rgba(32, 21, 61, 0.78);
      font-size: 0.82rem;
      line-height: 1;
      text-align: center;
      font-weight: 900;
    }
    .letter-glyph {
      line-height: 0.9;
    }
    .play-stack {
      display: grid;
      gap: 14px;
    }
    .join-stack {
      display: grid;
      gap: 14px;
    }
    .score-toast {
      position: fixed;
      right: 14px;
      bottom: 14px;
      max-width: min(78vw, 320px);
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(20, 11, 47, 0.82);
      border: 1px solid rgba(255,255,255,0.16);
      box-shadow: 0 18px 34px rgba(0,0,0,0.24);
      backdrop-filter: blur(14px);
      display: grid;
      gap: 4px;
      z-index: 20;
      opacity: 0;
      transform: translateY(14px);
      pointer-events: none;
      transition: opacity 180ms ease, transform 180ms ease;
    }
    .score-toast.is-visible {
      opacity: 1;
      transform: translateY(0);
    }
    .score-toast-label {
      font-size: 0.74rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #ffd96c;
      font-weight: 800;
    }
    .score-toast-main {
      font-size: 1rem;
      line-height: 1.25;
      color: #fff;
      font-weight: 800;
    }
    .score-toast-word {
      color: #ffd96c;
      margin-left: 8px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .rank-badge {
      position: fixed;
      top: 14px;
      right: 14px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(20, 11, 47, 0.72);
      border: 1px solid rgba(255,255,255,0.16);
      color: #fff;
      backdrop-filter: blur(14px);
      box-shadow: 0 14px 26px rgba(0,0,0,0.22);
      display: grid;
      gap: 2px;
      z-index: 18;
    }
    .rank-label {
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: #d6d4f3;
      font-weight: 800;
    }
    .rank-value {
      font-size: 1rem;
      font-weight: 900;
      color: #ffd96c;
      line-height: 1;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="rank-badge hidden" id="rankBadge">
    <div class="rank-label">Position</div>
    <div class="rank-value" id="rankValue">1st</div>
  </div>

  <main class="card">
    <section id="joinView" class="join-stack">
      <h1>Join</h1>
      <p>Enter your team name in English.</p>
      <input id="teamName" placeholder="Team name">
      <button id="joinBtn">Join Room</button>
    </section>

    <section id="waitingView" class="hidden">
      <h1>Waiting</h1>
      <p>Stay ready. The teacher will start the game.</p>
    </section>

    <section id="playView" class="hidden play-stack">
      <div class="letters" id="letters"></div>
      <input id="wordInput" placeholder="Type your word">
      <button id="submitBtn">Send Word</button>
    </section>
  </main>

  <div class="score-toast hidden" id="scoreToast">
    <div class="score-toast-label">Point scored</div>
    <div class="score-toast-main" id="scoreToastText"></div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const code = (params.get("code") || "").toUpperCase();
    const joinView = document.getElementById("joinView");
    const waitingView = document.getElementById("waitingView");
    const playView = document.getElementById("playView");
    const teamName = document.getElementById("teamName");
    const joinBtn = document.getElementById("joinBtn");
    const letters = document.getElementById("letters");
    const wordInput = document.getElementById("wordInput");
    const submitBtn = document.getElementById("submitBtn");
    const scoreToast = document.getElementById("scoreToast");
    const scoreToastText = document.getElementById("scoreToastText");
    const rankBadge = document.getElementById("rankBadge");
    const rankValue = document.getElementById("rankValue");

    let player = null;
    let room = null;
    let timer = null;
    let lastSeenSuccessId = "";
    let toastTimer = null;
    const letterPoints = {
      A: 1, E: 1, I: 1, O: 1, N: 1, R: 1, T: 1, L: 1, S: 1, U: 1,
      D: 2, G: 2,
      B: 3, C: 3, M: 3, P: 3,
      F: 4, H: 4, V: 4, W: 4, Y: 4,
      K: 5,
      J: 8, X: 8,
      Q: 10, Z: 10
    };

    async function api(path, body, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: method === "POST" ? { "Content-Type": "application/json" } : undefined,
        body: method === "POST" ? JSON.stringify(body || {}) : undefined
      });
      const data = await response.json();
      if (!response.ok || data.error) throw new Error(data.error || "Request failed");
      return data;
    }

    function showScoreToast(entry) {
      if (!entry?.id || !entry.teamName || !entry.word) return;
      if (entry.id === lastSeenSuccessId) return;
      lastSeenSuccessId = entry.id;
      scoreToastText.innerHTML = `<strong>${entry.teamName}</strong><span class="score-toast-word">${entry.word}</span>`;
      scoreToast.classList.remove("hidden");
      requestAnimationFrame(() => scoreToast.classList.add("is-visible"));
      if (toastTimer) {
        clearTimeout(toastTimer);
      }
      toastTimer = setTimeout(() => {
        scoreToast.classList.remove("is-visible");
        setTimeout(() => scoreToast.classList.add("hidden"), 180);
      }, 2600);
    }

    function formatOrdinal(value) {
      const num = Number(value) || 0;
      const mod100 = num % 100;
      if (mod100 >= 11 && mod100 <= 13) return `${num}th`;
      const mod10 = num % 10;
      if (mod10 === 1) return `${num}st`;
      if (mod10 === 2) return `${num}nd`;
      if (mod10 === 3) return `${num}rd`;
      return `${num}th`;
    }

    function renderRank() {
      const rankedTeams = Array.isArray(room?.teams)
        ? room.teams
          .slice()
          .sort((a, b) => (Number(b.score) - Number(a.score)) || String(a.name || "").localeCompare(String(b.name || "")))
        : [];
      const teamIndex = rankedTeams.findIndex((team) => team.id === player?.teamId);
      if (teamIndex === -1) {
        rankBadge.classList.add("hidden");
        return;
      }
      rankValue.textContent = formatOrdinal(teamIndex + 1);
      rankBadge.classList.remove("hidden");
    }

    function render() {
      if (!room || !player) return;
      const live = room.status === "live";
      waitingView.classList.toggle("hidden", live);
      playView.classList.toggle("hidden", !live);
      letters.innerHTML = "";
      room.letters.forEach((item) => {
        const el = document.createElement("div");
        el.className = "letter";
        el.innerHTML = `
          <div class="letter-score">${letterPoints[item] || 0}</div>
          <div class="letter-glyph">${item}</div>
        `;
        letters.appendChild(el);
      });
      if (live && room.lastSuccess) {
        showScoreToast(room.lastSuccess);
      }
      renderRank();
    }

    async function poll() {
      if (!room) return;
      try {
        const data = await api(`/api/live/room?code=${encodeURIComponent(code)}`, null, "GET");
        room = data.room;
        render();
      } finally {
        timer = setTimeout(poll, 1000);
      }
    }

    joinBtn.addEventListener("click", async () => {
      const data = await api("/api/live/join", { code, teamName: teamName.value });
      player = data.player;
      room = data.room;
      joinView.classList.add("hidden");
      waitingView.classList.remove("hidden");
      poll();
    });

    submitBtn.addEventListener("click", async () => {
      if (!player || !room) return;
      await api("/api/live/submit", {
        code,
        playerId: player.id,
        teamId: player.teamId,
        teamName: player.teamName,
        word: wordInput.value
      });
      wordInput.value = "";
    });
  </script>
</body>
</html>
