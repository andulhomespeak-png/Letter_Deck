<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fast Buzzer</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --ink: #100b2f;
      --muted: rgba(16, 11, 47, 0.62);
      --line: rgba(16, 11, 47, 0.12);
      --blue: #087dff;
      --red: #ff2541;
      --green: #19c875;
      --orange: #ff8a00;
      --panel: rgba(255, 255, 255, 0.88);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 18%, rgba(8, 125, 255, 0.34), transparent 28%),
        radial-gradient(circle at 82% 18%, rgba(255, 37, 65, 0.32), transparent 30%),
        radial-gradient(circle at 50% 92%, rgba(255, 138, 0, 0.28), transparent 34%),
        linear-gradient(135deg, #fff4cf 0%, #eef8ff 46%, #ffe2e8 100%);
    }

    .app {
      height: 100vh;
      height: 100dvh;
      padding: clamp(8px, 1.3vw, 16px);
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 380px);
      gap: clamp(8px, 1.3vw, 16px);
    }

    .main,
    .scoreboard {
      min-height: 0;
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: clamp(24px, 3vw, 34px);
      background: var(--panel);
      box-shadow: 0 26px 78px rgba(16, 11, 47, 0.16);
      backdrop-filter: blur(18px);
    }

    .main {
      padding: clamp(12px, 1.7vw, 22px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: clamp(8px, 1.4vw, 16px);
      overflow: clip;
    }

    .topbar {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      align-items: center;
      gap: 10px;
    }

    .score-config {
      display: grid;
      grid-template-columns: auto 126px;
      align-items: stretch;
      gap: 6px;
      min-width: 0;
    }

    .status {
      min-width: 104px;
      padding: 8px 14px;
      border-radius: 22px;
      background: rgba(255,255,255,0.82);
      border: 1px solid var(--line);
      box-shadow: inset 0 -10px 20px rgba(8, 125, 255, 0.06);
      text-align: center;
    }

    .status-label {
      margin: 0 0 4px;
      color: var(--muted);
      font-size: 0.7rem;
      font-weight: 1000;
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .status-main {
      margin: 0;
      font-size: clamp(1.25rem, 2vw, 2rem);
      font-weight: 1000;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .actions {
      display: flex;
      gap: 8px;
      align-items: center;
      justify-content: end;
      min-width: 0;
      flex-wrap: nowrap;
      padding-block: 3px;
    }

    button {
      border: 0;
      border-radius: 999px;
      min-height: 46px;
      padding: 0 18px;
      font: inherit;
      font-weight: 1000;
      color: var(--ink);
      background: rgba(255,255,255,0.94);
      box-shadow: 0 12px 26px rgba(16, 11, 47, 0.12);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      transition: transform 120ms ease, filter 120ms ease, opacity 120ms ease;
    }

    .actions button {
      min-width: 76px;
      padding: 0 12px;
    }

    .actions .ready-toggle.is-ready {
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
      box-shadow: 0 14px 30px rgba(25, 200, 117, 0.24);
    }

    .actions .ready-toggle.is-hold {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
      box-shadow: 0 14px 30px rgba(255, 37, 65, 0.24);
    }

    .points-panel {
      min-width: 0;
      display: grid;
      grid-template-rows: repeat(2, minmax(0, 1fr));
      align-items: stretch;
      gap: 4px;
    }

    .point-control {
      min-width: 0;
      min-height: 0;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,0.94);
      box-shadow: inset 0 0 0 1px rgba(16, 11, 47, 0.04);
      display: grid;
      grid-template-columns: minmax(42px, 1fr) auto minmax(30px, 0.72fr);
      align-items: center;
      gap: 3px;
      padding: 0 8px;
    }

    .point-control span {
      font-weight: 1000;
      color: var(--muted);
      line-height: 1;
      font-size: 0.72rem;
    }

    .point-control .point-sign {
      font-size: 0.82rem;
      text-align: center;
    }

    .point-control .point-word {
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .point-control.is-correct .point-sign,
    .point-control.is-correct .point-word {
      color: #058247;
    }

    .point-control.is-wrong .point-sign,
    .point-control.is-wrong .point-word {
      color: var(--red);
    }

    .point-control input {
      width: 100%;
      min-width: 0;
      border: 0;
      outline: 0;
      padding: 0;
      font: inherit;
      font-size: 0.88rem;
      font-weight: 1000;
      text-align: center;
      color: var(--ink);
      background: transparent;
    }

    button:hover { transform: translateY(-2px); }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .danger {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
    }

    .stage {
      min-height: 0;
      position: relative;
      border-radius: clamp(24px, 4vw, 42px);
      display: grid;
      place-items: center;
      padding: clamp(10px, 1.4vw, 18px);
      overflow: clip;
      background:
        linear-gradient(135deg, rgba(255,255,255,0.6), rgba(255,255,255,0.2)),
        radial-gradient(circle at 50% 42%, rgba(255, 37, 65, 0.18), transparent 30%);
      border: 1px dashed rgba(16, 11, 47, 0.14);
    }

    .winner {
      width: min(860px, 90%);
      min-height: min(430px, 62vh);
      display: grid;
      place-items: center;
      text-align: center;
      border-radius: clamp(24px, 3vw, 38px);
      padding: clamp(18px, 3vw, 36px);
      background: rgba(255,255,255,0.86);
      box-shadow: inset 0 -20px 40px rgba(255, 138, 0, 0.1), 0 28px 70px rgba(16, 11, 47, 0.16);
    }

    .winner-stack {
      position: relative;
      display: grid;
      gap: clamp(14px, 2.3vw, 24px);
      justify-items: center;
    }

    .winner.is-hot {
      animation: winnerPop 520ms cubic-bezier(0.18, 1.2, 0.28, 1) both;
    }

    .winner.is-empty-round .winner-alarm,
    .winner.is-empty-round .score-actions .plus,
    .winner.is-empty-round .score-actions .minus {
      display: none;
    }

    .winner.is-empty-round .score-actions {
      grid-template-columns: minmax(150px, 240px);
      justify-content: center;
    }

    .winner.is-empty-round .winner-name {
      max-width: 720px;
      font-size: clamp(2.1rem, 5vw, 4.6rem);
      line-height: 0.95;
      color: var(--blue);
    }

    .winner-name {
      margin: 0;
      font-size: clamp(3rem, 8.5vw, 8rem);
      line-height: 0.86;
      font-weight: 1000;
      color: var(--red);
      text-shadow: 0 8px 0 rgba(16, 11, 47, 0.08);
      overflow-wrap: anywhere;
    }

    .score-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(92px, 1fr));
      gap: 10px;
      width: min(520px, 100%);
    }

    .score-actions button {
      min-height: 52px;
      font-size: clamp(1rem, 1.5vw, 1.35rem);
    }

    .score-actions .plus {
      color: #fff;
      background: linear-gradient(135deg, var(--green), #039b52);
    }

    .score-actions .minus {
      color: #fff;
      background: linear-gradient(135deg, var(--red), #a8001a);
    }

    .idle {
      text-align: center;
      display: grid;
      gap: 16px;
      justify-items: center;
    }

    .alarm-beacon {
      position: relative;
      width: min(360px, 38vw, 50vh);
      display: grid;
      place-items: center;
      isolation: isolate;
      filter: drop-shadow(0 28px 40px rgba(16, 11, 47, 0.22));
    }

    .idle .alarm-beacon {
      width: min(720px, 68vw, 78vh);
    }

    .alarm-beacon.is-active::before {
      content: "";
      position: absolute;
      left: 50.6%;
      top: 48.4%;
      width: 30%;
      aspect-ratio: 1;
      border-radius: 50%;
      background:
        conic-gradient(from 0deg, transparent 0 24deg, rgba(255,255,255,0.86) 30deg, rgba(255,212,71,0.92) 46deg, transparent 68deg 360deg),
        radial-gradient(circle, rgba(255, 255, 255, 0.9), rgba(255, 212, 71, 0.48) 36%, transparent 66%);
      transform: translate(-50%, -50%);
      filter: blur(0.5px) drop-shadow(0 0 18px rgba(255, 212, 71, 0.9));
      mix-blend-mode: screen;
      animation: beaconSweep 1.06s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    .alarm-beacon.is-active::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 48%;
      width: 18%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.72);
      box-shadow: 0 0 28px rgba(255, 255, 255, 0.9), 0 0 58px rgba(255, 212, 71, 0.82);
      transform: translate(-50%, -50%);
      animation: beaconPulse 590ms ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 3;
    }

    .alarm-image {
      display: block;
      width: 100%;
      height: auto;
      position: relative;
      z-index: 1;
    }

    .winner-alarm {
      width: min(580px, 50vw, 56vh);
      margin-bottom: -4px;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      z-index: 70;
      display: grid;
      place-items: center;
      padding: 22px;
      background: rgba(8, 8, 24, 0.64);
      backdrop-filter: blur(10px);
    }

    .confirm-card {
      width: min(440px, 94vw);
      border-radius: 30px;
      padding: 22px;
      background:
        radial-gradient(circle at 15% 0%, rgba(8, 125, 255, 0.18), transparent 34%),
        #fff;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.34);
      border: 1px solid rgba(255,255,255,0.76);
      animation: confirmPop 180ms ease both;
    }

    .confirm-title {
      margin: 0 0 8px;
      color: var(--ink);
      font-size: clamp(1.45rem, 3vw, 2.1rem);
      line-height: 1;
      font-weight: 1000;
    }

    .confirm-text {
      margin: 0 0 18px;
      color: var(--muted);
      font-weight: 900;
      line-height: 1.35;
    }

    .confirm-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .confirm-cancel {
      box-shadow: none;
      border: 1px solid var(--line);
    }

    .room-code {
      text-align: center;
      font-size: 2.1rem;
      font-weight: 1000;
      color: var(--red);
      letter-spacing: 0.08em;
    }

    .scoreboard {
      padding: clamp(12px, 1.5vw, 18px);
      display: grid;
      grid-template-rows: auto minmax(0, 1fr);
      gap: 10px;
      overflow: hidden;
    }

    .scoreboard-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .scoreboard h2 {
      margin: 0;
      font-size: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.18em;
      color: #3e3580;
    }

    .scoreboard-note {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 1000;
    }

    .players {
      min-height: 0;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-gutter: stable both-edges;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
      align-content: start;
      gap: 8px;
      padding-inline: 3px;
    }

    .player {
      min-height: 42px;
      border-radius: 16px;
      padding: 8px 14px;
      background: rgba(255,255,255,0.84);
      border: 1px solid var(--line);
      display: grid;
      grid-template-columns: 28px minmax(0, 1fr) auto;
      align-items: center;
      gap: 8px;
      font-weight: 1000;
    }

    .player.no-rank {
      grid-template-columns: minmax(0, 1fr) auto;
    }

    .player.is-locked {
      background: rgba(255, 226, 231, 0.94);
      border-color: rgba(255, 37, 65, 0.28);
    }

    .rank {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: #fff;
      background: linear-gradient(135deg, var(--blue), #3024d8);
      font-size: 0.78rem;
    }

    .player-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .player-score {
      min-width: 48px;
      padding: 5px 8px;
      border-radius: 999px;
      justify-self: end;
      text-align: center;
      color: var(--ink);
      background: rgba(25, 200, 117, 0.14);
    }

    .player.is-locked .player-score {
      color: var(--red);
      background: rgba(255, 37, 65, 0.12);
    }

    .remove {
      width: 28px;
      min-height: 28px;
      height: 28px;
      padding: 0;
      border-radius: 50%;
      color: #fff;
      background: var(--red);
      box-shadow: none;
      opacity: 1;
    }

    .player .remove + .remove {
      display: none;
    }

    .empty {
      color: var(--muted);
      font-weight: 900;
      padding: 12px;
      text-align: center;
    }

    .hidden { display: none !important; }

    @keyframes winnerPop {
      0% { transform: scale(0.82); filter: brightness(1.4); }
      65% { transform: scale(1.04); }
      100% { transform: scale(1); filter: brightness(1); }
    }

    @keyframes beaconSweep {
      to { transform: rotate(360deg); }
    }

    @keyframes beaconPulse {
      from { opacity: 0.48; filter: blur(0); }
      to { opacity: 1; filter: blur(2px); }
    }

    @keyframes confirmPop {
      from { transform: scale(0.9); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    @media (max-width: 1180px) and (min-width: 761px) {
      .app {
        grid-template-columns: minmax(0, 1fr) minmax(260px, 330px);
      }

      .topbar {
        grid-template-columns: auto minmax(256px, 1fr) auto;
        gap: 6px;
      }

      .actions,
      .points-panel {
        gap: 6px;
      }

      .actions button {
        min-width: 66px;
        padding-inline: 9px;
      }

      .score-config {
        grid-template-columns: auto 112px;
      }

      .point-control {
        padding-inline: 6px;
      }
    }

    @media (max-height: 760px) and (min-width: 761px) {
      .topbar {
        gap: 8px;
      }

      button {
        min-height: 40px;
        padding-inline: 10px;
      }

      .actions button {
        min-width: 68px;
      }

      .point-control {
        min-height: 0;
      }

      .winner {
        min-height: min(330px, 50vh);
        padding: 12px;
      }

      .winner-stack {
        gap: 10px;
      }

      .winner-name {
        font-size: clamp(2.4rem, 6.6vw, 5.6rem);
      }

      .score-actions button {
        min-height: 46px;
      }

      .alarm-beacon {
        width: min(260px, 30vw, 35vh);
      }

      .idle .alarm-beacon {
        width: min(580px, 52vw, 60vh);
      }

      .winner-alarm {
        width: min(430px, 38vw, 40vh);
      }

      .player {
        min-height: 36px;
        padding-block: 6px;
      }
    }

    @media (max-height: 660px) and (min-width: 761px) {
      .main {
        padding: 10px;
        gap: 8px;
      }

      .stage {
        padding: 8px;
        border-radius: 26px;
      }

      .idle .alarm-beacon {
        width: min(470px, 46vw, 52vh);
      }

      .winner {
        min-height: min(280px, 45vh);
        padding: 10px;
      }

      .winner-name {
        font-size: clamp(2.1rem, 5.8vw, 4.8rem);
      }

      .winner-alarm {
        width: min(330px, 30vw, 32vh);
      }

      .score-actions {
        gap: 8px;
      }

      .score-actions button {
        min-height: 40px;
      }
    }

    @media (max-width: 760px) {
      .topbar {
        grid-template-columns: 1fr;
      }

      .score-config,
      .actions {
        justify-content: stretch;
      }

      .actions button,
      .point-control {
        flex: 1 1 0;
      }

      .score-config {
        grid-template-columns: minmax(0, 1fr) 118px;
      }

      .app {
        grid-template-columns: 1fr;
        min-height: 100dvh;
        height: auto;
        overflow-y: auto;
      }

      .scoreboard {
        min-height: 320px;
      }

      body {
        overflow: auto;
      }

    }
  </style>
</head>
<body>
  <main class="app">
    <section class="main">
      <div class="topbar">
        <div class="score-config">
          <div class="status">
            <p class="status-label">Round</p>
            <p class="status-main" id="statusMain">0</p>
          </div>
          <div class="points-panel" aria-label="Point values">
            <label class="point-control is-correct" title="Correct answer points">
              <span class="point-word">Right</span>
              <span class="point-sign">+</span>
              <input id="correctPointsInput" type="number" min="1" max="10000" step="1" value="50" aria-label="Correct answer points">
            </label>
            <label class="point-control is-wrong" title="Wrong answer penalty">
              <span class="point-word">Wrong</span>
              <span class="point-sign">-</span>
              <input id="wrongPointsInput" type="number" min="1" max="10000" step="1" value="25" aria-label="Wrong answer penalty">
            </label>
          </div>
        </div>
        <div class="actions">
          <button id="readyBtn" class="ready-toggle is-hold" type="button">Ready</button>
          <button id="clearBtn" type="button">Clear</button>
          <button id="homeBtn" type="button">Home</button>
        </div>
      </div>

      <div class="stage" id="stage">
        <div class="idle" id="idleState">
          <div class="alarm-beacon" aria-label="Buzzer alarm waiting">
            <img class="alarm-image" src="./buzzer-alarm-off.png" alt="">
          </div>
        </div>
        <div class="winner hidden" id="winnerCard">
          <div class="winner-stack">
            <div class="alarm-beacon is-active winner-alarm" aria-label="Buzzer alarm active">
              <img class="alarm-image" src="./buzzer-alarm-on.png" alt="">
            </div>
            <h2 class="winner-name" id="winnerName">Player</h2>
            <div class="score-actions">
              <button class="plus" id="awardPointBtn" type="button">+1</button>
              <button id="passTurnBtn" type="button">Pass</button>
              <button class="minus" id="removePointBtn" type="button">-1</button>
            </div>
          </div>
        </div>
      </div>

    </section>

    <aside class="scoreboard" aria-label="Buzzer ranking">
      <div class="scoreboard-head">
        <h2>Players</h2>
      </div>
      <div class="players" id="players"></div>
    </aside>
  </main>

  <div class="confirm-overlay hidden" id="confirmOverlay" aria-hidden="true">
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <h2 class="confirm-title" id="confirmTitle">Confirm</h2>
      <p class="confirm-text" id="confirmText">Are you sure?</p>
      <div class="confirm-actions">
        <button class="confirm-cancel" id="confirmCancelBtn" type="button">Cancel</button>
        <button class="danger" id="confirmOkBtn" type="button">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    const confirmOverlay = document.getElementById("confirmOverlay");
    const confirmTitle = document.getElementById("confirmTitle");
    const confirmText = document.getElementById("confirmText");
    const confirmCancelBtn = document.getElementById("confirmCancelBtn");
    const confirmOkBtn = document.getElementById("confirmOkBtn");
    const playersEl = document.getElementById("players");
    const statusMain = document.getElementById("statusMain");
    const winnerCard = document.getElementById("winnerCard");
    const winnerName = document.getElementById("winnerName");
    const idleState = document.getElementById("idleState");
    const readyBtn = document.getElementById("readyBtn");
    const clearBtn = document.getElementById("clearBtn");
    const homeBtn = document.getElementById("homeBtn");
    const awardPointBtn = document.getElementById("awardPointBtn");
    const passTurnBtn = document.getElementById("passTurnBtn");
    const removePointBtn = document.getElementById("removePointBtn");
    const correctPointsInput = document.getElementById("correctPointsInput");
    const wrongPointsInput = document.getElementById("wrongPointsInput");

    const storageKey = "letter-clash-buzzer-room-code";
    const classroomStorageKey = "friendzy-classroom-code";
    let room = null;
    let socket = null;
    let pollTimer = null;
    let classroomImportTimer = null;
    let lastWinnerId = "";
    let wakeLock = null;
    let classroomImportInFlight = false;
    let correctPointValue = 50;
    let wrongPointValue = 25;
    const turnAlarmSound = new Audio("buzzer-turn-alarm.wav");
    turnAlarmSound.preload = "auto";
    turnAlarmSound.volume = 1;
    turnAlarmSound.load();
    const awardSound = new Audio("buzzer-chime.mp3");
    awardSound.preload = "auto";
    awardSound.volume = 1;
    awardSound.load();
    const wrongSound = new Audio("buzzer-wrong.mp3");
    wrongSound.preload = "auto";
    wrongSound.volume = 1;
    wrongSound.load();

    function escapeHtml(value) {
      return String(value || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    function askConfirm({ title, text, confirmLabel = "Confirm" }) {
      return new Promise((resolve) => {
        confirmTitle.textContent = title;
        confirmText.textContent = text;
        confirmOkBtn.textContent = confirmLabel;
        confirmOverlay.classList.remove("hidden");
        confirmOverlay.setAttribute("aria-hidden", "false");
        confirmCancelBtn.focus();

        const cleanup = (answer) => {
          confirmOverlay.classList.add("hidden");
          confirmOverlay.setAttribute("aria-hidden", "true");
          confirmCancelBtn.removeEventListener("click", onCancel);
          confirmOkBtn.removeEventListener("click", onOk);
          confirmOverlay.removeEventListener("click", onOverlayClick);
          document.removeEventListener("keydown", onKeydown);
          resolve(answer);
        };
        const onCancel = () => cleanup(false);
        const onOk = () => cleanup(true);
        const onOverlayClick = (event) => {
          if (event.target === confirmOverlay) cleanup(false);
        };
        const onKeydown = (event) => {
          if (event.key === "Escape") cleanup(false);
        };

        confirmCancelBtn.addEventListener("click", onCancel);
        confirmOkBtn.addEventListener("click", onOk);
        confirmOverlay.addEventListener("click", onOverlayClick);
        document.addEventListener("keydown", onKeydown);
      });
    }

    async function api(path, payload = null, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: payload ? { "Content-Type": "application/json" } : undefined,
        body: payload ? JSON.stringify(payload) : undefined
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.error || "Request failed");
      return data;
    }

    function getSocketUrl() {
      if (!room) return "";
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      return `${protocol}//${window.location.host}/ws/buzzer?code=${encodeURIComponent(room.code)}`;
    }

    function unlockAudio() {
      [turnAlarmSound, awardSound, wrongSound].forEach((sound) => {
        try {
          const previousMuted = sound.muted;
          sound.muted = true;
          sound.play()
            .then(() => {
              sound.pause();
              sound.currentTime = 0;
              sound.muted = previousMuted;
            })
            .catch(() => {
              sound.muted = previousMuted;
            });
        } catch (_) {}
      });
    }

    function playSound(sound, startAt = 0) {
      try {
        sound.pause();
        sound.currentTime = startAt;
        sound.muted = false;
        sound.play().catch(() => {});
      } catch (_) {}
    }

    function playTurnAlarmSound() {
      playSound(turnAlarmSound);
    }

    function playAwardSound() {
      playSound(awardSound);
    }

    function playWrongSound() {
      playSound(wrongSound);
    }

    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") {
        return;
      }
      try {
        if (wakeLock && !wakeLock.released) {
          return;
        }
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => {
          wakeLock = null;
        });
      } catch (_) {}
    }

    function normalizePointValue(value, fallback) {
      return Math.max(1, Math.min(10000, Math.trunc(Number(value) || fallback)));
    }

    function syncPointButtons() {
      correctPointValue = normalizePointValue(correctPointsInput.value, 50);
      wrongPointValue = normalizePointValue(wrongPointsInput.value, 25);
      correctPointsInput.value = correctPointValue;
      wrongPointsInput.value = wrongPointValue;
      awardPointBtn.textContent = `+${correctPointValue}`;
      removePointBtn.textContent = `-${wrongPointValue}`;
    }

    function render() {
      if (!room) {
        renderNoRoom();
        return;
      }
      localStorage.setItem(storageKey, room.code);
      const isReady = room.status === "live" && !room.buzzerHeld;
      readyBtn.disabled = !room.players.length;
      readyBtn.textContent = isReady ? "Hold" : "Ready";
      readyBtn.classList.toggle("is-ready", !isReady);
      readyBtn.classList.toggle("is-hold", isReady);
      clearBtn.disabled = !room.players.length;
      statusMain.textContent = room.roundId || 0;
      const lockedOutPlayers = getLockedOutPlayers();
      const noPlayersLeft = hasNoPlayersLeftToBuzz();

      if (room.winner) {
        idleState.classList.add("hidden");
        winnerCard.classList.remove("hidden");
        winnerCard.classList.remove("is-empty-round");
        winnerName.textContent = room.winner.playerName;
        if (room.winner.id !== lastWinnerId) {
          lastWinnerId = room.winner.id;
          playTurnAlarmSound();
          winnerCard.classList.remove("is-hot");
          winnerCard.offsetHeight;
          winnerCard.classList.add("is-hot");
        }
      } else if (noPlayersLeft) {
        lastWinnerId = "";
        idleState.classList.add("hidden");
        winnerCard.classList.remove("hidden", "is-hot");
        winnerCard.classList.add("is-empty-round");
        winnerName.textContent = "No participants left to buzz this round.";
      } else {
        lastWinnerId = "";
        winnerCard.classList.add("hidden");
        winnerCard.classList.remove("is-empty-round");
        idleState.classList.remove("hidden");
      }

      const didPlay = (player) => !!player.hasPlayed || Number(player.score || 0) !== 0;
      const sortedPlayers = room.players.slice().sort((a, b) => {
        const playedDiff = Number(didPlay(b)) - Number(didPlay(a));
        if (playedDiff) return playedDiff;
        const scoreDiff = Number(b.score || 0) - Number(a.score || 0);
        if (scoreDiff) return scoreDiff;
        return String(a.name || "").localeCompare(String(b.name || ""));
      });
      const rankedPlayers = sortedPlayers.filter(didPlay);
      playersEl.innerHTML = sortedPlayers.length
        ? sortedPlayers.map((player, index) => `
          <div class="player ${didPlay(player) ? "" : "no-rank"} ${lockedOutPlayers.includes(player.id) ? "is-locked" : ""}">
            ${didPlay(player) ? `<span class="rank">${rankedPlayers.findIndex((item) => item.id === player.id) + 1}</span>` : ""}
            <span class="player-name">${escapeHtml(player.name)}</span>
            <span class="player-score">${Number(player.score || 0)} pts</span>
          </div>
        `).join("")
        : `<div class="empty">Waiting for players...</div>`;
    }

    function renderNoRoom() {
      readyBtn.disabled = true;
      clearBtn.disabled = true;
      readyBtn.textContent = "Ready";
      readyBtn.classList.remove("is-ready");
      readyBtn.classList.add("is-hold");
      statusMain.textContent = "0";
      lastWinnerId = "";
      winnerCard.classList.add("hidden");
      idleState.classList.remove("hidden");
      playersEl.innerHTML = `<div class="empty">Open Friendzy to connect players.</div>`;
    }

    function getLockedOutPlayers() {
      return Array.isArray(room?.lockedOutPlayers) ? room.lockedOutPlayers : [];
    }

    function hasNoPlayersLeftToBuzz() {
      const lockedOutPlayers = getLockedOutPlayers();
      return room?.status === "live"
        && !room.buzzerHeld
        && !room.winner
        && room.players.length > 0
        && room.players.every((player) => lockedOutPlayers.includes(player.id));
    }

    function disconnectRoom() {
      if (socket) {
        try {
          socket.close();
        } catch (_) {}
        socket = null;
      }
      if (pollTimer) {
        clearTimeout(pollTimer);
        pollTimer = null;
      }
    }

    function connectSocket() {
      if (!room || socket) return;
      try {
        socket = new WebSocket(getSocketUrl());
      } catch (_) {
        pollRoom();
        return;
      }
      socket.addEventListener("message", (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload?.type === "buzzer-room" && payload.room) {
            room = payload.room;
            render();
          } else if (payload?.type === "buzzer-room-deleted") {
            disconnectRoom();
            room = null;
            localStorage.removeItem(storageKey);
            render();
          }
        } catch (_) {}
      });
      socket.addEventListener("close", () => {
        socket = null;
        pollRoom();
      });
      socket.addEventListener("error", () => {
        socket = null;
        pollRoom();
      });
    }

    async function pollRoom() {
      if (!room || pollTimer) return;
      try {
        const data = await api(`/api/buzzer/room?code=${encodeURIComponent(room.code)}`, null, "GET");
        room = data.room;
        importClassroomPlayers().catch(() => {});
        render();
      } catch (_) {
        disconnectRoom();
        room = null;
        localStorage.removeItem(storageKey);
        render();
      } finally {
        pollTimer = setTimeout(() => {
          pollTimer = null;
          if (!socket) pollRoom();
        }, 900);
      }
    }

    async function ensureRoom() {
      if (room) return room;
      const savedCode = localStorage.getItem(storageKey);
      if (savedCode) {
        try {
          const existing = await api(`/api/buzzer/room?code=${encodeURIComponent(savedCode)}`, null, "GET");
          room = existing.room;
        } catch (_) {
          localStorage.removeItem(storageKey);
        }
      }
      if (!room) {
        const data = await api("/api/buzzer/create-room");
        room = data.room;
      }
      render();
      connectSocket();
      importClassroomPlayers().catch(() => {});
      setClassroomTool("buzzer", room.code).catch(() => {});
      return room;
    }

    async function importClassroomPlayers() {
      if (!room || classroomImportInFlight) return;
      const classroomCode = localStorage.getItem(classroomStorageKey);
      if (!classroomCode) return;
      classroomImportInFlight = true;
      try {
        const data = await api("/api/buzzer/import-classroom", {
          code: room.code,
          classroomCode
        });
        room = data.room;
        setClassroomTool("buzzer", room.code).catch(() => {});
        render();
      } catch (_) {
      } finally {
        classroomImportInFlight = false;
      }
    }

    async function setClassroomTool(activeTool = "buzzer", activeToolCode = room?.code || "") {
      const classroomCode = localStorage.getItem(classroomStorageKey);
      if (!classroomCode) return;
      try {
        await api("/api/classroom/set-tool", {
          code: classroomCode,
          activeTool,
          activeToolCode
        });
      } catch (_) {}
    }

    function startClassroomImportTimer() {
      clearInterval(classroomImportTimer);
      classroomImportTimer = setInterval(() => {
        if (!room && localStorage.getItem(classroomStorageKey)) {
          ensureRoom().catch(() => {});
          return;
        }
        importClassroomPlayers().catch(() => {});
      }, 1600);
    }

    async function initRoom() {
      room = null;
      render();
    }

    async function startLive() {
      if (!room) return;
      const data = await api("/api/buzzer/start", { code: room.code });
      room = data.room;
      render();
    }

    readyBtn.addEventListener("click", async () => {
      if (!room) return;
      if (room.status !== "live") {
        await startLive();
        return;
      }
      const nextHeld = !room.buzzerHeld;
      room.buzzerHeld = nextHeld;
      render();
      const data = await api("/api/buzzer/hold", {
        code: room.code,
        held: nextHeld
      });
      room = data.room;
      render();
    });

    document.addEventListener("keydown", (event) => {
      const editable = event.target.closest("input, textarea, select, [contenteditable='true']");
      if (editable) return;
      if (!confirmOverlay.classList.contains("hidden")) return;
      if (event.code === "Space") {
        if (!room || readyBtn.disabled) return;
        event.preventDefault();
        readyBtn.click();
        return;
      }
      const key = String(event.key || "").toLowerCase();
      if (key === "r" && room?.winner) {
        event.preventDefault();
        awardPointBtn.click();
        return;
      }
      if (key === "w" && room?.winner) {
        event.preventDefault();
        removePointBtn.click();
        return;
      }
      if (key === "p" && (room?.winner || hasNoPlayersLeftToBuzz())) {
        event.preventDefault();
        passTurnBtn.click();
      }
    });

    clearBtn.addEventListener("click", async () => {
      if (!room) return;
      const confirmed = await askConfirm({
        title: "Clear buzzer scores?",
        text: "This will reset rounds, points, current turn, and locked players. Connected players will stay in the room.",
        confirmLabel: "Clear"
      });
      if (!confirmed) return;
      const data = await api("/api/buzzer/clear-game", { code: room.code });
      room = data.room;
      render();
    });

    window.addEventListener("friendzy:reset", () => {
      const oldCode = room?.code || localStorage.getItem(storageKey);
      disconnectRoom();
      room = null;
      localStorage.removeItem(storageKey);
      if (oldCode) {
        api("/api/buzzer/delete-room", { code: oldCode }).catch(() => {});
      }
      render();
      ensureRoom().catch(() => {});
    });

    window.addEventListener("friendzy:player-removed", (event) => {
      const name = String(event.detail?.name || "").trim();
      if (!room || !name) return;
      api("/api/buzzer/remove-player", { code: room.code, name })
        .then((data) => {
          room = data.room;
          render();
        })
        .catch(() => {});
    });

    window.addEventListener("friendzy:players-updated", () => {
      importClassroomPlayers().catch(() => {});
    });

    homeBtn.addEventListener("click", () => {
      setClassroomTool("standby", "").finally(() => { window.location.href = "./"; });
    });

    async function resolveCurrentTurn(delta) {
      if (!room?.winner) return;
      const data = await api("/api/buzzer/score", {
        code: room.code,
        playerId: room.winner.playerId,
        delta
      });
      room = data.room;
      render();
    }

    async function passCurrentRound() {
      if (!room) return;
      const data = await api("/api/buzzer/pass", { code: room.code });
      room = data.room;
      render();
    }

    awardPointBtn.addEventListener("click", () => {
      syncPointButtons();
      playAwardSound();
      resolveCurrentTurn(correctPointValue).catch(() => {});
    });

    passTurnBtn.addEventListener("click", () => {
      if (room?.winner) {
        resolveCurrentTurn(0).catch(() => {});
        return;
      }
      passCurrentRound().catch(() => {});
    });

    removePointBtn.addEventListener("click", () => {
      syncPointButtons();
      playWrongSound();
      resolveCurrentTurn(-wrongPointValue).catch(() => {});
    });

    correctPointsInput.addEventListener("change", syncPointButtons);
    wrongPointsInput.addEventListener("change", syncPointButtons);
    [correctPointsInput, wrongPointsInput].forEach((input) => {
      input.addEventListener("keydown", (event) => {
        if (event.key !== "Enter") return;
        event.preventDefault();
        syncPointButtons();
        input.blur();
      });
    });
    correctPointsInput.addEventListener("input", () => {
      awardPointBtn.textContent = `+${normalizePointValue(correctPointsInput.value, correctPointValue)}`;
    });
    wrongPointsInput.addEventListener("input", () => {
      removePointBtn.textContent = `-${normalizePointValue(wrongPointsInput.value, wrongPointValue)}`;
    });

    document.addEventListener("pointerdown", unlockAudio, { once: true });
    ["click", "pointerdown", "touchstart", "keydown"].forEach((eventName) => {
      document.addEventListener(eventName, requestWakeLock, { passive: true });
    });
    window.addEventListener("focus", requestWakeLock);
    window.addEventListener("pageshow", requestWakeLock);

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        requestWakeLock();
      }
      if (!document.hidden && room && !socket) {
        pollRoom();
      }
    });

    Promise.resolve()
      .then(async () => {
        await initRoom();
        if (localStorage.getItem(classroomStorageKey)) {
          await ensureRoom();
        }
      })
      .catch((error) => {
        statusMain.textContent = error.message || "Could not create buzzer room.";
      });
    requestWakeLock();
    syncPointButtons();
    startClassroomImportTimer();
  </script>
  <script src="./friendzy-panel.js"></script>
</body>
</html>
