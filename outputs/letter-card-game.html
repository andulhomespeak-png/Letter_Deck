<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Clash</title>
  <link rel="icon" type="image/png" href="./letter-clash-favicon.png">
  <style>
    :root {
      --bg: #fff36b;
      --bg-deep: #ff8a00;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --ink: #160f2e;
      --ink-soft: #4a3f7a;
      --line: rgba(22, 15, 46, 0.18);
      --accent: #ff4d2d;
      --accent-soft: #ffe95b;
      --mint: #00d084;
      --blue: #2457ff;
      --pink: #ff2f92;
      --violet: #7a2cff;
      --shadow: 0 28px 70px rgba(67, 28, 145, 0.22);
      --shadow-soft: 0 16px 30px rgba(67, 28, 145, 0.14);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Avenir Next Condensed", "Franklin Gothic Medium", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, rgba(255, 47, 146, 0.36), transparent 18%),
        radial-gradient(circle at 88% 12%, rgba(36, 87, 255, 0.34), transparent 16%),
        radial-gradient(circle at 50% 100%, rgba(0, 208, 132, 0.2), transparent 26%),
        linear-gradient(180deg, #fffcc5 0%, var(--bg) 42%, var(--bg-deep) 100%);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 34vw;
      height: 34vw;
      border-radius: 50%;
      filter: blur(26px);
      pointer-events: none;
      opacity: 0.38;
      z-index: 0;
      animation: drift 14s ease-in-out infinite;
    }

    body::before {
      top: -8vw;
      left: -8vw;
      background: radial-gradient(circle, rgba(255, 47, 146, 0.5) 0%, rgba(255, 47, 146, 0) 70%);
    }

    body::after {
      right: -10vw;
      bottom: -12vw;
      background: radial-gradient(circle, rgba(36, 87, 255, 0.4) 0%, rgba(36, 87, 255, 0) 70%);
      animation-delay: -5s;
    }

    .page {
        width: min(1680px, calc(100% - 12px));
        margin: 0 auto;
        padding: 6px 0;
        position: relative;
        z-index: 1;
        height: 100dvh;
      }

    .app-shell {
        min-height: calc(100dvh - 12px);
        height: calc(100dvh - 12px);
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 8px;
      }

    .panel {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(255, 247, 253, 0.82)),
        var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.66);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px;
        backdrop-filter: blur(14px);
      }

    .topbar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) 236px;
        gap: 6px;
        align-items: center;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.62), rgba(241, 234, 255, 0.9));
      }

    .brand {
        margin: 0;
        display: flex;
        align-items: center;
        min-height: 88px;
      }

    .brand-logo {
        display: block;
        width: auto;
        height: auto;
        max-width: min(31vw, 460px);
        max-height: 88px;
        filter: drop-shadow(0 10px 18px rgba(20, 12, 55, 0.18));
      }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 236px;
      justify-self: end;
      align-self: center;
    }

    .info-panel {
      min-height: 88px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 244, 255, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .info-copy {
      min-width: 0;
      display: grid;
      gap: 5px;
      align-content: center;
    }

    .info-headline,
    .info-detail {
      min-width: 0;
      line-height: 1.2;
    }

    .info-headline {
      font-size: clamp(0.98rem, 1.32vw, 1.15rem);
      font-weight: 900;
      color: var(--ink);
    }

    .info-detail {
      min-height: 1.3em;
      font-size: clamp(0.88rem, 1.03vw, 0.96rem);
      color: var(--ink-soft);
    }

    .info-detail.good {
      color: #0e6d52;
    }

    .info-detail.bad {
      color: #b83c20;
    }

    .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 10px;
        min-height: 0;
        height: 100%;
      }

    .playfield {
        display: grid;
        grid-template-rows: 1fr;
        gap: 10px;
        min-height: 0;
      }

    .sidebar {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 10px;
        align-content: start;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(236, 244, 255, 0.94));
      }

    .stat {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(52, 31, 20, 0.08);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      min-height: 0;
      align-content: stretch;
      perspective: 1200px;
    }

    .card {
      min-height: clamp(180px, 30dvh, 420px);
      border: 1px solid rgba(56, 31, 18, 0.12);
      border-radius: 38px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 1), rgba(242, 247, 255, 1));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 28px 48px rgba(31, 26, 23, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: rotate(var(--tilt));
      position: relative;
      overflow: hidden;
      animation: cardDeal 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(130deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 36%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 28px;
      border: 1px dashed rgba(52, 31, 20, 0.08);
      pointer-events: none;
    }

    .card[data-color="0"] { color: #ff3b30; }
    .card[data-color="1"] { color: #5b2be0; }
    .card[data-color="2"] { color: #10bf67; }
    .card[data-color="3"] { color: #f3c645; }
    .card[data-color="4"] { color: #ba60dc; }

    .card-letter {
      font-size: clamp(7rem, 18vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 0.9;
      position: relative;
      z-index: 1;
    }

    .card-score {
      position: absolute;
      top: 22px;
      right: 22px;
      min-width: 42px;
      padding: 7px 10px 6px;
      border-radius: 999px;
      background: rgba(22, 15, 46, 0.08);
      border: 1px solid rgba(22, 15, 46, 0.08);
      color: rgba(22, 15, 46, 0.76);
      font-size: clamp(0.95rem, 1.6vw, 1.25rem);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      box-shadow: 0 10px 18px rgba(31, 26, 23, 0.08);
      z-index: 1;
    }

    .team-name {
      width: 100%;
      border: 1px solid rgba(52, 31, 20, 0.1);
      border-radius: 18px;
      padding: 14px 16px;
      font: inherit;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .team-name {
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .celebration {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
      z-index: 20;
    }

    .celebration.is-visible {
      opacity: 1;
    }

    .celebration-burst {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 233, 91, 0.34), transparent 14%),
        radial-gradient(circle at 75% 24%, rgba(255, 47, 146, 0.3), transparent 16%),
        radial-gradient(circle at 66% 74%, rgba(36, 87, 255, 0.32), transparent 18%),
        radial-gradient(circle at 30% 78%, rgba(0, 208, 132, 0.28), transparent 16%),
        rgba(16, 9, 41, 0.38);
      animation: celebrateBackdrop 900ms ease;
    }

    .celebration-card {
      position: relative;
      padding: 28px 34px;
      min-width: min(86vw, 720px);
      border-radius: 36px;
      text-align: center;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(251, 243, 255, 0.98));
      box-shadow: 0 36px 80px rgba(24, 11, 58, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.8);
      animation: celebratePop 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .celebration-name {
      margin: 0 0 10px;
      font-size: clamp(1.5rem, 3vw, 2.35rem);
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow: 0 6px 20px rgba(255, 79, 163, 0.12);
    }

    .celebration-word {
      --word-length: 4;
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: nowrap;
      margin: 0;
      max-width: 100%;
    }

    .claim-letter-card {
      width: clamp(68px, 7vw, 98px);
      aspect-ratio: 0.78;
      border-radius: 24px;
      border: 1px solid rgba(56, 31, 18, 0.12);
      background: linear-gradient(145deg, rgba(255,255,255,1), rgba(242,247,255,1));
      box-shadow:
        0 18px 28px rgba(31, 26, 23, 0.14),
        inset 0 1px 0 rgba(255,255,255,0.92);
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      opacity: 1;
      transform: rotate(var(--tilt, 0deg));
    }

    .claim-letter-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(130deg, rgba(255,255,255,0.96), rgba(255,255,255,0) 38%),
        linear-gradient(180deg, rgba(255,255,255,0.24), rgba(255,255,255,0));
      pointer-events: none;
    }

    .claim-letter-card::after {
      content: "";
      position: absolute;
      inset: 8px;
      border-radius: 18px;
      border: 1px dashed rgba(52, 31, 20, 0.08);
      pointer-events: none;
    }

    .claim-letter-card[data-color="0"] { color: #ff3b30; }
    .claim-letter-card[data-color="1"] { color: #5b2be0; }
    .claim-letter-card[data-color="2"] { color: #10bf67; }
    .claim-letter-card[data-color="3"] { color: #f3c645; }
    .claim-letter-card[data-color="4"] { color: #ba60dc; }

    .claim-letter-card.used-letter {
      box-shadow:
        0 0 0 2px rgba(196, 255, 0, 0.9),
        0 0 6px rgba(196, 255, 0, 0.42),
        0 0 12px rgba(0, 247, 255, 0.28),
        0 10px 16px rgba(0, 247, 255, 0.12),
        inset 0 1px 0 rgba(255,255,255,0.92);
      filter:
        drop-shadow(0 0 4px rgba(196, 255, 0, 0.34))
        drop-shadow(0 0 8px rgba(0, 247, 255, 0.2));
      animation: claimCardClaimed 760ms cubic-bezier(0.22, 1, 0.36, 1) both;
      animation-delay: var(--delay, 0ms);
    }

    .claim-letter-score {
      position: absolute;
      top: 8px;
      right: 8px;
      min-width: 24px;
      padding: 4px 5px 3px;
      border-radius: 999px;
      background: rgba(22, 15, 46, 0.08);
      border: 1px solid rgba(22, 15, 46, 0.08);
      color: rgba(22, 15, 46, 0.76);
      font-size: 0.72rem;
      font-weight: 900;
      line-height: 1;
      text-align: center;
      z-index: 1;
    }

    .claim-letter-glyph {
      position: relative;
      z-index: 1;
      font-size: clamp(2.4rem, 4vw, 3.7rem);
      font-weight: 900;
      line-height: 0.9;
      letter-spacing: -0.08em;
    }

    .podium-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top center, rgba(255, 233, 91, 0.22), transparent 26%),
        linear-gradient(180deg, rgba(12, 8, 34, 0.52), rgba(12, 8, 34, 0.76));
      z-index: 32;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .podium-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .podium-modal {
      width: min(92vw, 980px);
      border-radius: 38px;
      padding: 24px 24px 28px;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(248,245,255,0.98));
      box-shadow: 0 44px 90px rgba(24, 11, 58, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: grid;
      gap: 18px;
      text-align: center;
    }

    .podium-kicker {
      margin: 0;
      font-size: 0.88rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--pink);
    }

    .podium-title {
      margin: 0;
      font-size: clamp(2.6rem, 6vw, 5rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .podium-subtitle {
      margin: 0;
      color: var(--ink-soft);
      font-size: clamp(1rem, 1.7vw, 1.18rem);
      font-weight: 700;
    }

    .podium-stage {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: end;
      min-height: 320px;
      padding-top: 6px;
    }

    .podium-place {
      position: relative;
      display: grid;
      align-content: end;
      gap: 10px;
      min-height: 220px;
      animation: podiumRise 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .podium-place[data-rank="1"] {
      animation-delay: 90ms;
    }

    .podium-place[data-rank="2"] {
      animation-delay: 0ms;
    }

    .podium-place[data-rank="3"] {
      animation-delay: 160ms;
    }

    .podium-badge {
      justify-self: center;
      min-width: 74px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: white;
      box-shadow: 0 16px 26px rgba(31, 26, 23, 0.16);
    }

    .podium-place[data-rank="1"] .podium-badge {
      background: linear-gradient(180deg, #ff7f52, #ff4d2d);
    }

    .podium-place[data-rank="2"] .podium-badge {
      background: linear-gradient(180deg, #5c77ff, #2457ff);
    }

    .podium-place[data-rank="3"] .podium-badge {
      background: linear-gradient(180deg, #12c977, #00a868);
    }

    .podium-team {
      display: grid;
      gap: 6px;
      justify-items: center;
      padding: 0 10px;
    }

    .podium-team-name {
      font-size: clamp(1.15rem, 2vw, 1.7rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .podium-score {
      font-size: clamp(0.94rem, 1.4vw, 1.08rem);
      font-weight: 800;
      color: var(--ink-soft);
    }

    .podium-block {
      border-radius: 30px 30px 20px 20px;
      display: grid;
      place-items: center;
      color: white;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 900;
      text-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
      box-shadow: 0 26px 38px rgba(31, 26, 23, 0.16);
    }

    .podium-place[data-rank="1"] .podium-block {
      min-height: 170px;
      background: linear-gradient(180deg, #ffd85b, #ff9e1a);
    }

    .podium-place[data-rank="2"] .podium-block {
      min-height: 130px;
      background: linear-gradient(180deg, #6f89ff, #3859e8);
    }

    .podium-place[data-rank="3"] .podium-block {
      min-height: 102px;
      background: linear-gradient(180deg, #33db9a, #00a868);
    }

    .podium-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .report-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(14, 10, 37, 0.7);
      z-index: 38;
      padding: 24px;
    }

    .report-overlay.hidden {
      display: none !important;
    }

    .report-modal {
      width: min(92vw, 1100px);
      max-height: calc(100dvh - 48px);
      overflow: hidden;
      border-radius: 32px;
      padding: 22px;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(251,243,255,0.99));
      box-shadow: 0 36px 80px rgba(24, 11, 58, 0.3);
      display: grid;
      gap: 16px;
      border: 1px solid rgba(255, 255, 255, 0.9);
    }

    .report-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: center;
    }

    .report-copy {
      display: grid;
      gap: 6px;
    }

    .report-kicker {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pink);
      font-weight: 800;
    }

    .report-title {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 0.94;
      letter-spacing: -0.05em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .report-subtitle {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.98rem;
      font-weight: 700;
    }

    .report-close {
      min-width: 96px;
    }

    .report-list {
      overflow: auto;
      display: grid;
      gap: 10px;
      padding-right: 4px;
    }

    .report-row {
      display: grid;
      grid-template-columns: minmax(0, 180px) minmax(0, 150px) minmax(88px, 110px) minmax(0, 1fr);
      gap: 12px;
      align-items: start;
      padding: 14px 16px;
      border-radius: 22px;
      background: rgba(20, 11, 47, 0.05);
      border: 1px solid rgba(22, 15, 46, 0.08);
    }

    .report-row.is-pending {
      opacity: 0.78;
    }

    .report-team,
    .report-word,
    .report-points,
    .report-definition {
      min-width: 0;
    }

    .report-team {
      font-weight: 900;
      color: var(--ink);
      text-transform: uppercase;
      line-height: 1.1;
    }

    .report-word {
      font-weight: 900;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 0.04em;
      line-height: 1.1;
    }

    .report-points {
      font-weight: 900;
      color: #0e6d52;
      white-space: nowrap;
      line-height: 1.1;
    }

    .report-definition {
      color: var(--ink-soft);
      font-weight: 700;
      line-height: 1.35;
    }

    .report-definition.is-missing {
      color: #8a668e;
      font-style: italic;
    }

    .report-empty {
      padding: 22px;
      border-radius: 22px;
      background: rgba(20, 11, 47, 0.05);
      border: 1px solid rgba(22, 15, 46, 0.08);
      text-align: center;
      color: var(--ink-soft);
      font-weight: 700;
    }

    .qr-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(14, 10, 37, 0.76);
      z-index: 25;
      padding: 24px;
    }

    .qr-overlay.hidden {
      display: none !important;
    }

    .confirm-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(14, 10, 37, 0.58);
      z-index: 42;
      padding: 24px;
      pointer-events: auto;
    }

    .confirm-overlay.hidden {
      display: none !important;
    }

    .confirm-modal {
      width: min(92vw, 560px);
      max-height: calc(100dvh - 48px);
      overflow: auto;
      border-radius: 32px;
      padding: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(251,243,255,0.99));
      box-shadow: 0 36px 80px rgba(24, 11, 58, 0.3);
      display: grid;
      gap: 16px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      align-content: center;
      pointer-events: auto;
    }

    .confirm-kicker {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pink);
      font-weight: 800;
    }

    .confirm-title {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .confirm-text {
      margin: 0;
      color: var(--ink-soft);
      font-size: 1rem;
      line-height: 1.45;

    @media (max-width: 980px) {

</head>

    async function requestWakeLock() {
      if (!("wakeLock" in navigator) || document.visibilityState !== "visible") {
        return;
      }
      try {
        if (wakeLockSentinel) {
          return;
        }
        wakeLockSentinel = await navigator.wakeLock.request("screen");
        wakeLockSentinel.addEventListener("release", () => {
          wakeLockSentinel = null;
        }, { once: true });
      } catch (_) {
        wakeLockSentinel = null;
      }
    }

    async function releaseWakeLock() {
      if (!wakeLockSentinel) {
        return;
      }
      try {
        await wakeLockSentinel.release();
      } catch (_) {
      }
      wakeLockSentinel = null;
    }

    function drawLetter() {
      return alphabet[Math.floor(Math.random() * alphabet.length)];

    function getScoreboardTeams() {
      const source = liveEnabled && liveRoom
        ? liveRoom.teams.map((team) => getTeamByLiveEntry(team) || { id: team.id, name: team.name, score: 0, members: team.members })
        : teams.slice();

      return source
        .slice()
        .sort((a, b) => (Number(b.score) - Number(a.score)) || String(a.name || "").localeCompare(String(b.name || "")));
    }

    function isGameFinished() {
      return matchFinished || (liveRoom?.status || "") === "finished";
    }

    function renderPodium() {
      const ranked = getScoreboardTeams().slice(0, 3);
      const podiumKey = ranked.map((team) => `${team.id}:${team.score}`).join("|");
      if (podiumKey && podiumKey === lastPodiumKey) {
        return;
      }
      lastPodiumKey = podiumKey;
      podiumStage.innerHTML = "";
      const visualOrder = [1, 0, 2];
      visualOrder.forEach((index) => {
        const team = ranked[index];
        if (!team) {
          return;
        }
        const place = document.createElement("div");
        const rank = index + 1;
        place.className = "podium-place";
        place.dataset.rank = String(rank);
        place.innerHTML = `
          <div class="podium-badge">#${rank}</div>
          <div class="podium-team">
            <div class="podium-team-name">${team.name}</div>
            <div class="podium-score">${team.score} pts</div>
          </div>
          <div class="podium-block">${rank}</div>
        `;
        podiumStage.appendChild(place);
      });
      const winner = ranked[0];
      podiumSubtitle.textContent = winner
        ? `${winner.name} reached ${winner.score} points and won the match.`

    function updatePodiumVisibility() {
      if (isGameFinished()) {
        stopBackgroundLoop();

    function buildSubmissionHeadline(participantName, rawWord, definition = "") {
      const name = participantName || "Student";
      const word = String(rawWord || "").trim();
      const safeDefinition = definition
        ? `<span class="definition-inline">${definition}</span>`
        : "";
      return `<strong>${name}</strong><span class="submission-word">${word}</span>${safeDefinition}`;

    function renderInfoPanel() {
      infoHeadlineEl.innerHTML = liveBannerHtml || "Student answers appear here.";
      infoDetailEl.className = infoMessageTone ? `info-detail ${infoMessageTone}` : "info-detail";
      infoDetailEl.innerHTML = infoMessageHtml || "";

    async function fetchWordDefinition(rawWord) {
      const key = String(rawWord || "").trim().toLowerCase();
      if (!key) {
        return "";
      }
      if (definitionCache.has(key)) {
        return definitionCache.get(key);
      }
      if (definitionPromiseCache.has(key)) {
        return definitionPromiseCache.get(key);
      }
      const request = (async () => {
        const candidates = Array.from(new Set([
          key,
          key.endsWith("ing") && key.length > 5 ? key.slice(0, -3) : "",
          key.endsWith("ing") && key.length > 5 ? `${key.slice(0, -3)}e` : "",
          key.endsWith("ied") && key.length > 4 ? `${key.slice(0, -3)}y` : "",
          key.endsWith("ed") && key.length > 4 ? key.slice(0, -2) : "",
          key.endsWith("ed") && key.length > 4 ? `${key.slice(0, -2)}e` : "",
          key.endsWith("ies") && key.length > 4 ? `${key.slice(0, -3)}y` : "",
          key.endsWith("es") && key.length > 4 ? key.slice(0, -2) : "",
          key.endsWith("s") && key.length > 3 ? key.slice(0, -1) : "",
          key.endsWith("ly") && key.length > 4 ? key.slice(0, -2) : ""
        ].filter(Boolean)));

        const parseDictionaryApiDev = (data) => data?.[0]?.meanings?.flatMap((meaning) => meaning.definitions || [])
          ?.map((entry) => entry.definition)
          ?.find(Boolean) || "";

        const parseEnglishDictionaryApi = (data) => data?.partsOfSpeech?.flatMap((part) => part?.senses || [])
          ?.map((sense) => sense?.definition)
          ?.find(Boolean) || "";

        for (const candidate of candidates) {
          const sources = [
            {
              url: `https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(candidate)}`,
              parse: parseDictionaryApiDev
            },
            {
              url: `https://englishdictionaryapi.com/api/v1/words/${encodeURIComponent(candidate)}`,
              parse: parseEnglishDictionaryApi
            }
          ];

          for (const source of sources) {
            try {
              const response = await fetch(source.url);
              if (!response.ok) {
                continue;
              }
              const data = await response.json();
              const definition = source.parse(data);
              if (definition) {
                definitionCache.set(key, definition);
                definitionCache.set(candidate, definition);
                return definition;
              }
            } catch (_) {
            }
          }
        }
        return "";
      })();
      definitionPromiseCache.set(key, request);
      try {
        return await request;
      } finally {
        definitionPromiseCache.delete(key);
      }
    }

    function renderReport() {
      if (!successHistory.length) {
        reportSubtitle.textContent = "No accepted words yet.";
        reportList.innerHTML = `<div class="report-empty">Accepted words will appear here with their meanings.</div>`;
        return;
      }
      const loadedCount = successHistory.filter((entry) => entry.definitionState === "ready").length;
      reportSubtitle.textContent = `${successHistory.length} accepted words. ${loadedCount} definition${loadedCount === 1 ? "" : "s"} loaded.`;
      reportList.innerHTML = successHistory.map((entry) => {
        const definitionClass = entry.definitionState === "missing" ? "report-definition is-missing" : "report-definition";
        const rowClass = entry.definitionState === "pending" ? "report-row is-pending" : "report-row";
        const definitionText = entry.definitionState === "ready"
          ? entry.definition
          : entry.definitionState === "missing"
            ? "Definition unavailable for this word form."
            : "Loading definition...";
        return `
          <div class="${rowClass}">
            <div class="report-team">${escapeHtml(entry.teamName)}</div>
            <div class="report-word">${escapeHtml(entry.word)}</div>
            <div class="report-points">+${Number(entry.points) || 0} pts</div>
            <div class="${definitionClass}">${escapeHtml(definitionText)}</div>
          </div>
        `;
      }).join("");
    }

    function openReport() {
      renderReport();
      reportOverlay.classList.remove("hidden");
      closeReportBtn.focus();
    }

    function closeReport() {
      reportOverlay.classList.add("hidden");
    }

    function trackSuccessfulWord({ id, teamName, word, points }) {
      const cleanWord = String(word || "").trim();
      if (!id || !teamName || !cleanWord) {
        return;
      }
      const existing = successHistory.find((entry) => entry.id === id);
      if (existing) {
        return;
      }
      const cachedDefinition = definitionCache.get(cleanWord.toLowerCase());
      const historyEntry = {
        id,
        teamName,
        word: cleanWord,
        points: Number(points) || 0,
        definition: cachedDefinition || "",
        definitionState: cachedDefinition ? "ready" : "pending"
      };
      successHistory.unshift(historyEntry);
      renderReport();
      if (cachedDefinition) {
        return;
      }
      fetchWordDefinition(cleanWord).then((definition) => {
        const entry = successHistory.find((item) => item.id === id);
        if (!entry) {
          return;
        }
        entry.definition = definition || "";
        entry.definitionState = definition ? "ready" : "missing";
        renderReport();
      });
    }

    function fillLettersToTarget(target = maxActiveLetters) {
      while (activeLetters.length < target) {
        activeLetters.push(drawLetter());
      }
    }

    function closeConfirm(result = false) {
      if (!confirmState) {
        return;
      }
      const { resolve } = confirmState;
      confirmState = null;
      confirmOverlay.classList.add("hidden");
      resolve(result);
    }

    function openConfirm({ title, text, confirmLabel = "Continue" }) {
      confirmTitle.textContent = title;
      confirmText.textContent = text;
      confirmAcceptBtn.textContent = confirmLabel;
      confirmOverlay.classList.remove("hidden");
      confirmAcceptBtn.focus();
      return new Promise((resolve) => {
        confirmState = { resolve };
      });
    }

    async function removeLocalTeam(teamId, teamName) {
      const confirmed = await openConfirm({
        title: "Delete Team?",
        text: `${teamName} will be removed from the right panel.`,
        confirmLabel: "Delete"
      });
      if (!confirmed) {
        return;
      }
      teams = teams.filter((team) => team.id !== teamId);
      if (activeTeamId === teamId) {
        activeTeamId = "";
      }
      render();
    }

    async function removeLiveTeam(teamId, teamName) {
      if (!liveRoom) {
        return;
      }
      const confirmed = await openConfirm({
        title: "Remove Team?",
        text: `${teamName} will be removed from the live room.`,
        confirmLabel: "Remove"
      });
      if (!confirmed) {
        return;
      }
      const data = await liveApi("/api/live/remove-team", { code: liveRoom.code, teamId });
      liveRoom = data.room;
      teams = teams.filter((team) => team.id !== teamId);
      if (activeTeamId === teamId) {
        activeTeamId = "";
      }
      clearLiveSubmissionState();
      render();
    }

    function getTeamByLiveEntry(liveTeam) {
      return teams.find((team) => team.id === liveTeam.id)
        || teams.find((team) => team.name.toLowerCase() === String(liveTeam.name || "").toLowerCase())
        || null;
    }

    function syncLiveTeamsIntoScores() {
      if (!liveRoom) {
        return;
      }
      liveRoom.teams.forEach((liveTeam) => {
        const existing = getTeamByLiveEntry(liveTeam);
        if (existing) {
          existing.id = liveTeam.id;
          existing.name = liveTeam.name;
          existing.members = liveTeam.members;
          if (typeof liveTeam.score === "number") {
            existing.score = liveTeam.score;
          }
          return;
        }
        teams.push({
          id: liveTeam.id,
          name: liveTeam.name,
          score: typeof liveTeam.score === "number" ? liveTeam.score : 0,
          members: liveTeam.members
        });
      });
    }

    function clearLiveSubmissionState() {}

    function syncActiveLettersFromRoom() {
      if (!liveRoom || !Array.isArray(liveRoom.letters)) {
        return;
      }
      const nextLetters = liveRoom.letters.slice(0, maxActiveLetters);
      if (nextLetters.join("|") === activeLetters.join("|")) {
        return;
      }
      activeLetters = nextLetters;
      lastRenderedLettersKey = "";
    }

    function applyLiveRoomFeedback() {
      const feedback = liveRoom?.lastFeedback;
      if (!feedback?.id || feedback.id === lastHandledLiveFeedbackId) {
        return;
      }
      lastHandledLiveFeedbackId = feedback.id;
      const team = teams.find((item) => feedback.teamId && item.id === feedback.teamId)
        || teams.find((item) => item.name.toLowerCase() === String(feedback.teamName || "").toLowerCase())
        || null;
      const participantName = feedback.teamName || team?.name || "Student";
      const spokenWord = String(feedback.word || "").trim();
      liveBannerFeedbackId = feedback.id;

      setLiveAnswerBanner(buildSubmissionHeadline(participantName, spokenWord));

      if (feedback.tone === "good") {
        if (team) {
          celebrateTeam(team.id);
          showCelebration(team, {
            points: Number(feedback.points) || 0,
            word: spokenWord,
            consumedLetters: feedback.consumedLetters || []
          });
        }
        playSuccessSound();
        const scoreLine =
          `<strong>+${Number(feedback.points) || 0} pts</strong> ` +
          `(${Number(feedback.lettersScore) || 0} letters + ${Number(feedback.lengthBonus) || 0} length + ${Number(feedback.stealBonus) || 0} steal)`;
        setMessage(scoreLine, "good");
        trackSuccessfulWord({
          id: feedback.id,
          teamName: participantName,
          word: spokenWord,
          points: Number(feedback.points) || 0
        });
      } else {
        playErrorSound();
        setMessage(feedback.message || "Not valid.", "bad");
      }

      const bannerFeedbackId = feedback.id;
      fetchWordDefinition(spokenWord).then((definition) => {
        if (liveBannerFeedbackId !== bannerFeedbackId) {
          return;
        }
        setLiveAnswerBanner(buildSubmissionHeadline(participantName, spokenWord, definition));
      });
    }

    function setLiveAnswerBanner(text = "Student answers appear here.") {
      if (text === "Student answers appear here.") {
        liveBannerFeedbackId = "";
      }
      liveBannerHtml = text;
      renderInfoPanel();
    }

    function closeLiveSocket() {
      if (!liveSocket) {
        return;
      }
      try {
        liveSocket.close();
      } catch (_) {
      }
      liveSocket = null;
      liveSocketActive = false;
    }

    async function liveApi(path, body, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: method === "POST" ? { "Content-Type": "application/json" } : undefined,
        body: method === "POST" ? JSON.stringify(body || {}) : undefined
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || "Live request failed");
      }
      return data;
    }

    async function hydrateLiveBaseUrl() {
      if (!liveEnabled) {
        return;
      }
      try {
        const data = await liveApi("/api/live/server-info", null, "GET");
        const onLocalHost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
        if (onLocalHost && data?.localOrigin) {
          liveBaseUrl = data.localOrigin;
        } else if (data?.publicOrigin) {
          liveBaseUrl = data.publicOrigin;
        }
      } catch (_) {
      }
    }

    function getLiveJoinUrl() {
      if (!liveRoom) {
        return "";
      }
      return `${liveBaseUrl}/student.html?code=${encodeURIComponent(liveRoom.code)}`;
    }

    function persistLiveRoomCode() {
      if (!liveEnabled) {
        return;
      }
      try {
        if (liveRoom?.code) {
          window.localStorage.setItem(liveRoomStorageKey, liveRoom.code);
          return;
        }
        window.localStorage.removeItem(liveRoomStorageKey);
      } catch (_) {
      }
    }

    function getPersistedLiveRoomCode() {
      if (!liveEnabled) {
        return "";
      }
      try {
        return String(window.localStorage.getItem(liveRoomStorageKey) || "").trim().toUpperCase();
      } catch (_) {
        return "";
      }
    }

    function getLiveSocketUrl() {
      if (!liveRoom) {
        return "";
      }
      const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
      return `${protocol}//${window.location.host}/ws/live?code=${encodeURIComponent(liveRoom.code)}`;
    }

    async function syncLiveRoom(status = liveRoom?.status || "waiting", options = {}) {
      if (!liveEnabled || !liveRoom) {
        return;
      }
      const { lastSuccess, lastFeedback, podium, clearSubmissions } = options;
      const syncedTeams = liveRoom.teams.map((liveTeam) => {
        const localTeam = getTeamByLiveEntry(liveTeam) || { score: 0, name: liveTeam.name, id: liveTeam.id, members: liveTeam.members };
        return {
          id: liveTeam.id,
          name: liveTeam.name,
          members: liveTeam.members,
          score: localTeam.score || 0
        };
      });
      const data = await liveApi("/api/live/sync", {
        code: liveRoom.code,
        letters: activeLetters,
        status,
        lastSuccess,
        lastFeedback,
        podium,
        clearSubmissions,
        teams: syncedTeams
      });
      liveRoom = data.room;
      persistLiveRoomCode();
      matchFinished = liveRoom?.status === "finished";
      syncLiveTeamsIntoScores();
      syncActiveLettersFromRoom();
      applyLiveRoomFeedback();
      if (clearSubmissions) {
        clearLiveSubmissionState();
      }
      render();
    }

    function connectLiveSocket() {
      if (!liveEnabled || !liveRoom) {
        return;
      }
      closeLiveSocket();
      try {
        liveSocket = new WebSocket(getLiveSocketUrl());
      } catch (_) {
        liveSocket = null;
        liveSocketActive = false;
        return;
      }
      liveSocket.addEventListener("open", () => {
        liveSocketActive = true;
        if (livePollTimer) {
          clearTimeout(livePollTimer);
          livePollTimer = null;
        }
      });
      liveSocket.addEventListener("message", (event) => {
        try {
          const payload = JSON.parse(event.data);
          if (payload?.type !== "room" || !payload.room) {
            return;
          }
          liveRoom = payload.room;
          persistLiveRoomCode();
          matchFinished = liveRoom?.status === "finished";
          syncLiveTeamsIntoScores();
          syncActiveLettersFromRoom();
          applyLiveRoomFeedback();
          render();
        } catch (_) {
        }
      });
      liveSocket.addEventListener("close", () => {
        liveSocketActive = false;
        liveSocket = null;
        if (liveRoom && !livePollTimer) {
          pollLiveRoom();
        }
      });
      liveSocket.addEventListener("error", () => {
        liveSocketActive = false;
      });
    }

    async function pollLiveRoom() {
      if (!liveEnabled || !liveRoom || liveSocketActive) {
        return;
      }
      try {
        const data = await liveApi(`/api/live/room?code=${encodeURIComponent(liveRoom.code)}`, null, "GET");
        liveRoom = data.room;
        persistLiveRoomCode();
        matchFinished = liveRoom?.status === "finished";
        syncLiveTeamsIntoScores();
        syncActiveLettersFromRoom();
        applyLiveRoomFeedback();
        render();
      } catch (_) {
      } finally {
        livePollTimer = setTimeout(pollLiveRoom, 1000);
      }
    }

    async function initLiveRoom() {
      if (!liveEnabled) {
        return;
      }
      const persistedCode = getPersistedLiveRoomCode();
      if (persistedCode) {
        try {
          const existing = await liveApi(`/api/live/room?code=${encodeURIComponent(persistedCode)}`, null, "GET");
          liveRoom = existing.room;
        } catch (_) {
          try {
            window.localStorage.removeItem(liveRoomStorageKey);
          } catch (_) {
          }
        }
      }
      if (!liveRoom) {
        const data = await liveApi("/api/live/create-room");
        liveRoom = data.room;
      }
      persistLiveRoomCode();
      matchFinished = false;
      clearLiveSubmissionState();
      await syncLiveRoom("waiting");
      connectLiveSocket();
      if (livePollTimer) {
        clearTimeout(livePollTimer);
      }
      if (!liveSocketActive) {
        pollLiveRoom();
      }
    }

    async function startLiveGame() {
      if (!liveEnabled || !liveRoom || isGameFinished()) {
        return;
      }
      if (!liveRoom.teams?.length) {
        setMessage("Connect at least 1 player before going live.", "bad");
        playErrorSound();
        render();
        return;
      }
      const data = await liveApi("/api/live/start", { code: liveRoom.code });
      liveRoom = data.room;
      persistLiveRoomCode();
      matchFinished = false;
      clearLiveSubmissionState();
      await syncLiveRoom("live");
      render();
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function primeAudio() {
      if (audioPrimed) {
        return;
      }
      audioPrimed = true;
      if (sfxEnabled) {
        getAudioContext();
      }
      if (musicEnabled) {
        startBackgroundLoop();
      }
    }

    function tone({ frequency, start, duration, type = "sine", gain = 0.11 }) {
      if (!sfxEnabled) {
        return;
      }
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, start);
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.linearRampToValueAtTime(gain, start + 0.02);
      amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(amp);
      amp.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.03);
    }

    function playSuccessSound() {
      if (!sfxEnabled) {
        return;
      }
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      tone({ frequency: 523.25, start: now, duration: 0.14, type: "triangle", gain: 0.06 });
      tone({ frequency: 659.25, start: now + 0.08, duration: 0.16, type: "triangle", gain: 0.085 });
      tone({ frequency: 783.99, start: now + 0.16, duration: 0.24, type: "triangle", gain: 0.1 });
      tone({ frequency: 1046.5, start: now + 0.24, duration: 0.34, type: "sine", gain: 0.12 });
    }

    function playErrorSound() {
      if (!sfxEnabled) {
        return;
      }
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      tone({ frequency: 280, start: now, duration: 0.12, type: "square", gain: 0.095 });
      tone({ frequency: 220, start: now + 0.1, duration: 0.18, type: "square", gain: 0.085 });
    }

    function playPodiumSound() {
      if (!sfxEnabled) {
        return;
      }
      try {
        stopBackgroundLoop();
        podiumFanfare.pause();
        podiumFanfare.currentTime = 0;
        podiumFanfare.play().catch(() => {});
      } catch (_) {
      }
    }

    function startBackgroundLoop() {
      if (!musicEnabled || isGameFinished()) {
        return;
      }
      try {
        if (backgroundLoop.paused) {
          backgroundLoop.play().catch(() => {});
        }

    function stopBackgroundLoop(reset = false) {

      } catch (_) {

    function stopMusic() {

    function toggleSfx() {

        try {
          podiumFanfare.pause();
          podiumFanfare.currentTime = 0;
        } catch (_) {
        }
      }
      render();
    }

    function showCelebration(team, payload = {}) {
      const word = String(payload.word || "").trim().toUpperCase();
      const consumedLetters = Array.isArray(payload.consumedLetters) ? payload.consumedLetters : [];
      celebrationName.textContent = team.name;
      celebrationWord.style.setProperty("--word-length", String(Math.max(word.length || 0, 1)));
      celebrationWord.innerHTML = buildClaimWordMarkup(word || "WORD", consumedLetters);
      celebration.classList.add("is-visible");
      if (overlayTimer) {
        clearTimeout(overlayTimer);
      }
      overlayTimer = setTimeout(() => {
        celebration.classList.remove("is-visible");
      }, 1700);
    }

    function buildClaimWordMarkup(word, consumedLetters) {
      const counts = {};
      consumedLetters.forEach((letter) => {
        const key = String(letter || "").toUpperCase();
        counts[key] = (counts[key] || 0) + 1;
      });
      let usedIndex = 0;
      const letters = String(word || "").toUpperCase().split("");
      const usedStep = letters.length >= 7 ? 34 : letters.length >= 5 ? 46 : 62;
      const usedCap = letters.length >= 7 ? 110 : 180;
      return letters.map((letter, index) => {
        const isUsed = counts[letter] > 0;
        if (counts[letter] > 0) {
          counts[letter] -= 1;
        }
        const delay = isUsed ? Math.min(usedIndex * usedStep, usedCap) : 0;
        if (isUsed) {
          usedIndex += 1;
        }
        return `
          <div class="claim-letter-card ${isUsed ? "used-letter" : ""}" data-color="${colors[index % colors.length]}" style="--delay:${delay}ms; --tilt:${index % 2 === 0 ? -8 : 8}deg">
            <div class="claim-letter-score">${letterPoints[letter] || 0}</div>
            <div class="claim-letter-glyph">${letter}</div>
          </div>
        `;
      }).join("");
    }

    function resetGame() {
      podiumOverlay.classList.remove("is-visible");
      closeReport();
      podiumSoundPlayed = false;
      lastPodiumKey = "";
      try {
        podiumFanfare.pause();
        podiumFanfare.currentTime = 0;
      } catch (_) {
      }
      stopBackgroundLoop(true);
      activeLetters = [];
      fillLettersToTarget();
      lastRenderedLettersKey = "";
      activeTeamId = "";
      celebratingTeamId = "";
      matchFinished = false;
      successHistory = [];
      renderReport();
      teams = teams.map((team) => ({ ...team, score: 0 }));
      clearLiveSubmissionState();
      lastHandledLiveFeedbackId = "";
      setLiveAnswerBanner();
      clearMessage();
      if (liveRoom) {
        liveRoom.status = "waiting";
        liveRoom.lastSuccess = null;
        liveRoom.lastFeedback = null;
        liveRoom.podium = [];
        liveRoom.submissions = [];
      }
      persistLiveRoomCode();
      render();
      startBackgroundLoop();
      syncLiveRoom("waiting", { lastSuccess: null, lastFeedback: null, podium: [] }).catch(() => {});
    }

    function finishRound() {
      if (isGameFinished()) {
        return;
      }
      if (activeLetters.length === 0) {
        setMessage("No active round.", "bad");
        playErrorSound();
        return;
      }
      activeLetters = [];
      lastRenderedLettersKey = "";
      activeTeamId = "";
      celebratingTeamId = "";
      fillLettersToTarget();
      clearLiveSubmissionState();
      lastHandledLiveFeedbackId = "";
      setLiveAnswerBanner();
      clearMessage();
      render();
      syncLiveRoom(liveRoom?.status || "waiting", { lastSuccess: null, lastFeedback: null }).catch(() => {});
    }

    function celebrateTeam(teamId) {
      celebratingTeamId = teamId;
      if (celebrateTimer) {
        clearTimeout(celebrateTimer);
      }
      celebrateTimer = setTimeout(() => {
        celebratingTeamId = "";
        render();
      }, 760);
    }

    function renameTeam(teamId, nextName) {
      const cleanName = nextName.trim();
      const team = teams.find((item) => item.id === teamId);
      if (!team) {
        return;
      }
      team.name = cleanName || team.name;
      render();
    }

    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") {
        requestWakeLock();
        return;
      }
      releaseWakeLock();
    });

    window.addEventListener("focus", requestWakeLock);
    window.addEventListener("pointerdown", requestWakeLock, { passive: true });
    window.addEventListener("keydown", requestWakeLock);

    function renderCards() {
      const lettersKey = activeLetters.join("|");
      if (lettersKey === lastRenderedLettersKey) {
        return;
      }
      lastRenderedLettersKey = lettersKey;
      activeCards.innerHTML = "";
      if (activeLetters.length === 0) {
        return;
      }

      activeLetters.forEach((letter, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.color = String(colors[index % colors.length]);
        card.style.setProperty("--tilt", `${index % 2 === 0 ? -2 : 2}deg`);

        const value = document.createElement("div");
        value.className = "card-score";
        value.textContent = String(letterPoints[letter] || 0);

        const glyph = document.createElement("div");
        glyph.className = "card-letter";
        glyph.textContent = letter;

        card.appendChild(value);
        card.appendChild(glyph);
        activeCards.appendChild(card);
      });
    }

    function renderTeams() {
      teamList.innerHTML = "";
      const rankedTeamsSource = getScoreboardTeams();

      if (!rankedTeamsSource.length) {
        const empty = document.createElement("div");
        empty.className = "team-card waiting-card";
        empty.innerHTML = `<div class="team-name">Waiting for teams...</div>`;
        teamList.appendChild(empty);
        return;
      }

      rankedTeamsSource.forEach((team) => {
          const card = document.createElement("div");
          card.className = "team-card";
          if (team.id === activeTeamId) {
            card.classList.add("active-turn");
          }
          if (team.id === celebratingTeamId) {
            card.classList.add("is-celebrating");
          }

          const isLiveTeam = !!(liveEnabled && liveRoom && liveRoom.teams.some((item) => item.id === team.id));
          if (isLiveTeam) {
            card.innerHTML = `
              <div class="team-row">
                <div class="team-row-main">
                  <div class="team-name">${team.name}</div>
                </div>
                <div class="team-actions">
                  <div class="team-points">${team.score} pts</div>
                  <button class="delete-btn" type="button" aria-label="Remove ${team.name}">x</button>
                </div>
              </div>
            `;
            card.querySelector(".delete-btn").addEventListener("click", (event) => {
              event.stopPropagation();
              removeLiveTeam(team.id, team.name).catch(() => {});
            });
          } else {
            const row = document.createElement("div");
            row.className = "team-row";

            const input = document.createElement("input");
            input.className = "team-name";
            input.value = team.name;
            input.addEventListener("change", (event) => renameTeam(team.id, event.target.value));
            input.addEventListener("blur", (event) => renameTeam(team.id, event.target.value));

            const main = document.createElement("div");
            main.className = "team-row-main";
            main.appendChild(input);
            row.appendChild(main);

            const actions = document.createElement("div");
            actions.className = "team-actions";
            const score = document.createElement("div");
            score.className = "team-points";
            score.textContent = `${team.score} pts`;
            actions.appendChild(score);

            const removeBtn = document.createElement("button");
            removeBtn.className = "delete-btn";
            removeBtn.type = "button";
            removeBtn.setAttribute("aria-label", `Delete ${team.name}`);
            removeBtn.textContent = "x";
            removeBtn.addEventListener("click", (event) => {
              event.stopPropagation();
              removeLocalTeam(team.id, team.name).catch(() => {});
            });
            actions.appendChild(removeBtn);
            row.appendChild(actions);
            card.appendChild(row);
          }

          teamList.appendChild(card);
        });
    }

    function renderQrPeople() {
      if (!qrPeopleList) {
        return;
      }
      qrPeopleList.innerHTML = "";
      const connectedTeams = (liveRoom?.teams || [])
        .map((team) => getTeamByLiveEntry(team) || { id: team.id, name: team.name, score: 0 })
        .sort((a, b) => (b.score - a.score) || a.name.localeCompare(b.name));

      if (!connectedTeams.length) {
        const empty = document.createElement("div");
        empty.className = "qr-empty";
        empty.textContent = "Waiting for teams...";
        qrPeopleList.appendChild(empty);
        return;
      }

      connectedTeams.forEach((team) => {
        const row = document.createElement("div");
        row.className = "qr-person";
        row.innerHTML = `
          <div class="qr-person-main">
            <span>${team.name}</span>
          </div>
          <div class="qr-person-actions">
            <button class="delete-btn" type="button" aria-label="Remove ${team.name}">x</button>
          </div>
        `;
        row.querySelector(".delete-btn").addEventListener("click", (event) => {
          event.stopPropagation();
          removeLiveTeam(team.id, team.name).catch(() => {});
        });
        qrPeopleList.appendChild(row);
      });
    }

    function render() {
      renderCards();
      renderTeams();
      renderQrPeople();
      renderInfoPanel();
      updatePodiumVisibility();
      soundBtn.classList.toggle("is-on", musicEnabled);
      sfxBtn.classList.toggle("is-on", sfxEnabled);
      startLiveBtn.classList.toggle("is-on", liveRoom?.status === "live");
      qrLiveBtn.classList.toggle("is-on", liveRoom?.status === "live");
      const hasConnectedPlayers = Number(liveRoom?.teams?.length || 0) > 0;
      useLettersBtn.disabled = activeLetters.length === 0 || isGameFinished();
      startLiveBtn.disabled = isGameFinished() || !hasConnectedPlayers;
      qrLiveBtn.disabled = isGameFinished() || liveRoom?.status === "live" || !hasConnectedPlayers;
      if (liveEnabled && liveRoom) {
        qrRoomText.textContent = `Room ${liveRoom.code}`;
        qrUrlText.textContent = getLiveJoinUrl();
        qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=420x420&data=${encodeURIComponent(getLiveJoinUrl())}`;
      } else {
        qrRoomText.textContent = "";
        qrUrlText.textContent = "";
        qrImage.removeAttribute("src");
      }
    }

    useLettersBtn.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Refresh Letters?",
        text: "This will replace the current 8 letters with a fresh set.",
        confirmLabel: "Deal"
      });
      if (confirmed) {
        finishRound();
      }
    });
    startLiveBtn.addEventListener("click", async () => {
      if (liveRoom?.status === "live") {
        return;
      }
      const confirmed = await openConfirm({
        title: "Start Live Game?",
        text: "Waiting screens will switch to answer mode for connected students.",
        confirmLabel: "Start"
      });
      if (confirmed) {
        startLiveGame().then(() => {
          qrOverlay.classList.add("hidden");
        }).catch(() => {});
      }
    });
    qrLiveBtn.addEventListener("click", async () => {
      if (liveRoom?.status === "live") {
        return;
      }
      const confirmed = await openConfirm({
        title: "Start Live Game?",
        text: "Waiting screens will switch to answer mode for connected students.",
        confirmLabel: "Start"
      });
      if (confirmed) {
        startLiveGame().then(() => {
          qrOverlay.classList.add("hidden");
        }).catch(() => {});
      }
    });
    showQrBtn.addEventListener("click", () => {
      if (!liveRoom) {
        setMessage("Open this page through the local server first.", "bad");
        return;
      }
      qrOverlay.classList.remove("hidden");
    });
    closeQrBtn.addEventListener("click", () => {
      qrOverlay.classList.add("hidden");
    });
    qrOverlay.addEventListener("click", (event) => {
      if (event.target === qrOverlay) {
        qrOverlay.classList.add("hidden");
      }
    });
    confirmCancelBtn.addEventListener("click", () => closeConfirm(false));
    confirmAcceptBtn.addEventListener("click", () => closeConfirm(true));
    confirmOverlay.addEventListener("click", (event) => {
      if (event.target === confirmOverlay) {
        closeConfirm(false);
      }
    });
    closeReportBtn.addEventListener("click", closeReport);
    podiumReportBtn.addEventListener("click", openReport);
    reportOverlay.addEventListener("click", (event) => {
      if (event.target === reportOverlay) {
        closeReport();
      }
    });
    document.addEventListener("keydown", (event) => {
      primeAudio();
      if (!confirmOverlay.classList.contains("hidden")) {
        if (event.key === "Escape") {
          closeConfirm(false);
        }
        if (event.key === "Enter") {
          closeConfirm(true);
        }
        return;
      }
      if (!reportOverlay.classList.contains("hidden") && event.key === "Escape") {
        closeReport();
        return;
      }
    });
    soundBtn.addEventListener("click", toggleMusic);
    sfxBtn.addEventListener("click", toggleSfx);
    document.addEventListener("pointerdown", primeAudio, { once: true });
    document.addEventListener("touchstart", primeAudio, { once: true });
    window.addEventListener("beforeunload", (event) => {
      releaseWakeLock();
      const hasLiveRoom = !!liveRoom?.code;
      const hasConnectedPlayers = Number(liveRoom?.teams?.length || 0) > 0;
      const hasActiveMatch = (liveRoom?.status === "live") || (liveRoom?.status === "finished");
      if (!hasLiveRoom || (!hasConnectedPlayers && !hasActiveMatch)) {
        return;
      }
      event.preventDefault();
      event.returnValue = "";
    });
    resetBtn.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Reset Game?",
        text: "This will reset letters, scores, and the live session state.",
        confirmLabel: "Reset"
      });
      if (confirmed) {
        resetGame();
      }
    });
    podiumResetBtn.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Start New Match?",
        text: "This will close the podium and reset all scores and letters.",
        confirmLabel: "Reset"
      });
      if (confirmed) {
        podiumOverlay.classList.remove("is-visible");
        resetGame();
      }
    });
    resetGame();
    requestWakeLock().catch(() => {});
    hydrateLiveBaseUrl()
      .then(() => initLiveRoom())
      .catch(() => {});
  </script>
</body>
</html>
