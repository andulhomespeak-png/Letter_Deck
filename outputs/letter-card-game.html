<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letter Deck</title>
  <style>
    :root {
      --bg: #fff36b;
      --bg-deep: #ff8a00;
      --panel: rgba(255, 255, 255, 0.78);
      --panel-strong: rgba(255, 255, 255, 0.94);
      --ink: #160f2e;
      --ink-soft: #4a3f7a;
      --line: rgba(22, 15, 46, 0.18);
      --accent: #ff4d2d;
      --accent-soft: #ffe95b;
      --mint: #00d084;
      --blue: #2457ff;
      --pink: #ff2f92;
      --violet: #7a2cff;
      --shadow: 0 28px 70px rgba(67, 28, 145, 0.22);
      --shadow-soft: 0 16px 30px rgba(67, 28, 145, 0.14);
      --radius: 28px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: "Avenir Next Condensed", "Franklin Gothic Medium", "Trebuchet MS", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 10% 8%, rgba(255, 47, 146, 0.36), transparent 18%),
        radial-gradient(circle at 88% 12%, rgba(36, 87, 255, 0.34), transparent 16%),
        radial-gradient(circle at 50% 100%, rgba(0, 208, 132, 0.2), transparent 26%),
        linear-gradient(180deg, #fffcc5 0%, var(--bg) 42%, var(--bg-deep) 100%);
      overflow: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      inset: auto;
      width: 34vw;
      height: 34vw;
      border-radius: 50%;
      filter: blur(26px);
      pointer-events: none;
      opacity: 0.38;
      z-index: 0;
      animation: drift 14s ease-in-out infinite;
    }

    body::before {
      top: -8vw;
      left: -8vw;
      background: radial-gradient(circle, rgba(255, 47, 146, 0.5) 0%, rgba(255, 47, 146, 0) 70%);
    }

    body::after {
      right: -10vw;
      bottom: -12vw;
      background: radial-gradient(circle, rgba(36, 87, 255, 0.4) 0%, rgba(36, 87, 255, 0) 70%);
      animation-delay: -5s;
    }

    .page {
        width: min(1680px, calc(100% - 12px));
        margin: 0 auto;
        padding: 6px 0;
        position: relative;
        z-index: 1;
        height: 100dvh;
      }

    .app-shell {
        min-height: calc(100dvh - 12px);
        height: calc(100dvh - 12px);
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 8px;
      }

    .panel {
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.76), rgba(255, 247, 253, 0.82)),
        var(--panel);
        border: 1px solid rgba(255, 255, 255, 0.66);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 14px;
        backdrop-filter: blur(14px);
      }

    .topbar {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) 236px;
        gap: 6px;
        align-items: center;
        background:
          linear-gradient(135deg, rgba(255, 255, 255, 0.62), rgba(241, 234, 255, 0.9));
      }

    .brand {
        margin: 0;
        display: flex;
        align-items: center;
        min-height: 88px;
      }

    .brand-logo {
        display: block;
        width: auto;
        height: auto;
        max-width: min(31vw, 460px);
        max-height: 88px;
        filter: drop-shadow(0 10px 18px rgba(20, 12, 55, 0.18));
      }

    .button-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      width: 236px;
      justify-self: end;
      align-self: center;
    }

    .info-panel {
      min-height: 88px;
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 10px;
      padding: 8px 12px;
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.96), rgba(239, 244, 255, 0.9));
      border: 1px solid rgba(255, 255, 255, 0.72);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.7);
    }

    .info-copy {
      min-width: 0;
      display: grid;
      gap: 5px;
      align-content: center;
    }

    .info-headline,
    .info-detail {
      min-width: 0;
      line-height: 1.2;
    }

    .info-headline {
      font-size: clamp(0.98rem, 1.32vw, 1.15rem);
      font-weight: 900;
      color: var(--ink);
    }

    .info-detail {
      min-height: 1.3em;
      font-size: clamp(0.88rem, 1.03vw, 0.96rem);
      color: var(--ink-soft);
    }

    .info-detail.good {
      color: #0e6d52;
    }

    .info-detail.bad {
      color: #b83c20;
    }

    .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) 300px;
        gap: 10px;
        min-height: 0;
        height: 100%;
      }

    .playfield {
        display: grid;
        grid-template-rows: 1fr;
        gap: 10px;
        min-height: 0;
      }

    .sidebar {
        display: grid;
        grid-template-rows: auto 1fr auto;
        gap: 10px;
        align-content: start;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(236, 244, 255, 0.94));
      }

    .stat {
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid rgba(52, 31, 20, 0.08);
      border-radius: 999px;
      padding: 8px 12px;
      font-weight: 700;
      white-space: nowrap;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 18px;
      min-height: 0;
      align-content: stretch;
      perspective: 1200px;
    }

    .card {
      min-height: clamp(180px, 30dvh, 420px);
      border: 1px solid rgba(56, 31, 18, 0.12);
      border-radius: 38px;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 1), rgba(242, 247, 255, 1));
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 28px 48px rgba(31, 26, 23, 0.12),
        inset 0 1px 0 rgba(255, 255, 255, 0.9);
      transform: rotate(var(--tilt));
      position: relative;
      overflow: hidden;
      animation: cardDeal 320ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .card::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(130deg, rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0) 36%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.22), rgba(255, 255, 255, 0));
      pointer-events: none;
    }

    .card::after {
      content: "";
      position: absolute;
      inset: 14px;
      border-radius: 28px;
      border: 1px dashed rgba(52, 31, 20, 0.08);
      pointer-events: none;
    }

    .card[data-color="0"] { color: #ff3b30; }
    .card[data-color="1"] { color: #5b2be0; }
    .card[data-color="2"] { color: #10bf67; }
    .card[data-color="3"] { color: #f3c645; }
    .card[data-color="4"] { color: #ba60dc; }

    .card-letter {
      font-size: clamp(7rem, 18vw, 14rem);
      font-weight: 900;
      letter-spacing: -0.08em;
      line-height: 0.9;
      position: relative;
      z-index: 1;
    }

    .card-score {
      position: absolute;
      top: 22px;
      right: 22px;
      min-width: 42px;
      padding: 7px 10px 6px;
      border-radius: 999px;
      background: rgba(22, 15, 46, 0.08);
      border: 1px solid rgba(22, 15, 46, 0.08);
      color: rgba(22, 15, 46, 0.76);
      font-size: clamp(0.95rem, 1.6vw, 1.25rem);
      font-weight: 900;
      line-height: 1;
      text-align: center;
      box-shadow: 0 10px 18px rgba(31, 26, 23, 0.08);
      z-index: 1;
    }

    .team-name {
      width: 100%;
      border: 1px solid rgba(52, 31, 20, 0.1);
      border-radius: 18px;
      padding: 14px 16px;
      font: inherit;
      background: rgba(255, 255, 255, 0.88);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.8);
    }

    .team-name {
      padding: 10px 12px;
      font-size: 0.95rem;
      font-weight: 700;
    }

    .celebration {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      opacity: 0;
      transition: opacity 180ms ease;
      z-index: 20;
    }

    .celebration.is-visible {
      opacity: 1;
    }

    .celebration-burst {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 233, 91, 0.34), transparent 14%),
        radial-gradient(circle at 75% 24%, rgba(255, 47, 146, 0.3), transparent 16%),
        radial-gradient(circle at 66% 74%, rgba(36, 87, 255, 0.32), transparent 18%),
        radial-gradient(circle at 30% 78%, rgba(0, 208, 132, 0.28), transparent 16%),
        rgba(16, 9, 41, 0.38);
      animation: celebrateBackdrop 900ms ease;
    }

    .celebration-card {
      position: relative;
      padding: 28px 34px;
      min-width: min(86vw, 720px);
      border-radius: 36px;
      text-align: center;
      background:
        linear-gradient(145deg, rgba(255, 255, 255, 0.98), rgba(251, 243, 255, 0.98));
      box-shadow: 0 36px 80px rgba(24, 11, 58, 0.3);
      border: 2px solid rgba(255, 255, 255, 0.8);
      animation: celebratePop 900ms cubic-bezier(0.22, 1, 0.36, 1);
    }

    .celebration-label {
      margin: 0 0 10px;
      font-size: 0.9rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink-soft);
    }

    .celebration-name {
      margin: 0;
      font-size: clamp(2.8rem, 7vw, 5.8rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      color: var(--ink);
      text-shadow: 0 6px 20px rgba(255, 79, 163, 0.16);
    }

    .celebration-points {
      margin-top: 10px;
      font-size: clamp(1.1rem, 2vw, 1.5rem);
      font-weight: 800;
      color: #0f8f69;
      letter-spacing: 0.04em;
    }

    .podium-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(circle at top center, rgba(255, 233, 91, 0.22), transparent 26%),
        linear-gradient(180deg, rgba(12, 8, 34, 0.52), rgba(12, 8, 34, 0.76));
      z-index: 32;
      opacity: 0;
      pointer-events: none;
      transition: opacity 180ms ease;
    }

    .podium-overlay.is-visible {
      opacity: 1;
      pointer-events: auto;
    }

    .podium-modal {
      width: min(92vw, 980px);
      border-radius: 38px;
      padding: 24px 24px 28px;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(248,245,255,0.98));
      box-shadow: 0 44px 90px rgba(24, 11, 58, 0.34);
      border: 1px solid rgba(255, 255, 255, 0.9);
      display: grid;
      gap: 18px;
      text-align: center;
    }

    .podium-kicker {
      margin: 0;
      font-size: 0.88rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      font-weight: 800;
      color: var(--pink);
    }

    .podium-title {
      margin: 0;
      font-size: clamp(2.6rem, 6vw, 5rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .podium-subtitle {
      margin: 0;
      color: var(--ink-soft);
      font-size: clamp(1rem, 1.7vw, 1.18rem);
      font-weight: 700;
    }

    .podium-stage {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: end;
      min-height: 320px;
      padding-top: 6px;
    }

    .podium-place {
      position: relative;
      display: grid;
      align-content: end;
      gap: 10px;
      min-height: 220px;
      animation: podiumRise 720ms cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .podium-place[data-rank="1"] {
      animation-delay: 90ms;
    }

    .podium-place[data-rank="2"] {
      animation-delay: 0ms;
    }

    .podium-place[data-rank="3"] {
      animation-delay: 160ms;
    }

    .podium-badge {
      justify-self: center;
      min-width: 74px;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.92rem;
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: white;
      box-shadow: 0 16px 26px rgba(31, 26, 23, 0.16);
    }

    .podium-place[data-rank="1"] .podium-badge {
      background: linear-gradient(180deg, #ff7f52, #ff4d2d);
    }

    .podium-place[data-rank="2"] .podium-badge {
      background: linear-gradient(180deg, #5c77ff, #2457ff);
    }

    .podium-place[data-rank="3"] .podium-badge {
      background: linear-gradient(180deg, #12c977, #00a868);
    }

    .podium-team {
      display: grid;
      gap: 6px;
      justify-items: center;
      padding: 0 10px;
    }

    .podium-team-name {
      font-size: clamp(1.15rem, 2vw, 1.7rem);
      line-height: 1;
      font-weight: 900;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: var(--ink);
    }

    .podium-score {
      font-size: clamp(0.94rem, 1.4vw, 1.08rem);
      font-weight: 800;
      color: var(--ink-soft);
    }

    .podium-block {
      border-radius: 30px 30px 20px 20px;
      display: grid;
      place-items: center;
      color: white;
      font-size: clamp(2rem, 4vw, 3.2rem);
      font-weight: 900;
      text-shadow: 0 10px 18px rgba(0, 0, 0, 0.16);
      box-shadow: 0 26px 38px rgba(31, 26, 23, 0.16);
    }

    .podium-place[data-rank="1"] .podium-block {
      min-height: 170px;
      background: linear-gradient(180deg, #ffd85b, #ff9e1a);
    }

    .podium-place[data-rank="2"] .podium-block {
      min-height: 130px;
      background: linear-gradient(180deg, #6f89ff, #3859e8);
    }

    .podium-place[data-rank="3"] .podium-block {
      min-height: 102px;
      background: linear-gradient(180deg, #33db9a, #00a868);
    }

    .podium-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .qr-overlay {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: rgba(14, 10, 37, 0.76);
      z-index: 25;
      padding: 24px;
    }

    .qr-overlay.hidden {
      display: none !important;
    }

    .confirm-overlay {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: min(100vw, 390px);
      display: grid;
      align-items: start;
      justify-items: stretch;
      background: linear-gradient(270deg, rgba(14, 10, 37, 0.18), rgba(14, 10, 37, 0));
      z-index: 26;
      padding: 12px;
      pointer-events: none;
    }

    .confirm-overlay.hidden {
      display: none !important;
    }

    .confirm-modal {
      width: 100%;
      min-height: calc(100vh - 24px);
      border-radius: 28px;
      padding: 18px;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(251,243,255,0.99));
      box-shadow: 0 36px 80px rgba(24, 11, 58, 0.3);
      display: grid;
      gap: 14px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.9);
      align-content: start;
      pointer-events: auto;
    }

    .confirm-kicker {
      margin: 0;
      font-size: 0.82rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--pink);
      font-weight: 800;
    }

    .confirm-title {
      margin: 0;
      font-size: clamp(1.8rem, 4vw, 3rem);
      line-height: 0.92;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .confirm-text {
      margin: 0;
      color: var(--ink-soft);
      font-size: 1rem;
      line-height: 1.45;
    }

    .confirm-actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .qr-modal {
      width: min(92vw, 720px);
      max-height: calc(100dvh - 48px);
      overflow: auto;
      border-radius: 36px;
      padding: 24px;
      background: linear-gradient(145deg, rgba(255,255,255,0.99), rgba(251,243,255,0.99));
      box-shadow: 0 36px 80px rgba(24, 11, 58, 0.3);
      text-align: center;
      display: grid;
      gap: 16px;
    }

    .qr-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(220px, 260px);
      gap: 18px;
      align-items: start;
    }

    .qr-main {
      display: grid;
      gap: 14px;
    }

    .qr-modal h2 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.6rem);
      line-height: 0.9;
      letter-spacing: -0.06em;
      text-transform: uppercase;
    }

    .qr-box {
      width: min(100%, 420px);
      margin: 0 auto;
      background: white;
      border-radius: 26px;
      padding: 16px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
    }

    .qr-box img {
      display: block;
      width: 100%;
      height: auto;
    }

    .qr-url {
      word-break: break-all;
      color: var(--ink-soft);
      font-size: 1rem;
    }

    .qr-people {
      border-radius: 24px;
      padding: 14px;
      background: rgba(238, 235, 255, 0.72);
      border: 1px solid rgba(52, 31, 20, 0.06);
      display: grid;
      gap: 10px;
      text-align: left;
      min-height: 100%;
      align-content: start;
    }

    .qr-people-title {
      margin: 0;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--ink-soft);
      font-weight: 800;
    }

    .qr-people-list {
      display: grid;
      gap: 8px;
      max-height: 360px;
      overflow: auto;
      padding-right: 2px;
    }

    .qr-person {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(52, 31, 20, 0.06);
      font-weight: 700;
      color: var(--ink);
    }

    .qr-person-main,
    .team-row-main {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1 1 auto;
    }

    .qr-person-actions,
    .team-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex: 0 0 auto;
      min-width: 34px;
      justify-content: flex-end;
    }

    .qr-empty {
      color: var(--ink-soft);
      font-weight: 700;
      padding: 10px 4px;
    }

    .live-badge {
      background: linear-gradient(180deg, #ff63c1, var(--pink));
      color: white;
    }

    .side-title {
      margin: 0;
      font-size: 0.9rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--ink-soft);
    }

    .team-list {
      display: grid;
      gap: 8px;
      align-content: start;
    }

    .team-card {
      background: rgba(255, 255, 255, 0.76);
      border: 1px solid rgba(52, 31, 20, 0.08);
      border-radius: 18px;
      padding: 10px 12px;
      display: block;
      box-shadow: var(--shadow-soft);
      transition: transform 140ms ease, box-shadow 140ms ease, border-color 140ms ease;
    }

    .team-card.waiting-card {
      padding: 9px 12px;
      box-shadow: none;
      background: rgba(255, 255, 255, 0.52);
    }

    .team-card:hover {
      transform: translateY(-1px);
      box-shadow: 0 20px 26px rgba(31, 26, 23, 0.08);
    }

    .team-card.active-turn {
      border-color: rgba(255, 47, 146, 0.45);
      box-shadow:
        0 18px 28px rgba(255, 47, 146, 0.22),
        inset 0 0 0 2px rgba(255, 47, 146, 0.2);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.9), rgba(255, 220, 240, 0.98));
    }

    .team-card.is-celebrating {
      animation: teamCelebrate 720ms cubic-bezier(0.22, 1, 0.36, 1);
      border-color: rgba(0, 208, 132, 0.52);
      box-shadow:
        0 24px 36px rgba(0, 208, 132, 0.28),
        inset 0 0 0 2px rgba(0, 208, 132, 0.22);
      background:
        radial-gradient(circle at top center, rgba(255, 233, 91, 0.7), transparent 55%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(208, 255, 235, 0.96));
    }

    .team-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 8px;
      align-items: center;
    }

    .delete-btn {
      width: 34px;
      height: 34px;
      padding: 0;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(255, 112, 112, 0.96), rgba(255, 77, 45, 0.98));
      color: white;
      font-size: 1rem;
      font-weight: 900;
      line-height: 1;
      opacity: 0;
      visibility: hidden;
      transform: none;
      pointer-events: none;
      transition: opacity 120ms ease, visibility 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    .team-card:hover .delete-btn,
    .qr-person:hover .delete-btn {
      opacity: 1;
      visibility: visible;
      pointer-events: auto;
    }

    .delete-btn:hover {
      transform: none;
      box-shadow: 0 12px 20px rgba(31, 26, 23, 0.14);
    }

    .qr-person {
      min-height: 54px;
      border-radius: 18px;
      box-shadow: var(--shadow-soft);
    }

    .qr-people-list {
      display: grid;
      gap: 10px;
      align-content: start;
    }

    .qr-person-actions,
    .team-actions {
      min-width: 34px;
      justify-content: flex-end;
    }

    .definition-text {
      display: block;
      margin-top: 6px;
      font-size: 0.94rem;
      line-height: 1.4;
      color: var(--ink-soft);
    }

    .definition-inline {

      margin-left: 10px;

    .submission-word {
      margin-left: 10px;
      font-weight: 900;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .qr-room {
      margin-top: 10px;
      font-size: 0.92rem;
      font-weight: 800;
      letter-spacing: 0.04em;
      color: var(--ink-soft);
      text-transform: uppercase;
    }

    .team-points {
      font-weight: 700;
      text-align: right;
      border-radius: 999px;

      background: linear-gradient(180deg, rgba(240, 237, 255, 0.98), rgba(222, 231, 255, 0.98));

      letter-spacing: 0.02em;

    .team-card.waiting-card .team-name,
    .team-card.waiting-card .team-points {

    .team-card.waiting-card .team-name {

    .team-card.waiting-card .team-points {

    .team-card.is-celebrating .team-points {

    button {
      border: 0;
      border-radius: 999px;
      min-width: 0;
      padding: 8px 10px;
      font: inherit;
      font-weight: 700;
      font-size: 0.83rem;
      line-height: 1.05;
      cursor: pointer;
      transition: transform 120ms ease, opacity 120ms ease, background 120ms ease, box-shadow 120ms ease;
      box-shadow: 0 10px 18px rgba(31, 26, 23, 0.08);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 16px 24px rgba(31, 26, 23, 0.12);
    }

    button:disabled {
      cursor: not-allowed;

      transform: none;
    }

    .primary {
      background: linear-gradient(180deg, #4f46ff, #2412b8);
      color: white;
    }

    .secondary {
      background: linear-gradient(180deg, #fff27a, #ffcb2f);
      color: var(--ink);
    }

    .accent {
      background: linear-gradient(180deg, #ff7a45, var(--accent));
      color: white;
    }

    .ghost {
      background: rgba(255, 255, 255, 0.86);
      color: var(--ink);
      border: 1px solid rgba(31, 26, 23, 0.08);
    }

    .scorebar .accent,
    .scorebar .secondary,
    .scorebar .ghost {

    .sound-btn.is-on {

    .message:empty {
      opacity: 0;
      transform: translateY(4px);
      min-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
    }

    @keyframes cardDeal {
      from {
        opacity: 0;
        transform: translateY(18px) scale(0.96) rotate(var(--tilt));
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(var(--tilt));
      }
    }

    @keyframes drift {
      0%, 100% {
        transform: translate3d(0, 0, 0) scale(1);
      }
      50% {
        transform: translate3d(2vw, -1.2vw, 0) scale(1.06);
      }
    }

    @keyframes teamCelebrate {
      0% {
        transform: translateY(0) scale(1);
      }
      25% {
        transform: translateY(-6px) scale(1.03);
      }
      55% {
        transform: translateY(0) scale(1.015);
      }
      100% {
        transform: translateY(0) scale(1);
      }
    }

    @keyframes celebratePop {
      0% {
        opacity: 0;
        transform: translateY(32px) scale(0.84);
      }
      30% {
        opacity: 1;
        transform: translateY(-8px) scale(1.04);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @keyframes celebrateBackdrop {
      0% {
        opacity: 0;
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 1;
      }
    }

    @keyframes podiumRise {
      0% {
        opacity: 0;
        transform: translateY(40px) scale(0.92);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    @media (max-width: 980px) {
      .topbar,
      .workspace {
        grid-template-columns: 1fr;
      }

      .brand,
      .info-panel,
      .button-row {
        justify-self: center;
      }

      .info-panel {
        width: 100%;
      }

        grid-template-columns: 1fr;
      }

      .card {
        min-height: 200px;
      }

      .sidebar {
        grid-template-rows: auto auto auto;
      }

      .qr-layout {
        grid-template-columns: 1fr;

      .podium-stage {
        grid-template-columns: 1fr;
        min-height: 0;
      }

      .podium-place {
        min-height: 0;
      }

      .confirm-overlay {
        width: 100%;
      }
    }

    @media (max-height: 900px) {
      .page {
        width: min(1680px, calc(100% - 10px));
        padding: 5px 0;
      }

      .app-shell {
        min-height: calc(100dvh - 10px);
        height: calc(100dvh - 10px);
        gap: 6px;
      }

      .panel {
        padding: 12px;
      }

      .brand,
      .info-panel {
        min-height: 78px;
      }

      .qr-overlay {
        padding: 12px;
      }

      .qr-modal {
        width: min(94vw, 720px);
        max-height: calc(100dvh - 24px);
        padding: 18px;
        gap: 12px;
      }

      .qr-box {
        width: min(100%, 340px);
      }

      .qr-people-list {
        max-height: 260px;
      }

      .brand-logo {
        max-height: 76px;
      }

      .workspace {
        grid-template-columns: minmax(0, 1fr) 284px;
        gap: 8px;
      }

      .cards {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .card {
        min-height: clamp(156px, 25dvh, 320px);
        border-radius: 32px;
      }

      .card::after {
        inset: 12px;
        border-radius: 24px;
      }

      .card-letter {
        font-size: clamp(5.8rem, 14vw, 10.5rem);
      }

      .sidebar {
        gap: 8px;
      }

      .podium-stage {
        min-height: 280px;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <section class="app-shell">
      <header class="panel topbar">
        <h1 class="brand">
          <img class="brand-logo" src="./letter-clash-logo.png" alt="Letter Clash">
        </h1>
        <div class="info-panel">
          <div class="info-copy">
            <div class="info-headline" id="infoHeadline">Student answers appear here.</div>
            <div class="info-detail" id="infoDetail"></div>
          </div>
        </div>
        <div class="button-row">
          <button class="secondary" id="useLettersBtn">Clear</button>
          <button class="ghost" id="startLiveBtn">Live</button>
          <button class="ghost" id="showQrBtn">QR</button>
          <button class="ghost sound-btn" id="soundBtn">Sound</button>
          <button class="ghost" id="resetBtn">Reset</button>
        </div>
      </header>

      <section class="workspace">
        <section class="panel playfield">
          <div class="cards" id="activeCards"></div>
        </section>

        <aside class="panel sidebar">
          <h2 class="side-title">Teams</h2>
          <div class="team-list" id="teamList"></div>
        </aside>
      </section>
    </section>
  </main>

  <div class="qr-overlay hidden" id="qrOverlay">
    <div class="qr-modal">
      <h2>Scan To Join</h2>
      <div class="qr-layout">
        <div class="qr-main">
          <div class="qr-box">
            <img id="qrImage" alt="Room QR">
          </div>
          <div class="qr-room" id="qrRoomText"></div>
          <div class="qr-url" id="qrUrlText"></div>
        </div>
        <div class="qr-people">
          <p class="qr-people-title">Connected</p>
          <div class="qr-people-list" id="qrPeopleList"></div>
        </div>
      </div>
      <button class="primary" id="closeQrBtn">Close</button>
    </div>
  </div>

  <div class="confirm-overlay hidden" id="confirmOverlay">
    <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
      <p class="confirm-kicker">Confirm</p>
      <h2 class="confirm-title" id="confirmTitle">Are you sure?</h2>
      <p class="confirm-text" id="confirmText">This action may affect the current session.</p>
      <div class="confirm-actions">
        <button class="ghost" id="confirmCancelBtn">Cancel</button>
        <button class="accent" id="confirmAcceptBtn">Continue</button>
      </div>
    </div>
  </div>

  <div class="celebration" id="celebration">
    <div class="celebration-burst"></div>
    <div class="celebration-card">
      <p class="celebration-label">Correct Answer</p>
      <h2 class="celebration-name" id="celebrationName">Team 1</h2>
      <div class="celebration-points" id="celebrationPoints">+1 point</div>
    </div>
  </div>

  <div class="podium-overlay" id="podiumOverlay">
    <div class="podium-modal">
      <p class="podium-kicker">Game Over</p>
      <h2 class="podium-title">Top 3</h2>
      <p class="podium-subtitle" id="podiumSubtitle">First team to 1000 points wins.</p>
      <div class="podium-stage" id="podiumStage"></div>
      <div class="podium-actions">
        <button class="accent" id="podiumResetBtn">Play Again</button>
      </div>
    </div>
  </div>

  <script src="./english-words.js"></script>
  <script>
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
    const colors = [0, 1, 2, 3, 4];
    const dictionaryWords = typeof window.ENGLISH_WORDS_RAW === "string"
      ? window.ENGLISH_WORDS_RAW.split("\n")
      : [];
    const dictionary = new Set(dictionaryWords);

    let activeLetters = [];
    let activeTeamId = "";
    let celebratingTeamId = "";
    let teamIdCounter = 3;
    let liveRoom = null;
    let livePollTimer = null;
    let liveEnabled = window.location.protocol.startsWith("http");
    let liveBaseUrl = window.location.origin;
    let lastRenderedLettersKey = "";
    let teams = [
      { id: "team-1", name: "Team 1", score: 0 },
      { id: "team-2", name: "Team 2", score: 0 }
    ];

    const activeCards = document.getElementById("activeCards");
    const infoHeadlineEl = document.getElementById("infoHeadline");
    const infoDetailEl = document.getElementById("infoDetail");
    const useLettersBtn = document.getElementById("useLettersBtn");
    const startLiveBtn = document.getElementById("startLiveBtn");
    const showQrBtn = document.getElementById("showQrBtn");
    const resetBtn = document.getElementById("resetBtn");
    const teamList = document.getElementById("teamList");
    const soundBtn = document.getElementById("soundBtn");
    const qrOverlay = document.getElementById("qrOverlay");
    const qrImage = document.getElementById("qrImage");
    const qrRoomText = document.getElementById("qrRoomText");
    const qrUrlText = document.getElementById("qrUrlText");
    const qrPeopleList = document.getElementById("qrPeopleList");
    const closeQrBtn = document.getElementById("closeQrBtn");
    const confirmOverlay = document.getElementById("confirmOverlay");
    const confirmTitle = document.getElementById("confirmTitle");
    const confirmText = document.getElementById("confirmText");
    const confirmCancelBtn = document.getElementById("confirmCancelBtn");
    const confirmAcceptBtn = document.getElementById("confirmAcceptBtn");
    const celebration = document.getElementById("celebration");
    const celebrationName = document.getElementById("celebrationName");
    const celebrationPoints = document.getElementById("celebrationPoints");
    const podiumOverlay = document.getElementById("podiumOverlay");
    const podiumStage = document.getElementById("podiumStage");
    const podiumSubtitle = document.getElementById("podiumSubtitle");
    const podiumResetBtn = document.getElementById("podiumResetBtn");
    let celebrateTimer = null;
    let overlayTimer = null;
    let audioCtx = null;
    let musicGain = null;
    let musicTimer = null;
    let soundEnabled = false;
    let musicStep = 0;
    let confirmState = null;
    let latestDefinitionRequest = 0;
    let infoMessageHtml = "";
    let infoMessageTone = "";
    let liveBannerHtml = "Student answers appear here.";
    let seenLiveSubmissionIds = new Set();
    let queuedLiveSubmissions = [];
    let activeLiveSubmission = null;
    let matchFinished = false;
    const maxActiveLetters = 8;
    const winningScore = 1000;
    const letterPoints = {
      A: 1, E: 1, I: 1, O: 1, N: 1, R: 1, T: 1, L: 1, S: 1, U: 1,
      D: 2, G: 2,
      B: 3, C: 3, M: 3, P: 3,
      F: 4, H: 4, V: 4, W: 4, Y: 4,
      K: 5,
      J: 8, X: 8,
      Q: 10, Z: 10
    };
    const stealBonusPerLetter = 2;
    const definitionCache = new Map();

    function drawLetter() {
      return alphabet[Math.floor(Math.random() * alphabet.length)];
    }

    function getLengthBonus(length) {
      if (length >= 8) return 15;
      if (length === 7) return 10;
      if (length === 6) return 6;
      if (length === 5) return 3;
      if (length === 4) return 1;
      return 0;
    }

    function getLetterCounts(items) {
      return items.reduce((counts, item) => {
        counts[item] = (counts[item] || 0) + 1;
        return counts;
      }, {});
    }

    function getWordTableUsage(word) {
      const available = getLetterCounts(activeLetters);
      const consumed = {};
      const first = word[0];
      const last = word[word.length - 1];

      if (!available[first]) {
        return null;
      }
      available[first] -= 1;
      consumed[first] = (consumed[first] || 0) + 1;

      if (!available[last]) {
        return null;
      }
      available[last] -= 1;
      consumed[last] = (consumed[last] || 0) + 1;

      let stolenLetters = 0;
      for (let index = 1; index < word.length - 1; index += 1) {
        const letter = word[index];
        if (available[letter] > 0) {
          available[letter] -= 1;
          consumed[letter] = (consumed[letter] || 0) + 1;
          stolenLetters += 1;
        }
      }

      return { consumed, stolenLetters };
    }

    function getWordScore(word, stolenLetters = 0) {
      const lettersScore = word
        .split("")
        .reduce((total, letter) => total + (letterPoints[letter] || 0), 0);
      const lengthBonus = getLengthBonus(word.length);
      const stealBonus = stolenLetters * stealBonusPerLetter;
      return {
        lettersScore,
        lengthBonus,
        stealBonus,
        stolenLetters,
        total: lettersScore + lengthBonus + stealBonus
      };
    }

    function getScoreboardTeams() {
      const source = liveEnabled && liveRoom
        ? liveRoom.teams.map((team) => getTeamByLiveEntry(team) || { id: team.id, name: team.name, score: 0, members: team.members })
        : teams.slice();

      return source
        .slice()
        .sort((a, b) => (Number(b.score) - Number(a.score)) || String(a.name || "").localeCompare(String(b.name || "")));
    }

    function isGameFinished() {
      return matchFinished || (liveRoom?.status || "") === "finished";
    }

    function renderPodium() {
      const ranked = getScoreboardTeams().slice(0, 3);
      podiumStage.innerHTML = "";
      const visualOrder = [1, 0, 2];
      visualOrder.forEach((index) => {
        const team = ranked[index];
        if (!team) {
          return;
        }
        const place = document.createElement("div");
        const rank = index + 1;
        place.className = "podium-place";
        place.dataset.rank = String(rank);
        place.innerHTML = `
          <div class="podium-badge">#${rank}</div>
          <div class="podium-team">
            <div class="podium-team-name">${team.name}</div>
            <div class="podium-score">${team.score} pts</div>
          </div>
          <div class="podium-block">${rank}</div>
        `;
        podiumStage.appendChild(place);
      });
      const winner = ranked[0];
      podiumSubtitle.textContent = winner
        ? `${winner.name} reached ${winner.score} points and won the match.`
        : `First team to ${winningScore} points wins.`;
    }

    function updatePodiumVisibility() {
      if (isGameFinished()) {
        renderPodium();
        podiumOverlay.classList.add("is-visible");
        return;
      }
      podiumOverlay.classList.remove("is-visible");
    }

    function buildSubmissionHeadline(participantName, rawWord, definition = "") {
      const name = participantName || "Student";
      const word = String(rawWord || "").trim();
      const safeDefinition = definition
        ? `<span class="definition-inline">${definition}</span>`
        : "";
      return `<strong>${name}</strong><span class="submission-word">${word}</span>${safeDefinition}`;
    }

    function renderInfoPanel() {
      infoHeadlineEl.innerHTML = liveBannerHtml || "Student answers appear here.";
      infoDetailEl.className = infoMessageTone ? `info-detail ${infoMessageTone}` : "info-detail";
      infoDetailEl.innerHTML = infoMessageHtml || "";
    }

    function setMessage(text, tone = "") {
      infoMessageHtml = text;
      infoMessageTone = tone;
      renderInfoPanel();
    }

    function clearMessage() {
      infoMessageHtml = "";
      infoMessageTone = "";
      renderInfoPanel();
    }

    async function fetchWordDefinition(rawWord) {
      const key = String(rawWord || "").trim().toLowerCase();
      if (!key) {
        return "";
      }
      if (definitionCache.has(key)) {
        return definitionCache.get(key);
      }
      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(key)}`);
        if (!response.ok) {
          definitionCache.set(key, "");
          return "";
        }
        const data = await response.json();
        const definition = data?.[0]?.meanings?.flatMap((meaning) => meaning.definitions || [])
          ?.map((entry) => entry.definition)
          ?.find(Boolean) || "";
        definitionCache.set(key, definition);
        return definition;
      } catch (_) {
        definitionCache.set(key, "");
        return "";
      }
    }

    function fillLettersToTarget(target = maxActiveLetters) {
      while (activeLetters.length < target) {
        activeLetters.push(drawLetter());
      }
    }

    function closeConfirm(result = false) {
      if (!confirmState) {
        return;
      }
      const { resolve } = confirmState;
      confirmState = null;
      confirmOverlay.classList.add("hidden");
      resolve(result);
    }

    function openConfirm({ title, text, confirmLabel = "Continue" }) {
      confirmTitle.textContent = title;
      confirmText.textContent = text;
      confirmAcceptBtn.textContent = confirmLabel;
      confirmOverlay.classList.remove("hidden");
      confirmAcceptBtn.focus();
      return new Promise((resolve) => {
        confirmState = { resolve };
      });
    }

    function getActiveTeam() {
      return teams.find((team) => team.id === activeTeamId) || null;
    }

    async function removeLocalTeam(teamId, teamName) {
      const confirmed = await openConfirm({
        title: "Delete Team?",
        text: `${teamName} will be removed from the right panel.`,
        confirmLabel: "Delete"
      });
      if (!confirmed) {
        return;
      }
      teams = teams.filter((team) => team.id !== teamId);
      if (activeTeamId === teamId) {
        activeTeamId = "";
      }
      render();
    }

    async function removeLiveTeam(teamId, teamName) {
      if (!liveRoom) {
        return;
      }
      const confirmed = await openConfirm({
        title: "Remove Team?",
        text: `${teamName} will be removed from the live room.`,
        confirmLabel: "Remove"
      });
      if (!confirmed) {
        return;
      }
      const data = await liveApi("/api/live/remove-team", { code: liveRoom.code, teamId });
      liveRoom = data.room;
      teams = teams.filter((team) => team.id !== teamId);
      if (activeTeamId === teamId) {
        activeTeamId = "";
      }
      clearLiveSubmissionState();
      render();
    }

    function getTeamByLiveEntry(liveTeam) {
      return teams.find((team) => team.id === liveTeam.id)
        || teams.find((team) => team.name.toLowerCase() === String(liveTeam.name || "").toLowerCase())
        || null;
    }

    function getTeamBySubmission(submission) {
      return teams.find((team) => submission.teamId && team.id === submission.teamId)
        || teams.find((team) => team.name.toLowerCase() === String(submission.teamName || "").toLowerCase())
        || null;
    }

    function syncLiveTeamsIntoScores() {
      if (!liveRoom) {
        return;
      }
      liveRoom.teams.forEach((liveTeam) => {
        const existing = getTeamByLiveEntry(liveTeam);
        if (existing) {
          existing.id = liveTeam.id;
          existing.name = liveTeam.name;
          existing.members = liveTeam.members;
          if (typeof liveTeam.score === "number") {
            existing.score = liveTeam.score;
          }
          return;
        }
        teams.push({
          id: liveTeam.id,
          name: liveTeam.name,
          score: typeof liveTeam.score === "number" ? liveTeam.score : 0,
          members: liveTeam.members
        });
      });
    }

    function clearLiveSubmissionState() {
      activeLiveSubmission = null;
      queuedLiveSubmissions = [];
      seenLiveSubmissionIds = new Set((liveRoom?.submissions || []).map((item) => item.id));
    }

    function setLiveAnswerBanner(text = "Student answers appear here.") {
      liveBannerHtml = text;
      renderInfoPanel();
    }

    function evaluateWord(rawInput) {
      const rawWord = String(rawInput || "").trim().toLowerCase();
      const word = rawWord.toUpperCase();
      if (activeLetters.length < 2) {
        return { ok: false, message: "Need 2 cards on the table first." };
      }
      if (rawWord.length < 2) {
        return { ok: false, message: "Type a longer word." };
      }
      if (!/^[a-z]+$/.test(rawWord)) {
        return { ok: false, message: "Use only letters A-Z." };
      }
      if (!dictionary.has(rawWord)) {
        return { ok: false, message: `"${rawWord}" is not in the local dictionary.` };
      }
      const usage = getWordTableUsage(word);
      if (!usage) {
        return {
          ok: false,
          message: `"${rawWord}" is real, but it must start and end with ${activeLetters.join(" / ")}.`
        };
      }
      return { ok: true, rawWord, word, usage };
    }

    function activateNextLiveSubmission() {
      if (!liveRoom || liveRoom.status !== "live" || activeLiveSubmission || !queuedLiveSubmissions.length || isGameFinished()) {
        return;
      }
      activeLiveSubmission = queuedLiveSubmissions.shift();
      const team = getTeamBySubmission(activeLiveSubmission);
      if (team) {
        activeTeamId = team.id;
      }
      const evaluation = evaluateWord(activeLiveSubmission.word);
      const participantName = activeLiveSubmission.teamName;
      const spokenWord = String(activeLiveSubmission.word || "").trim();
      setLiveAnswerBanner(buildSubmissionHeadline(participantName, spokenWord));
      if (evaluation.ok) {
        completeValidWord(evaluation.word, evaluation.rawWord, evaluation.usage);
        return;
      }
      const definitionRequestId = ++latestDefinitionRequest;
      setMessage(evaluation.message, "bad");
      fetchWordDefinition(spokenWord).then((definition) => {
        if (definitionRequestId !== latestDefinitionRequest) {
          return;
        }
        setLiveAnswerBanner(buildSubmissionHeadline(participantName, spokenWord, definition));
      });
      playErrorSound();
      render();
      syncLiveRoom(liveRoom?.status || "live", {
        lastFeedback: {
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          teamId: activeLiveSubmission?.teamId || team?.id || "",
          teamName: participantName,
          word: spokenWord,
          tone: "bad",
          message: evaluation.message
        }
      }).catch(() => {});
      releaseActiveLiveSubmission();
    }

    function ingestLiveSubmissions() {
      if (!liveRoom || !Array.isArray(liveRoom.submissions)) {
        return;
      }
      const nextItems = liveRoom.submissions
        .slice()
        .reverse()
        .filter((item) => !seenLiveSubmissionIds.has(item.id));

      nextItems.forEach((item) => {
        seenLiveSubmissionIds.add(item.id);
        queuedLiveSubmissions.push(item);
      });

      activateNextLiveSubmission();
    }

    function releaseActiveLiveSubmission() {
      activeLiveSubmission = null;
      setTimeout(() => activateNextLiveSubmission(), 0);
    }

    async function liveApi(path, body, method = "POST") {
      const response = await fetch(path, {
        method,
        headers: method === "POST" ? { "Content-Type": "application/json" } : undefined,
        body: method === "POST" ? JSON.stringify(body || {}) : undefined
      });
      const data = await response.json();
      if (!response.ok || data.error) {
        throw new Error(data.error || "Live request failed");
      }
      return data;
    }

    async function hydrateLiveBaseUrl() {
      if (!liveEnabled) {
        return;
      }
      try {
        const data = await liveApi("/api/live/server-info", null, "GET");
        const onLocalHost = ["localhost", "127.0.0.1", "::1"].includes(window.location.hostname);
        if (onLocalHost && data?.localOrigin) {
          liveBaseUrl = data.localOrigin;
        } else if (data?.publicOrigin) {
          liveBaseUrl = data.publicOrigin;
        }
      } catch (_) {
      }
    }

    function getLiveJoinUrl() {
      if (!liveRoom) {
        return "";
      }
      return `${liveBaseUrl}/student.html?code=${encodeURIComponent(liveRoom.code)}`;
    }

    async function syncLiveRoom(status = liveRoom?.status || "waiting", options = {}) {
      if (!liveEnabled || !liveRoom) {
        return;
      }
      const { lastSuccess, lastFeedback, podium } = options;
      const syncedTeams = liveRoom.teams.map((liveTeam) => {
        const localTeam = getTeamByLiveEntry(liveTeam) || { score: 0, name: liveTeam.name, id: liveTeam.id, members: liveTeam.members };
        return {
          id: liveTeam.id,
          name: liveTeam.name,
          members: liveTeam.members,
          score: localTeam.score || 0
        };
      });
      const data = await liveApi("/api/live/sync", {
        code: liveRoom.code,
        letters: activeLetters,
        status,
        lastSuccess,
        lastFeedback,
        podium,
        teams: syncedTeams
      });
      liveRoom = data.room;
      matchFinished = liveRoom?.status === "finished";
      syncLiveTeamsIntoScores();
      render();
    }

    async function pollLiveRoom() {
      if (!liveEnabled || !liveRoom) {
        return;
      }
      try {
        const data = await liveApi(`/api/live/room?code=${encodeURIComponent(liveRoom.code)}`, null, "GET");
        liveRoom = data.room;
        matchFinished = liveRoom?.status === "finished";
        syncLiveTeamsIntoScores();
        ingestLiveSubmissions();
        render();
      } catch (_) {
      } finally {
        livePollTimer = setTimeout(pollLiveRoom, 1000);
      }
    }

    async function initLiveRoom() {
      if (!liveEnabled) {
        return;
      }
      const data = await liveApi("/api/live/create-room");
      liveRoom = data.room;
      matchFinished = false;
      clearLiveSubmissionState();
      await syncLiveRoom("waiting");
      if (livePollTimer) {
        clearTimeout(livePollTimer);
      }
      pollLiveRoom();
    }

    async function startLiveGame() {
      if (!liveEnabled || !liveRoom || isGameFinished()) {
        return;
      }
      const data = await liveApi("/api/live/start", { code: liveRoom.code });
      liveRoom = data.room;
      matchFinished = false;
      clearLiveSubmissionState();
      await syncLiveRoom("live");
      render();
    }

    function getAudioContext() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === "suspended") {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function tone({ frequency, start, duration, type = "sine", gain = 0.11 }) {
      if (!soundEnabled) {
        return;
      }
      const ctx = getAudioContext();
      const osc = ctx.createOscillator();
      const amp = ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(frequency, start);
      amp.gain.setValueAtTime(0.0001, start);
      amp.gain.linearRampToValueAtTime(gain, start + 0.02);
      amp.gain.exponentialRampToValueAtTime(0.0001, start + duration);
      osc.connect(amp);
      amp.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + duration + 0.03);
    }

    function playSuccessSound() {
      if (!soundEnabled) {
        return;
      }
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      tone({ frequency: 523.25, start: now, duration: 0.14, type: "triangle", gain: 0.06 });
      tone({ frequency: 659.25, start: now + 0.08, duration: 0.16, type: "triangle", gain: 0.085 });
      tone({ frequency: 783.99, start: now + 0.16, duration: 0.24, type: "triangle", gain: 0.1 });
      tone({ frequency: 1046.5, start: now + 0.24, duration: 0.34, type: "sine", gain: 0.12 });
    }

    function playErrorSound() {
      if (!soundEnabled) {
        return;
      }
      const ctx = getAudioContext();
      const now = ctx.currentTime;
      tone({ frequency: 280, start: now, duration: 0.12, type: "square", gain: 0.095 });
      tone({ frequency: 220, start: now + 0.1, duration: 0.18, type: "square", gain: 0.085 });
    }

    function stopMusic() {
      if (musicTimer) {
        clearTimeout(musicTimer);
        musicTimer = null;
      }
      if (musicGain && audioCtx) {
        musicGain.gain.cancelScheduledValues(audioCtx.currentTime);
        musicGain.gain.linearRampToValueAtTime(0.0001, audioCtx.currentTime + 0.2);
      }
    }

    function scheduleMusicLoop() {
      if (!soundEnabled) {
        return;
      }
      const ctx = getAudioContext();
      if (!musicGain) {
        musicGain = ctx.createGain();
        musicGain.gain.value = 0.095;
        musicGain.connect(ctx.destination);
      }

      const motif = [523.25, 659.25, 783.99, 659.25, 587.33, 659.25, 698.46, 783.99];
      const harmony = [392, 440, 523.25, 440, 392, 440, 493.88, 523.25];
      const bass = [130.81, 130.81, 174.61, 174.61, 146.83, 146.83, 196, 196];
      const baseTime = ctx.currentTime + 0.04;

      for (let i = 0; i < motif.length; i += 1) {
        const start = baseTime + i * 0.24;

        const lead = ctx.createOscillator();
        const leadGain = ctx.createGain();
        lead.type = i % 2 === 0 ? "triangle" : "square";
        lead.frequency.setValueAtTime(motif[(musicStep + i) % motif.length], start);
        leadGain.gain.setValueAtTime(0.0001, start);
        leadGain.gain.linearRampToValueAtTime(0.082, start + 0.018);
        leadGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.19);
        lead.connect(leadGain);
        leadGain.connect(musicGain);
        lead.start(start);
        lead.stop(start + 0.21);

        const pad = ctx.createOscillator();
        const padGain = ctx.createGain();
        pad.type = "sine";
        pad.frequency.setValueAtTime(harmony[(musicStep + i) % harmony.length], start);
        padGain.gain.setValueAtTime(0.0001, start);
        padGain.gain.linearRampToValueAtTime(0.026, start + 0.03);
        padGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.21);
        pad.connect(padGain);
        padGain.connect(musicGain);
        pad.start(start);
        pad.stop(start + 0.23);

        const low = ctx.createOscillator();
        const lowGain = ctx.createGain();
        low.type = "sine";
        low.frequency.setValueAtTime(bass[(musicStep + i) % bass.length], start);
        lowGain.gain.setValueAtTime(0.0001, start);
        lowGain.gain.linearRampToValueAtTime(0.055, start + 0.018);
        lowGain.gain.exponentialRampToValueAtTime(0.0001, start + 0.22);
        low.connect(lowGain);
        lowGain.connect(musicGain);
        low.start(start);
        low.stop(start + 0.24);
      }

      musicStep = (musicStep + 1) % motif.length;
      musicTimer = setTimeout(scheduleMusicLoop, 1650);
    }

    function toggleSound() {
      soundEnabled = !soundEnabled;
      soundBtn.classList.toggle("is-on", soundEnabled);
      soundBtn.textContent = soundEnabled ? "Sound On" : "Sound";
      if (soundEnabled) {
        getAudioContext();
        playSuccessSound();
      } else {
        stopMusic();
      }
    }

    function showCelebration(team, points) {
      celebrationName.textContent = team.name;
      celebrationPoints.textContent = `+${points} pts`;
      celebration.classList.add("is-visible");
      if (overlayTimer) {
        clearTimeout(overlayTimer);
      }
      overlayTimer = setTimeout(() => {
        celebration.classList.remove("is-visible");
      }, 1400);
    }

    function resetGame() {
      activeLetters = [];
      fillLettersToTarget();
      lastRenderedLettersKey = "";
      activeTeamId = "";
      celebratingTeamId = "";
      matchFinished = false;
      teams = teams.map((team) => ({ ...team, score: 0 }));
      clearLiveSubmissionState();
      setLiveAnswerBanner();
      clearMessage();
      if (liveRoom) {
        liveRoom.status = "waiting";
        liveRoom.lastSuccess = null;
        liveRoom.lastFeedback = null;
        liveRoom.podium = [];
        liveRoom.submissions = [];
      }
      render();
      syncLiveRoom("waiting", { lastSuccess: null, lastFeedback: null, podium: [] }).catch(() => {});
    }

    function finishRound() {
      if (isGameFinished()) {
        return;
      }
      if (activeLetters.length === 0) {
        setMessage("No active round.", "bad");
        playErrorSound();
        return;
      }
      activeLetters = [];
      lastRenderedLettersKey = "";
      activeTeamId = "";
      celebratingTeamId = "";
      fillLettersToTarget();
      clearLiveSubmissionState();
      setLiveAnswerBanner();
      clearMessage();
      render();
      syncLiveRoom(liveRoom?.status || "waiting", { lastSuccess: null, lastFeedback: null }).catch(() => {});
    }

    function celebrateTeam(teamId) {
      celebratingTeamId = teamId;
      if (celebrateTimer) {
        clearTimeout(celebrateTimer);
      }
      celebrateTimer = setTimeout(() => {
        celebratingTeamId = "";
        render();
      }, 760);
    }

    function assignTurn(teamId) {
      if (activeLetters.length < 2) {
        setMessage("Need 2 cards on the table first.", "bad");
        playErrorSound();
        return;
      }
      activeTeamId = teamId;
      clearMessage();
      render();
    }

    function changeScore(amount) {
      const team = getActiveTeam();
      if (!team) {
        setMessage("Assign a team turn first.", "bad");
        playErrorSound();
        return;
      }
      team.score = Math.max(0, team.score + amount);
      render();
    }

    function addTeam() {
      const nextId = `team-${teamIdCounter}`;
      teams.push({ id: nextId, name: `Team ${teamIdCounter}`, score: 0 });
      teamIdCounter += 1;
      render();
    }

    function renameTeam(teamId, nextName) {
      const cleanName = nextName.trim();
      const team = teams.find((item) => item.id === teamId);
      if (!team) {
        return;
      }
      team.name = cleanName || team.name;
      render();
    }

    function resetScores() {
      teams.forEach((team) => {
        team.score = 0;
      });
      clearMessage();
      render();
    }

    function consumeLettersForWord(consumedLetters) {
      const remaining = { ...consumedLetters };
      activeLetters = activeLetters.filter((letter) => {
        if (remaining[letter] > 0) {
          remaining[letter] -= 1;
          return false;
        }
        return true;
      });
    }

    function completeValidWord(word, rawWord, usage) {
      const team = getActiveTeam();
      const participantName = team?.name || activeLiveSubmission?.teamName || "Student";
      const scoreBreakdown = getWordScore(word, usage.stolenLetters);
      const consumedLetters = Object.entries(usage.consumed).flatMap(([letter, count]) => Array.from({ length: count }, () => letter));
      consumeLettersForWord(usage.consumed);
      lastRenderedLettersKey = "";

      if (team) {
        team.score += scoreBreakdown.total;
        celebrateTeam(team.id);
        showCelebration(team, scoreBreakdown.total);
        playSuccessSound();
      }

      const scoreLine =
        `<strong>+${scoreBreakdown.total} pts</strong> ` +
        `(${scoreBreakdown.lettersScore} letters + ${scoreBreakdown.lengthBonus} length + ${scoreBreakdown.stealBonus} steal)`;
      setLiveAnswerBanner(buildSubmissionHeadline(participantName, rawWord));
      setMessage(scoreLine, "good");

      const definitionRequestId = ++latestDefinitionRequest;
      fetchWordDefinition(rawWord).then((definition) => {
        if (!definition || definitionRequestId !== latestDefinitionRequest) {
          return;
        }
        setLiveAnswerBanner(buildSubmissionHeadline(participantName, rawWord, definition));
      });

      fillLettersToTarget();
      activeTeamId = "";

      const winner = getScoreboardTeams().find((entry) => Number(entry.score) >= winningScore) || null;
      const nextStatus = winner ? "finished" : (liveRoom?.status || "live");
      matchFinished = !!winner;
      if (liveRoom) {
        liveRoom.status = nextStatus;
      }

      render();
      syncLiveRoom(nextStatus, {
        lastSuccess: {
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          teamName: participantName,
          word: rawWord,
          consumedLetters
        },
        lastFeedback: {
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 8)}`,
          teamId: team?.id || activeLiveSubmission?.teamId || "",
          teamName: participantName,
          word: rawWord,
          consumedLetters,
          tone: "good",
          message: `+${scoreBreakdown.total} pts`
        },
        podium: winner ? getScoreboardTeams().slice(0, 3) : []
      }).catch(() => {});
      if (winner) {
        queuedLiveSubmissions = [];
        activeLiveSubmission = null;
        setMessage(`<strong>${winner.name}</strong> reached ${winner.score} pts. Final podium locked.`, "good");
      }
      releaseActiveLiveSubmission();
    }

    function renderCards() {
      const lettersKey = activeLetters.join("|");
      if (lettersKey === lastRenderedLettersKey) {
        return;
      }
      lastRenderedLettersKey = lettersKey;
      activeCards.innerHTML = "";
      if (activeLetters.length === 0) {
        return;
      }

      activeLetters.forEach((letter, index) => {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.color = String(colors[index % colors.length]);
        card.style.setProperty("--tilt", `${index % 2 === 0 ? -2 : 2}deg`);

        const value = document.createElement("div");
        value.className = "card-score";
        value.textContent = String(letterPoints[letter] || 0);

        const glyph = document.createElement("div");
        glyph.className = "card-letter";
        glyph.textContent = letter;

        card.appendChild(value);
        card.appendChild(glyph);
        activeCards.appendChild(card);
      });
    }

    function renderTeams() {
      teamList.innerHTML = "";
      const rankedTeamsSource = getScoreboardTeams();

      if (!rankedTeamsSource.length) {
        const empty = document.createElement("div");
        empty.className = "team-card waiting-card";
        empty.innerHTML = `<div class="team-name">Waiting for teams...</div>`;
        teamList.appendChild(empty);
        return;
      }

      rankedTeamsSource.forEach((team) => {
          const card = document.createElement("div");
          card.className = "team-card";
          if (team.id === activeTeamId) {
            card.classList.add("active-turn");
          }
          if (team.id === celebratingTeamId) {
            card.classList.add("is-celebrating");
          }

          const isLiveTeam = !!(liveEnabled && liveRoom && liveRoom.teams.some((item) => item.id === team.id));
          if (isLiveTeam) {
            card.innerHTML = `
              <div class="team-row">
                <div class="team-row-main">
                  <div class="team-name">${team.name}</div>
                </div>
                <div class="team-actions">
                  <div class="team-points">${team.score} pts</div>
                  <button class="delete-btn" type="button" aria-label="Remove ${team.name}">x</button>
                </div>
              </div>
            `;
            card.querySelector(".delete-btn").addEventListener("click", (event) => {
              event.stopPropagation();
              removeLiveTeam(team.id, team.name).catch(() => {});
            });
          } else {
            const row = document.createElement("div");
            row.className = "team-row";

            const input = document.createElement("input");
            input.className = "team-name";
            input.value = team.name;
            input.addEventListener("change", (event) => renameTeam(team.id, event.target.value));
            input.addEventListener("blur", (event) => renameTeam(team.id, event.target.value));

            const main = document.createElement("div");
            main.className = "team-row-main";
            main.appendChild(input);
            row.appendChild(main);

            const actions = document.createElement("div");
            actions.className = "team-actions";
            const score = document.createElement("div");
            score.className = "team-points";
            score.textContent = `${team.score} pts`;
            actions.appendChild(score);

            const removeBtn = document.createElement("button");
            removeBtn.className = "delete-btn";
            removeBtn.type = "button";
            removeBtn.setAttribute("aria-label", `Delete ${team.name}`);
            removeBtn.textContent = "x";
            removeBtn.addEventListener("click", (event) => {
              event.stopPropagation();
              removeLocalTeam(team.id, team.name).catch(() => {});
            });
            actions.appendChild(removeBtn);
            row.appendChild(actions);
            card.appendChild(row);
          }

          teamList.appendChild(card);
        });
    }

    function renderQrPeople() {
      if (!qrPeopleList) {
        return;
      }
      qrPeopleList.innerHTML = "";
      const connectedTeams = (liveRoom?.teams || [])
        .map((team) => getTeamByLiveEntry(team) || { id: team.id, name: team.name, score: 0 })
        .sort((a, b) => (b.score - a.score) || a.name.localeCompare(b.name));

      if (!connectedTeams.length) {
        const empty = document.createElement("div");
        empty.className = "qr-empty";
        empty.textContent = "Waiting for teams...";
        qrPeopleList.appendChild(empty);
        return;
      }

      connectedTeams.forEach((team) => {
        const row = document.createElement("div");
        row.className = "qr-person";
        row.innerHTML = `
          <div class="qr-person-main">
            <span>${team.name}</span>
          </div>
          <div class="qr-person-actions">
            <button class="delete-btn" type="button" aria-label="Remove ${team.name}">x</button>
          </div>
        `;
        row.querySelector(".delete-btn").addEventListener("click", (event) => {
          event.stopPropagation();
          removeLiveTeam(team.id, team.name).catch(() => {});
        });
        qrPeopleList.appendChild(row);
      });
    }

    function render() {
      renderCards();
      renderTeams();
      renderQrPeople();
      renderInfoPanel();
      updatePodiumVisibility();
      useLettersBtn.disabled = activeLetters.length === 0 || isGameFinished();
      startLiveBtn.disabled = isGameFinished();
      if (liveEnabled && liveRoom) {
        qrRoomText.textContent = `Room ${liveRoom.code}`;
        qrUrlText.textContent = getLiveJoinUrl();
        qrImage.src = `https://api.qrserver.com/v1/create-qr-code/?size=420x420&data=${encodeURIComponent(getLiveJoinUrl())}`;
      } else {
        qrRoomText.textContent = "";
        qrUrlText.textContent = "";
        qrImage.removeAttribute("src");
      }
    }

    useLettersBtn.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Refresh Letters?",
        text: "This will replace the current 8 letters with a fresh set.",
        confirmLabel: "Clear"
      });
      if (confirmed) {
        finishRound();
      }
    });
    startLiveBtn.addEventListener("click", async () => {
      if (liveRoom?.status === "live") {
        return;
      }
      const confirmed = await openConfirm({
        title: "Start Live Game?",
        text: "Waiting screens will switch to answer mode for connected students.",
        confirmLabel: "Start"
      });
      if (confirmed) {
        startLiveGame().catch(() => {});
      }
    });
    showQrBtn.addEventListener("click", () => {
      if (!liveRoom) {
        setMessage("Open this page through the local server first.", "bad");
        return;
      }
      qrOverlay.classList.remove("hidden");
    });
    closeQrBtn.addEventListener("click", () => {
      qrOverlay.classList.add("hidden");
    });
    qrOverlay.addEventListener("click", (event) => {
      if (event.target === qrOverlay) {
        qrOverlay.classList.add("hidden");
      }
    });
    confirmCancelBtn.addEventListener("click", () => closeConfirm(false));
    confirmAcceptBtn.addEventListener("click", () => closeConfirm(true));
    confirmOverlay.addEventListener("click", (event) => {
      if (event.target === confirmOverlay) {
        closeConfirm(false);
      }
    });
    document.addEventListener("keydown", (event) => {
      if (confirmOverlay.classList.contains("hidden")) {
        return;
      }
      if (event.key === "Escape") {
        closeConfirm(false);
      }
      if (event.key === "Enter") {
        closeConfirm(true);
      }
    });
    soundBtn.addEventListener("click", toggleSound);
    resetBtn.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Reset Game?",
        text: "This will reset letters, scores, and the live session state.",
        confirmLabel: "Reset"
      });
      if (confirmed) {
        resetGame();
      }
    });
    podiumResetBtn.addEventListener("click", async () => {
      const confirmed = await openConfirm({
        title: "Start New Match?",
        text: "This will close the podium and reset all scores and letters.",
        confirmLabel: "Reset"
      });
      if (confirmed) {
        resetGame();
      }
    });
    resetGame();
    hydrateLiveBaseUrl()
      .then(() => initLiveRoom())
      .catch(() => {});
  </script>
</body>
</html>
